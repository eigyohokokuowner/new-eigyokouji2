                  const installPct=(()=>{
                    const installEndRaw = proj && proj.KOJDAY ? proj.KOJDAY : (proj && proj.KOKT);
                    if(!proj || !validYMD(proj.SSDAY) || !validYMD(installEndRaw)) return null;
                    return computeEngagementPct(periods, proj.SSDAY, installEndRaw);
                  })();
                  // 従事期間が、工期全体（proj.KOKF〜proj.KOKT）に対してどれだけの割合を占めるか（％）を自動計算する
                  const jwariPct = proj ? computeEngagementPct(periods, proj.KOKF, proj.KOKT) : null;
                  return (
                    <tr key={i}>
                      <td>{editingRows ? <DTSelect value={r.POSICD} onChange={updEng(i,"POSICD")} options={trgtOpts}/> : lit(literalMap,"TRGT",r.POSICD)}</td>
                      {editingRows && <td>
                        <input className="dt-input mono" value={r.ENGCD||""} placeholder="コードまたは氏名"
                          autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
                          onChange={(e)=>updEng(i,"ENGCD")(e.target.value)}
                          onBlur={(e)=>{ const resolved=resolveEngcdByName(e.target.value); if(resolved) updEng(i,"ENGCD")(resolved); }}/>
                      </td>}
                      <td>{emp ? emp.ID_NAME : (editingRows ? "" : "(コード:"+r.ENGCD+")")}</td>
                      {editingRows ? (
                        <React.Fragment>
                          <td><span style={{display:"flex",gap:4}}><DTInput value={r.KOKF01} onChange={updEng(i,"KOKF01")} placeholder="自" mono/><DTInput value={r.KOKT01} onChange={updEng(i,"KOKT01")} placeholder="至" mono/></span></td>
                          <td><span style={{display:"flex",gap:4}}><DTInput value={r.KOKF02} onChange={updEng(i,"KOKF02")} placeholder="自" mono/><DTInput value={r.KOKT02} onChange={updEng(i,"KOKT02")} placeholder="至" mono/></span></td>
                          <td><span style={{display:"flex",gap:4}}><DTInput value={r.KOKF03} onChange={updEng(i,"KOKF03")} placeholder="自" mono/><DTInput value={r.KOKT03} onChange={updEng(i,"KOKT03")} placeholder="至" mono/></span></td>
                          <td className="num">{installPct===100 ? <span className="jwari-full">100%</span> : (installPct!==null ? installPct+"%" : "-")}</td>
                          <td className="num">{jwariPct===100 ? <span className="jwari-full">100%</span> : (jwariPct!==null ? jwariPct+"%" : "-")}</td>
                          <td><button className="btn-ghost" onClick={()=>removeEngRow(i)}><Ic.X size={13}/></button></td>
                        </React.Fragment>
                      ) : (
                        <React.Fragment>
                          <td>{per("KOKF01","KOKT01")}</td>
                          <td>{per("KOKF02","KOKT02")}</td>
                          <td>{per("KOKF03","KOKT03")}</td>
                          <td className="num">{installPct===100 ? <span className="jwari-full">100%</span> : (installPct!==null ? installPct+"%" : "-")}</td>
                          <td className="num">
                            {jwariPct===100
                              ? <span className="jwari-full">専任(100%)</span>
                              : (jwariPct!==null ? jwariPct+"%" : "-")}
                          </td>
                        </React.Fragment>
                      )}
                    </tr>
                  );
                })}
                {(editingRows ? engDraft.length : engRows.length)===0 && <tr><td colSpan={editingRows?9:7} className="empty">技術者情報がありません</td></tr>}
              </tbody>
            </table>
          </div>
          {editingRows && <button className="btn-outline" style={{marginTop:10}} onClick={addEngRow}><Ic.Plus/> 技術者を追加</button>}
        </div>
      }
    </div>
  );
}

/* ---------------- personnel qualification search (人事資格検索) ---------------- */
function fmtYMD8(s){ // BDAY等(YYYYMMDD)を年/月/日に
  return fmtDate(s);
}
function KindMark({on}){
  return <span className={"kindmark"+(on?" on":"")}>{on ? "○" : ""}</span>;
}
function PersonnelCard({emp, info, heldLicenses, licenses, literalMap, onRemove, canEdit, onSaveCertLink, onSaveKanriCert, onSaveEngInfo, onSaveLicenseRow, onDeleteLicenseRow}){
  const [editingLic,setEditingLic]=useState(null); // liccd being edited, or "__new__"
  const [licDraft,setLicDraft]=useState({});
  const [editingKanri,setEditingKanri]=useState(false);
  const [kanriDraft,setKanriDraft]=useState("");
  const [editingInfo,setEditingInfo]=useState(false);
  const [infoDraft,setInfoDraft]=useState({});
  const isOn=(v)=> v!==undefined && v!==null && String(parseFloat(v))==="1";
  const licenseSelectOpts=useMemo(()=>
    [...(licenses||[])].map((l)=>({code:l.LICCD, name:l.LICNM})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"))
  ,[licenses]);
  const kghoOpts=useMemo(()=>optionsFromLiteral(literalMap,"KGHO"),[literalMap]);

  const startEditLic=(l)=>{ setEditingLic(l.liccd); setLicDraft({LICCD:l.liccd, LICNO:l.rawLicno, SDAY:l.rawSday, KBN:l.rawKbn, CERT_URL:l.certUrl}); };
  const startAddLic=()=>{ setEditingLic("__new__"); setLicDraft({LICCD:"", LICNO:"", SDAY:"", KBN:"", CERT_URL:""}); };
  const saveLic=(originalLiccd)=>{
    if(!licDraft.LICCD){ return; }
    onSaveLicenseRow(emp.ENGCD, originalLiccd==="__new__" ? null : originalLiccd, licDraft);
    setEditingLic(null);
  };
  const deleteLic=(liccd)=>{ if(!confirmDeletePassword()) return; onDeleteLicenseRow(emp.ENGCD, liccd); };
  const saveKanri=()=>{ onSaveKanriCert(emp.ENGCD, kanriDraft.trim()); setEditingKanri(false); };

  const startEditInfo=()=>{ setInfoDraft({...(info||{})}); setEditingInfo(true); };
  const cancelEditInfo=()=>setEditingInfo(false);
  const saveInfo=()=>{ onSaveEngInfo(emp.ENGCD, infoDraft); setEditingInfo(false); };
  const inf=(field)=>infoDraft[field]||"";
  const setInf=(field)=>(v)=>setInfoDraft({...infoDraft, [field]:v});
  const gakaOpts=useMemo(()=>optionsFromLiteral(literalMap,"GAKA"),[literalMap]);

  const kindFields=[
    [["土","KDO"],["鋼","KKOU"]],
    [["建","KKEN"],["塗","KTO"]],
    [["電","KDEN"],["機","KKI"]],
    [["管","KKAN"],["水","KSUI"]],
  ];

  return (
    <div className="personnel-card">
      <div className="personnel-card-hd">
        <span className="personnel-card-name">{emp.ID_NAME}<span className="code" style={{marginLeft:8}}>#{emp.ENGCD}</span></span>
        <span style={{display:"flex", gap:8}}>
          {canEdit && (
            editingInfo ? (
              <React.Fragment>
                <button className="btn-primary" onClick={saveInfo}>保存する</button>
                <button className="btn-ghost" onClick={cancelEditInfo}>キャンセル</button>
              </React.Fragment>
            ) : (
              <button className="btn-outline" onClick={startEditInfo}><Ic.Edit/> 情報を編集</button>
            )
          )}
          <button className="btn-ghost" onClick={onRemove}><Ic.X size={13}/> 閉じる</button>
        </span>
      </div>
      <div className="table-wrap">
        <table className="detail-info-table">
          <tbody>
            <tr>
              <th>氏名</th><td>{emp.ID_NAME}</td>
              <th>フリガナ</th><td colSpan="5">{editingInfo ? <DTInput value={inf("FURI")} onChange={setInf("FURI")}/> : (info ? info.FURI : "-")}</td>
            </tr>
            <tr><th>所属</th><td colSpan="7">{[emp.DEPT, emp.POSITION].filter(Boolean).join(" ／ ") || (emp.COMPCD || "-")}</td></tr>
            <tr>
              <th>生年月日</th><td>{editingInfo ? <DTInput value={inf("BDAY")} onChange={setInf("BDAY")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.BDAY) : "-")}</td>
              <th>入社日</th><td>{editingInfo ? <DTInput value={inf("NDAY")} onChange={setInf("NDAY")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.NDAY) : "-")}</td>
              <th>卒業日</th><td colSpan="3">{editingInfo ? <DTInput value={inf("GDAY")} onChange={setInf("GDAY")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.GDAY) : "-")}</td>
            </tr>
            <tr>
              <th>学校名</th><td>{editingInfo ? <DTInput value={inf("FGAKU")} onChange={setInf("FGAKU")}/> : (info ? (info.FGAKU||"-") : "-")}</td>
              <th>学部名</th><td>{editingInfo ? <DTInput value={inf("GAKUB")} onChange={setInf("GAKUB")}/> : (info ? (info.GAKUB||"-") : "-")}</td>
              <th>学科名</th><td colSpan="3">{editingInfo ? <DTInput value={inf("GAKKA")} onChange={setInf("GAKKA")}/> : (info ? (info.GAKKA||"-") : "-")}</td>
            </tr>
            <tr><th>学科区分</th><td colSpan="7">{editingInfo ? <DTSelect value={inf("KBN")} onChange={setInf("KBN")} options={gakaOpts}/> : (info ? (lit(literalMap,"GAKA",info.KBN) || "-") : "-")}</td></tr>
          </tbody>
        </table>
      </div>

      <h3 className="detail-subhead">監理技術者資格情報</h3>
      <div className="table-wrap">
        <table className="detail-info-table">
          <tbody>
            <tr>
              <th>初回交付日</th><td>{editingInfo ? <DTInput value={inf("KFKBI")} onChange={setInf("KFKBI")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.KFKBI) : "-")}</td>
              <th>交付日</th><td>{editingInfo ? <DTInput value={inf("KFBI")} onChange={setInf("KFBI")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.KFBI) : "-")}</td>
              <th>交付番号</th><td>{editingInfo ? <DTInput value={inf("KFNO")} onChange={setInf("KFNO")} mono/> : (info ? (info.KFNO||"-") : "-")}</td>
              <th>有効期限</th><td>{editingInfo ? <DTInput value={inf("KLIMIT")} onChange={setInf("KLIMIT")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.KLIMIT) : "-")}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div className="table-wrap" style={{marginTop:10}}>
        <table className="detail-info-table kind-grid">
          <tbody>
            {kindFields.map((pair,pi)=>(
              <tr key={pi}>
                {pair.map(([label,field],ci)=>(
                  <React.Fragment key={ci}>
                    <th>該当工種：{label}</th>
                    <td>
                      {editingInfo
                        ? <input type="checkbox" checked={isOn(infoDraft[field])} onChange={(e)=>setInf(field)(e.target.checked?"1":"0")}/>
                        : <KindMark on={isOn(info&&info[field])}/>}
                    </td>
                  </React.Fragment>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h3 className="detail-subhead">監理技術者講習修了証</h3>
      <div className="table-wrap">
        <table className="detail-info-table">
          <tbody>
            <tr>
              <th>修了証番号</th><td colSpan="3">{editingInfo ? <DTInput value={inf("KSNO")} onChange={setInf("KSNO")} mono/> : (info ? (info.KSNO||"-") : "-")}</td>
              <th>終了年月日</th><td colSpan="3">{editingInfo ? <DTInput value={inf("KSYMD")} onChange={setInf("KSYMD")} placeholder="YYYYMMDD" mono/> : (info ? fmtDateEra(info.KSYMD) : "-")}</td>
            </tr>
            <tr>
              <th>監理技術者資格証</th>
              <td colSpan="7">
                {editingKanri ? (
                  <span style={{display:"flex", gap:6}}>
                    <DTInput value={kanriDraft} onChange={setKanriDraft} placeholder="資格証PDFのURLを貼り付け"/>
                    <button className="btn-outline" onClick={saveKanri}>保存</button>
                    <button className="btn-ghost" onClick={()=>setEditingKanri(false)}>取消</button>
                  </span>
                ) : (
                  <span style={{display:"flex", alignItems:"center", gap:8}}>
                    {info && info.KANRI_CERT_URL
                      ? <a className="corins-link" href={info.KANRI_CERT_URL} target="_blank" rel="noopener noreferrer"><Ic.Link size={12}/> 資格証を開く</a>
                      : <span style={{color:"var(--faint)"}}>-</span>}
                    {canEdit && <button className="btn-ghost" onClick={()=>{ setKanriDraft((info&&info.KANRI_CERT_URL)||""); setEditingKanri(true); }}><Ic.Edit size={12}/></button>}
                  </span>
                )}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <h3 className="detail-subhead">保有資格</h3>
      <div className="table-wrap">
        <table className="detail-table">
          <thead>
            <tr><th>資格名称</th><th>免許No</th><th>取得日</th><th>建設業法の資格区分</th><th>証明書</th>{canEdit && <th></th>}</tr>
          </thead>
          <tbody>
            {heldLicenses.map((l,i)=>{
              const editing=editingLic===l.liccd;
              return (
                <tr key={i}>
                  {editing ? (
                    <React.Fragment>
                      <td><DTSelect value={licDraft.LICCD} onChange={(v)=>setLicDraft({...licDraft, LICCD:v})} options={licenseSelectOpts}/></td>
                      <td><DTInput value={licDraft.LICNO} onChange={(v)=>setLicDraft({...licDraft, LICNO:v})}/></td>
                      <td><DTInput value={licDraft.SDAY} onChange={(v)=>setLicDraft({...licDraft, SDAY:v})} placeholder="YYYYMMDD" mono/></td>
                      <td><DTSelect value={licDraft.KBN} onChange={(v)=>setLicDraft({...licDraft, KBN:v})} options={kghoOpts}/></td>
                      <td><DTInput value={licDraft.CERT_URL} onChange={(v)=>setLicDraft({...licDraft, CERT_URL:v})} placeholder="証明書PDFのURL"/></td>
                      <td>
                        <span style={{display:"flex", gap:6}}>
                          <button className="btn-outline" onClick={()=>saveLic(l.liccd)}>保存</button>
                          <button className="btn-ghost" onClick={()=>setEditingLic(null)}>取消</button>
                        </span>
                      </td>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <td>{l.name}</td><td>{l.licno}</td><td>{l.acquired}</td><td>{l.kbn}</td>
                      <td>
                        {l.certUrl
                          ? <a className="corins-link" href={l.certUrl} target="_blank" rel="noopener noreferrer"><Ic.Link size={12}/> 証明書を開く</a>
                          : <span style={{color:"var(--faint)"}}>-</span>}
                      </td>
                      {canEdit &&
                        <td>
                          <span style={{display:"flex", gap:6}}>
                            <button className="btn-ghost" onClick={()=>startEditLic(l)}><Ic.Edit size={12}/></button>
                            <button className="btn-ghost" onClick={()=>deleteLic(l.liccd)}><Ic.X size={12}/></button>
                          </span>
                        </td>
                      }
                    </React.Fragment>
                  )}
                </tr>
              );
            })}
            {editingLic==="__new__" &&
              <tr>
                <td><DTSelect value={licDraft.LICCD} onChange={(v)=>setLicDraft({...licDraft, LICCD:v})} options={licenseSelectOpts}/></td>
                <td><DTInput value={licDraft.LICNO} onChange={(v)=>setLicDraft({...licDraft, LICNO:v})}/></td>
                <td><DTInput value={licDraft.SDAY} onChange={(v)=>setLicDraft({...licDraft, SDAY:v})} placeholder="YYYYMMDD" mono/></td>
                <td><DTSelect value={licDraft.KBN} onChange={(v)=>setLicDraft({...licDraft, KBN:v})} options={kghoOpts}/></td>
                <td><DTInput value={licDraft.CERT_URL} onChange={(v)=>setLicDraft({...licDraft, CERT_URL:v})} placeholder="証明書PDFのURL"/></td>
                <td>
                  <span style={{display:"flex", gap:6}}>
                    <button className="btn-outline" onClick={()=>saveLic("__new__")}>保存</button>
                    <button className="btn-ghost" onClick={()=>setEditingLic(null)}>取消</button>
                  </span>
                </td>
              </tr>
            }
            {heldLicenses.length===0 && editingLic!=="__new__" && <tr><td colSpan={canEdit?6:5} className="empty">保有資格の登録がありません</td></tr>}
          </tbody>
        </table>
      </div>
      {canEdit && editingLic===null &&
        <button className="btn-outline" style={{marginTop:10}} onClick={startAddLic}><Ic.Plus/> 資格を追加</button>
      }
    </div>
  );
}

function PersonnelQualification({employees, enginfoRecords, licenses, engLicenses, literalMap, canEdit, onSaveCertLink, onSaveKanriCert, onSaveEngInfo, onCreateEmployee, onSaveLicenseRow, onDeleteLicenseRow, initialEngcd, jumpNonce}){
  const [query,setQuery]=useState("");
  const [selectedList,setSelectedList]=useState([]);
  const [showNew,setShowNew]=useState(false);
  const [newDraft,setNewDraft]=useState({});
  const [newError,setNewError]=useState("");

  useEffect(()=>{
    if(initialEngcd){
      setSelectedList((list)=> list.includes(initialEngcd) ? list : [...list, initialEngcd]);
    }
  },[jumpNonce]);

  const enginfoMap=useMemo(()=>{
    const map={};
    (enginfoRecords||[]).forEach((r)=>{ map[r.ENGCD]=r; });
    return map;
  },[enginfoRecords]);

  const suggestions=useMemo(()=>{
    const q=query.trim();
    if(!q) return [];
    return employees
      .filter((e)=>e.STATUS!=="retired")
      .filter((e)=>(e.ID_NAME||"").includes(q) || (e.ENGCD||"").includes(q))
      .slice(0,20);
  },[employees, query]);

  const licenseMap=useMemo(()=>{
    const map={};
    (licenses||[]).forEach((l)=>{ map[l.LICCD]=l.LICNM; });
    return map;
  },[licenses]);

  const addPerson=(engcd)=>{
    if(!selectedList.includes(engcd)) setSelectedList([...selectedList, engcd]);
    setQuery("");
  };
  const removePerson=(engcd)=> setSelectedList(selectedList.filter((c)=>c!==engcd));
  const clearAll=()=> setSelectedList([]);

  const heldLicensesFor=(engcd)=>
    (engLicenses||[]).filter((r)=>r.ENGCD===engcd).map((r)=>({
      liccd: r.LICCD,
      name: licenseMap[r.LICCD] || ("資格("+r.LICCD+")"),
      licno: r.LICNO || "-",
      acquired: r.SDAY ? fmtDateEra(r.SDAY) : "-",
      kbn: lit(literalMap,"KGHO",r.KBN) || "-",
      certUrl: r.CERT_URL || "",
      rawLicno: r.LICNO || "",
      rawSday: r.SDAY || "",
      rawKbn: r.KBN || "",
    }));

  const openNewForm=()=>{ setNewDraft({}); setNewError(""); setShowNew(true); };
  const nf=(field)=>newDraft[field]||"";
  const setNf=(field)=>(v)=>setNewDraft({...newDraft, [field]:v});
  const createNew=()=>{
    const code=(newDraft.ENGCD||"").trim();
    if(!/^\d+$/.test(code)){ setNewError("技術者コードは数字で入力してください"); return; }
    if(employees.some((e)=>e.ENGCD===code)){ setNewError("そのコードは既に登録されています"); return; }
    if(!(newDraft.ID_NAME||"").trim()){ setNewError("氏名を入力してください"); return; }
    onCreateEmployee({ENGCD:code, COMPCD:(newDraft.COMPCD||"").trim(), ID_NAME:newDraft.ID_NAME.trim(), ID_SEI:"", ID_MEI:"", STATUS:"active"});
    setShowNew(false);
    addPerson(code);
  };

  return (
    <div className="card detail-card">
      <div className="res-hd">
        <div>
          <h2>人事資格検索</h2>
          <p className="sub">氏名または社員番号で検索し、複数人まとめて表示できます</p>
        </div>
        <span style={{display:"flex", gap:8}}>
          {canEdit && <button className="btn-outline" onClick={openNewForm}><Ic.Plus/> 新規技術者を登録</button>}
          {selectedList.length>0 &&
            <button className="btn-ghost" onClick={clearAll}><Ic.X size={13}/> 全て閉じる（{selectedList.length}名）</button>
          }
        </span>
      </div>

      {showNew &&
        <div className="master-add-form" style={{marginBottom:18}}>
          <DTInput value={nf("ENGCD")} onChange={setNf("ENGCD")} placeholder="技術者コード（数字）"/>
          <DTInput value={nf("ID_NAME")} onChange={setNf("ID_NAME")} placeholder="氏名"/>
          <DTInput value={nf("COMPCD")} onChange={setNf("COMPCD")} placeholder="所属コード（任意）"/>
          <button className="btn-primary" onClick={createNew}>登録する</button>
          <button className="btn-ghost" onClick={()=>setShowNew(false)}>キャンセル</button>
          {newError && <div className="m-form-err">{newError}</div>}
        </div>
      }

      <div className="msel" style={{maxWidth:560}}>
        <input type="text" className="kw-input" value={query}
          onChange={(e)=>setQuery(e.target.value)}
          placeholder="例）豊国太郎 または 123456"/>
        {query.trim() &&
          <div className="msel-panel" style={{maxHeight:260}}>
            <div className="msel-list">
              {suggestions.map((e)=>(
                <div key={e.ENGCD} className="msel-opt-personnel" onClick={()=>addPerson(e.ENGCD)}>
                  <div>
                    <span style={{fontFamily:"var(--mono)", fontSize:11, color:"var(--cyan)"}}>#{e.ENGCD}</span>
                    &nbsp;{e.ID_NAME}
                    {selectedList.includes(e.ENGCD) && <span style={{color:"var(--green)", fontSize:11, marginLeft:6}}>（追加済み）</span>}
                  </div>
                  <div style={{color:"var(--muted2)", fontSize:11}}>{[e.DEPT, e.POSITION].filter(Boolean).join(" ／ ") || e.COMPCD || ""}</div>
                </div>
              ))}
              {suggestions.length===0 && <div style={{fontSize:12,color:"var(--faint)",padding:"6px 8px"}}>該当する社員が見つかりません</div>}
            </div>
          </div>
        }
      </div>

      {selectedList.length===0 &&
        <div className="empty" style={{paddingTop:30}}>検索して技術者を追加すると、ここに表示されます（複数人追加可能）</div>
      }

      <div className="personnel-list">
        {selectedList.map((engcd)=>{
          const emp=employees.find((e)=>e.ENGCD===engcd);
          if(!emp) return null;
          return (
            <PersonnelCard key={engcd}
              emp={emp}
              info={enginfoMap[engcd]}
              heldLicenses={heldLicensesFor(engcd)}
              licenses={licenses}
              literalMap={literalMap}
              onRemove={()=>removePerson(engcd)}
              canEdit={canEdit}
              onSaveCertLink={onSaveCertLink}
              onSaveKanriCert={onSaveKanriCert}
              onSaveEngInfo={onSaveEngInfo}
              onSaveLicenseRow={onSaveLicenseRow}
              onDeleteLicenseRow={onDeleteLicenseRow}
            />
          );
        })}
      </div>
    </div>
  );
}

function EmployeeMaster({employees, onSave, licenses, engLicenses, onSaveEngLicenses}){
  const [query,setQuery]=useState("");
  const [editingCode,setEditingCode]=useState(null);
  const [editDraft,setEditDraft]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [newEmp,setNewEmp]=useState({ENGCD:"",COMPCD:"",ID_NAME:"",GENDER:""});
  const [formError,setFormError]=useState("");
  const [showImport,setShowImport]=useState(false);
  const [importPreview,setImportPreview]=useState(null);
  const [importError,setImportError]=useState("");
  const importInputRef=useRef(null);
  const [expandedLic,setExpandedLic]=useState(null);
  const [addLicCode,setAddLicCode]=useState("");

  const licenseMap=useMemo(()=>{
    const map={};
    (licenses||[]).forEach((l)=>{ map[l.LICCD]=l.LICNM; });
    return map;
  },[licenses]);
  const licenseOptionsSorted=useMemo(()=>
    [...(licenses||[])].sort((a,b)=>(a.LICNM||"").localeCompare(b.LICNM||"","ja"))
  ,[licenses]);
  const engLicMap=useMemo(()=>{
    const map={};
    (engLicenses||[]).forEach((r)=>{
      if(!map[r.ENGCD]) map[r.ENGCD]=[];
      map[r.ENGCD].push(r.LICCD);
    });
    return map;
  },[engLicenses]);

  const addLicenseTo=(engcd, liccd)=>{
    if(!liccd) return;
    if((engLicMap[engcd]||[]).includes(liccd)) return;
    onSaveEngLicenses([...(engLicenses||[]), {ENGCD:engcd, LICCD:liccd}]);
    setAddLicCode("");
  };
  const removeLicenseFrom=(engcd, liccd)=>{
    onSaveEngLicenses((engLicenses||[]).filter((r)=> !(r.ENGCD===engcd && r.LICCD===liccd)));
  };

  const filtered=useMemo(()=>{
    const q=query.trim();
    let list=[...employees].sort((a,b)=>(a.ID_NAME||"").localeCompare(b.ID_NAME||"","ja"));
    if(q) list=list.filter((e)=>(e.ID_NAME||"").includes(q) || (e.ENGCD||"").includes(q));
    return list;
  },[employees,query]);

  const activeCount=employees.filter((e)=>e.STATUS!=="retired").length;
  const retiredCount=employees.length-activeCount;

  const startEdit=(emp)=>{
    setEditingCode(emp.ENGCD);
    setEditDraft({ID_NAME:emp.ID_NAME||"", COMPCD:emp.COMPCD||"", GENDER:emp.GENDER||"", OFFICE_TECH:emp.OFFICE_TECH||""});
  };
  const cancelEdit=()=>{ setEditingCode(null); setEditDraft({}); };
  const saveEdit=(engcd)=>{
    const next=employees.map((e)=> e.ENGCD===engcd ? {...e, ID_NAME:editDraft.ID_NAME, COMPCD:editDraft.COMPCD, GENDER:editDraft.GENDER, OFFICE_TECH:editDraft.OFFICE_TECH} : e);
    onSave(next);
    setEditingCode(null);
  };
  const toggleStatus=(emp)=>{
    const next=employees.map((e)=> e.ENGCD===emp.ENGCD ? {...e, STATUS: e.STATUS==="retired" ? "active" : "retired"} : e);
    onSave(next);
  };
  const addEmployee=()=>{
    const code=newEmp.ENGCD.trim();
    if(!/^\d+$/.test(code)){ setFormError("技術者コードは数字で入力してください"); return; }
    if(employees.some((e)=>e.ENGCD===code)){ setFormError("そのコードは既に登録されています"); return; }
    if(!newEmp.ID_NAME.trim()){ setFormError("氏名を入力してください"); return; }
    const rec={ENGCD:code, COMPCD:newEmp.COMPCD.trim(), ID_NAME:newEmp.ID_NAME.trim(), ID_SEI:"", ID_MEI:"", GENDER:newEmp.GENDER||"", STATUS:"active"};
    onSave([...employees, rec]);
    setNewEmp({ENGCD:"",COMPCD:"",ID_NAME:"",GENDER:""});
    setShowAdd(false);
    setFormError("");
  };

  const handleImportFile=async (file)=>{
    setImportError("");
    setImportPreview(null);
    try{
      let rowsGrid=[];
      const lower=file.name.toLowerCase();
      if(lower.endsWith(".xlsx") || lower.endsWith(".xls")){
        const buf=await file.arrayBuffer();
        const wb=XLSX.read(buf, {type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rowsGrid=XLSX.utils.sheet_to_json(sheet, {header:1});
      } else {
        const text=await file.text();
        const parsed=Papa.parse(text, {skipEmptyLines:true});
        rowsGrid=parsed.data||[];
      }

      // 「在籍社員No／部署／役職」のような見出し行を探す（見つかれば部署・役職も取り込む）
      let headerInfo=null;
      for(let i=0;i<Math.min(rowsGrid.length,5);i++){
        const row=(rowsGrid[i]||[]).map((c)=>String(c||"").trim());
        const codeIdx=row.findIndex((c)=>c.includes("社員No")||c.includes("技術者コード")||c==="ID"||c==="コード");
        if(codeIdx>=0){
          const deptIdx=row.findIndex((c)=>c.includes("部署")||c.includes("所属"));
          const posIdx=row.findIndex((c)=>c.includes("役職"));
          headerInfo={headerRow:i, codeIdx, deptIdx, posIdx};
          break;
        }
      }

      const normalize=(s)=> /^\d+$/.test(s) ? String(parseInt(s,10)) : s;
      const deptPosMap={};
      let rawCodes=[];

      if(headerInfo){
        for(let r=headerInfo.headerRow+1; r<rowsGrid.length; r++){
          const row=rowsGrid[r]||[];
          const codeRaw=String(row[headerInfo.codeIdx]===undefined||row[headerInfo.codeIdx]===null?"":row[headerInfo.codeIdx]).trim();
          if(!/^[0-9A-Za-z]+$/.test(codeRaw)) continue;
          rawCodes.push(codeRaw);
          if(/^\d+$/.test(codeRaw)){
            const dept=headerInfo.deptIdx>=0 ? String(row[headerInfo.deptIdx]||"").replace(/\u3000/g," ").trim() : "";
            const position=headerInfo.posIdx>=0 ? String(row[headerInfo.posIdx]||"").trim() : "";
            deptPosMap[normalize(codeRaw)]={dept, position};
          }
        }
      } else {
        const cells=[];
        rowsGrid.forEach((row)=>{ (row||[]).forEach((c)=>cells.push(c)); });
        rawCodes=cells
          .map((c)=>String(c===undefined||c===null?"":c).trim())
          .filter((s)=>/^[0-9A-Za-z]+$/.test(s));
      }

      if(rawCodes.length===0){
        setImportError("コードを1件も読み取れませんでした。1列に技術者コードが並んだファイルか確認してください。");
        return;
      }
      // 技術者コードは6桁管理だが、ファイル・社員データ側で桁数の表記ゆれ（先頭ゼロの有無）があるため、
      // 数字のみのコードは数値として正規化して突合する（"41"も"000041"も同じ扱いになる）。
      // 英字混じりなど数値化できないものは対象外として分けておく。
      const excluded=rawCodes.filter((s)=>!/^\d+$/.test(s));
      const activeNormSet=new Set(rawCodes.filter((s)=>/^\d+$/.test(s)).map(normalize));

      const existingNorm=employees.map((e)=>({emp:e, norm:normalize(e.ENGCD||"")}));
      const unmatched=[...activeNormSet].filter((n)=> !existingNorm.some((x)=>x.norm===n));
      const matchedCount=existingNorm.filter((x)=>activeNormSet.has(x.norm)).length;
      setImportPreview({
        activeNormSet,
        deptPosMap,
        hasDeptInfo: !!(headerInfo && (headerInfo.deptIdx>=0 || headerInfo.posIdx>=0)),
        totalListed: activeNormSet.size,
        matchedCount,
        toRetireCount: employees.length-matchedCount,
        unmatched,
        excluded,
        filename: file.name,
      });
    }catch(e){
      setImportError("ファイルを読み取れませんでした（"+e.message+"）");
    }
  };

  const applyImport=()=>{
    if(!importPreview) return;
    const normalize=(s)=> /^\d+$/.test(s) ? String(parseInt(s,10)) : s;
    const next=employees.map((e)=>{
      const norm=normalize(e.ENGCD||"");
      const isActive=importPreview.activeNormSet.has(norm);
      const dp=importPreview.deptPosMap[norm];
      return {
        ...e,
        STATUS: isActive ? "active" : "retired",
        DEPT: dp ? dp.dept : e.DEPT,
        POSITION: dp ? dp.position : e.POSITION,
      };
    });
    onSave(next);
    setImportPreview(null);
    setShowImport(false);
  };

  return (
    <div className="card">
      <div className="res-hd">
        <div>
          <h2>技術者在籍・所属管理</h2>
          <p className="sub">{employees.length}名登録中（在職 {activeCount}名 ／ 退職 {retiredCount}名）</p>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button className="btn-outline" onClick={()=>{ setShowImport((v)=>!v); setImportError(""); setImportPreview(null); }}>
            <Ic.Upload/> 在籍社員リストを取り込む
          </button>
          <button className="btn-outline" onClick={()=>{ setShowAdd((v)=>!v); setFormError(""); }}>
            <Ic.Plus/> 新規社員を登録
          </button>
        </div>
      </div>

      {showImport &&
        <div className="master-add-form" style={{flexDirection:"column", alignItems:"stretch"}}>
          <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 10px"}}>
            現在の在職者コード一覧（.csv または .xlsx、1列に技術者コードが並んだもの）を読み込むと、
            リストに載っている社員を「在職」、載っていない社員を「退職」に一括更新します。
          </p>
          <div className="drop" style={{padding:"20px"}} onClick={()=>importInputRef.current && importInputRef.current.click()}>
            <Ic.Upload color="var(--accent)"/>
            <p>ファイルをクリックして選択</p>
            <input ref={importInputRef} type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}}
              onChange={(e)=>{ if(e.target.files[0]) handleImportFile(e.target.files[0]); }}/>
          </div>

          {importError && <div className="err-box" style={{marginTop:10}}><Ic.Warn/><div>{importError}</div></div>}

          {importPreview &&
            <div style={{marginTop:12, fontSize:12.5}}>
              <p style={{margin:"0 0 6px"}}>
                「{importPreview.filename}」から <b>{importPreview.totalListed}</b> 件のコードを読み取りました。
                適用すると、既存の社員データ {employees.length}名のうち
                <b style={{color:"var(--green)"}}> 在職 {importPreview.matchedCount}名</b> ／
                <b style={{color:"var(--red)"}}> 退職 {importPreview.toRetireCount}名</b> になります。
                {importPreview.hasDeptInfo && <span> あわせて部署・役職も更新されます。</span>}
              </p>
              {importPreview.unmatched.length>0 &&
                <div className="storage-warn" style={{marginTop:8}}>
                  <Ic.Warn/> リストには載っているが社員データに未登録のコードが{importPreview.unmatched.length}件あります（今回は反映されません。先に「新規社員を登録」で追加してください）：<br/>
                  <span style={{fontFamily:"var(--mono)"}}>{importPreview.unmatched.join(", ")}</span>
                </div>
              }
              {importPreview.excluded.length>0 &&
                <div className="storage-warn" style={{marginTop:8}}>
                  <Ic.Warn/> 数字のみのコードとして解釈できず、対象外にしたもの({importPreview.excluded.length}件)：<br/>
                  <span style={{fontFamily:"var(--mono)"}}>{importPreview.excluded.join(", ")}</span>
                </div>
              }
              <div style={{display:"flex", gap:10, marginTop:12}}>
                <button className="btn-primary" onClick={applyImport}>この内容で適用する</button>
                <button className="btn-ghost" onClick={()=>{ setImportPreview(null); setShowImport(false); }}>キャンセル</button>
              </div>
            </div>
          }
        </div>
      }

      {showAdd &&
        <div className="master-add-form">
          <input type="text" placeholder="技術者コード（数字）" value={newEmp.ENGCD}
            onChange={(e)=>setNewEmp({...newEmp, ENGCD:e.target.value})}/>
          <input type="text" placeholder="氏名" value={newEmp.ID_NAME}
            onChange={(e)=>setNewEmp({...newEmp, ID_NAME:e.target.value})}/>
          <select value={newEmp.GENDER} onChange={(e)=>setNewEmp({...newEmp, GENDER:e.target.value})}>
            <option value="">性別未設定</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
          </select>
          <input type="text" placeholder="所属コード（任意）" value={newEmp.COMPCD}
            onChange={(e)=>setNewEmp({...newEmp, COMPCD:e.target.value})}/>
          <button className="btn-primary" onClick={addEmployee}>登録する</button>
          {formError && <span className="m-form-err">{formError}</span>}
        </div>
      }

      <input type="text" className="kw-input" style={{marginTop:14, marginBottom:12, maxWidth:320}}
        value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="氏名・社員番号で検索"/>

      {(()=>{
        const renderRow=(emp)=>{
          const retired=emp.STATUS==="retired";
          const isEditing=editingCode===emp.ENGCD;
          const licCodes=engLicMap[emp.ENGCD]||[];
          const licOpen=expandedLic===emp.ENGCD;
          return (
            <React.Fragment key={emp.ENGCD}>
            <div className={"master-row"+(retired?" retired":"")}>
              <span className="m-code">#{emp.ENGCD}</span>
              {isEditing ? (
                <React.Fragment>
                  <select className="m-input m-gender" value={editDraft.GENDER||""}
                    onChange={(e)=>setEditDraft({...editDraft, GENDER:e.target.value})}>
                    <option value="">未設定</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                  </select>
                  <input className="m-input" value={editDraft.ID_NAME}
                    onChange={(e)=>setEditDraft({...editDraft, ID_NAME:e.target.value})}/>
                  <input className="m-input" value={editDraft.COMPCD}
                    onChange={(e)=>setEditDraft({...editDraft, COMPCD:e.target.value})}/>
                  <span className="m-office">
                    <input type="checkbox" checked={!!editDraft.OFFICE_TECH}
                      onChange={(e)=>setEditDraft({...editDraft, OFFICE_TECH:e.target.checked ? "1" : ""})}
                      title="営業所専任技術者"/>
                  </span>
                  <span></span>
                  <span></span>
                  <span className="m-actions">
                    <button className="btn-outline" onClick={()=>saveEdit(emp.ENGCD)}>保存</button>
                    <button className="btn-ghost" onClick={cancelEdit}>取消</button>
                  </span>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <span className="m-gender">{emp.GENDER || "-"}</span>
                  <span className="m-name">{emp.ID_NAME}</span>
                  <span className="m-comp" title={(emp.DEPT || emp.POSITION) ? [emp.DEPT, emp.POSITION].filter(Boolean).join(" ／ ") : (emp.COMPCD || "")}>
                    {(emp.DEPT || emp.POSITION)
                      ? [emp.DEPT, emp.POSITION].filter(Boolean).join(" ／ ")
                      : (emp.COMPCD || "-")}
                  </span>
                  <span className="m-office">
                    <input type="checkbox" checked={!!emp.OFFICE_TECH} disabled title="営業所専任技術者（編集モードで変更できます）"/>
                  </span>
                  <button type="button" className="m-lic-toggle" onClick={()=>setExpandedLic(licOpen?null:emp.ENGCD)}>
                    資格 {licCodes.length}件 {licOpen ? <Ic.Down/> : <Ic.Right/>}
                  </button>
                  <span className={"m-badge"+(retired?" retired":"")}>{retired ? "退職" : "在職"}</span>
                  <span className="m-actions">
                    <button className="btn-ghost" onClick={()=>startEdit(emp)}><Ic.Edit/></button>
                    <button className="btn-ghost" onClick={()=>toggleStatus(emp)}>
                      {retired ? "在職に戻す" : "退職にする"}
                    </button>
                  </span>
                </React.Fragment>
              )}
            </div>
            {licOpen &&
              <div className="m-lic-panel">
                <div className="m-lic-tags">
                  {licCodes.length===0 && <span style={{color:"var(--faint)", fontSize:12}}>保有資格の登録がありません</span>}
                  {licCodes.map((code)=>(
                    <span key={code} className="m-lic-tag">
                      {licenseMap[code] || ("資格("+code+")")}
                      <button onClick={()=>removeLicenseFrom(emp.ENGCD, code)}><Ic.X size={11}/></button>
                    </span>
                  ))}
                </div>
                <div className="m-lic-add">
                  <select value={addLicCode} onChange={(e)=>setAddLicCode(e.target.value)}>
                    <option value="">資格を選択して追加...</option>
                    {licenseOptionsSorted.filter((l)=>!licCodes.includes(l.LICCD)).map((l)=>(
                      <option key={l.LICCD} value={l.LICCD}>{l.LICNM}</option>
                    ))}
                  </select>
                  <button className="btn-outline" onClick={()=>addLicenseTo(emp.ENGCD, addLicCode)}><Ic.Plus/> 追加</button>
                </div>
              </div>
            }
            </React.Fragment>
          );
        };

        const activeList=filtered.filter((e)=>e.STATUS!=="retired");
        const retiredList=filtered.filter((e)=>e.STATUS==="retired");
        const head=(
          <div className="master-row master-row-head">
            <span className="m-code">コード</span>
            <span className="m-gender">性別</span>
            <span className="m-name">氏名</span>
            <span className="m-comp">所属</span>
            <span className="m-office">営業所専任技術者</span>
            <span>資格</span>
            <span className="m-status">状態</span>
            <span></span>
          </div>
        );

        return (
          <React.Fragment>
            <div className="master-group-label">在職者（{activeList.length}名）</div>
            <div className="master-list">
              {head}
              {activeList.map(renderRow)}
              {activeList.length===0 && <div className="empty">該当する在職者がいません</div>}
            </div>

            <div className="master-group-label retired">退職者（{retiredList.length}名）</div>
            <div className="master-list">
              {head}
              {retiredList.map(renderRow)}
              {retiredList.length===0 && <div className="empty">該当する退職者がいません</div>}
            </div>
          </React.Fragment>
        );
      })()}
    </div>
  );
}

/* ---------------- master maintenance (種別マスタなど、コードマスタの編集) ---------------- */
/* ---------------- assignment gantt (配置状況：見るだけの一覧) ---------------- */
function AssignmentGantt({assignRecords, employeeMap, constrsltRecords, onGotoConstno, engRecords, literalMap}){
  const [viewMode,setViewMode]=useState("project"); // "project" | "person"
  const [query,setQuery]=useState("");

  const MONTH_W=18, ROW_H=28, TECH_ROW_H=36;
  const mainScrollRef=useRef(null);
  const topScrollRef=useRef(null);
  const syncingRef=useRef(false);
  const onMainScroll=()=>{
    if(syncingRef.current){ syncingRef.current=false; return; }
    if(topScrollRef.current){ syncingRef.current=true; topScrollRef.current.scrollLeft=mainScrollRef.current.scrollLeft; }
  };
  const onTopScroll=()=>{
    if(syncingRef.current){ syncingRef.current=false; return; }
    if(mainScrollRef.current){ syncingRef.current=true; mainScrollRef.current.scrollLeft=topScrollRef.current.scrollLeft; }
  };

  // 工事名・案件名列（左端の固定ラベル列）専用の横スクロール。
  // 上部に1本のスクロールバーを置き、その位置をぜんぶの行のラベルに反映させる（行ごとの個別スクロールはしない）。
  const [labelScrollX,setLabelScrollX]=useState(0);
  const labelScrollRef=useRef(null);
  const onLabelScroll=()=>{
    if(labelScrollRef.current) setLabelScrollX(labelScrollRef.current.scrollLeft);
  };
  const measureCtxRef=useRef(null);
  const measureTextWidth=(text, size, weight)=>{
    if(!measureCtxRef.current){
      measureCtxRef.current=document.createElement("canvas").getContext("2d");
    }
    const ctx=measureCtxRef.current;
    ctx.font=(weight||500)+" "+(size||11.5)+"px 'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif";
    return ctx.measureText(text||"").width;
  };

  const byId=useMemo(()=>{
    const map={};
    (assignRecords||[]).forEach((r)=>{ if(r["タイプ"]==="案件・工番") map[r.ID]=r; });
    return map;
  },[assignRecords]);

  // 工番・案件番号 → 工事金額（請負金額）の対応表。工事詳細検索データ（constrsltRecords）から引く。
  const amountByConst=useMemo(()=>{
    const map={};
    (constrsltRecords||[]).forEach((r)=>{ if(r.CONSTNO) map[r.CONSTNO]=r.KYKN; });
    return map;
  },[constrsltRecords]);
  const hasConst=useMemo(()=>{
    const set=new Set();
    (constrsltRecords||[]).forEach((r)=>{ if(r.CONSTNO) set.add(r.CONSTNO); });
    return set;
  },[constrsltRecords]);

  // ①CORINSの従事期間（工事詳細検索と同じ技術者情報データ）を、氏名から引けるようにする。
  // 技術者情報（engRecords）はENGCDで人を識別しているので、社員データ（employeeMap）の氏名でENGCDへ変換する。
  const engcdByName=useMemo(()=>{
    const map={};
    Object.values(employeeMap||{}).forEach((e)=>{
      const key=(e.ID_NAME||"").replace(/\s+/g,"");
      if(key) map[key]=e.ENGCD;
    });
    return map;
  },[employeeMap]);
  // "工番・案件番号|ENGCD" → 技術者情報の行（複数役割で登録されていることがあるので配列）
  const engIndex=useMemo(()=>{
    const idx={};
    (engRecords||[]).forEach((r)=>{
      const key=(r.CONSTNO||"")+"|"+(r.ENGCD||"");
      if(!idx[key]) idx[key]=[];
      idx[key].push(r);
    });
    return idx;
  },[engRecords]);
  // 指定の工番・案件番号×氏名について、CORINSの従事期間1〜3をすべて集めて返す（複数役割ぶんも合算）
  const corinsPeriodsFor=(koban, name)=>{
    const engcd=engcdByName[(name||"").replace(/\s+/g,"")];
    if(!engcd || !koban) return [];
    const rows=engIndex[koban+"|"+engcd] || [];
    const periods=[];
    rows.forEach((r)=>{
      [["KOKF01","KOKT01"],["KOKF02","KOKT02"],["KOKF03","KOKT03"]].forEach(([kf,kt])=>{
        if(normDigits8(r[kf])) periods.push({from:r[kf], to:r[kt]||r[kf]});
      });
    });
    return periods;
  };

  // 表示開始は「今年の1月」固定（過去の古いデータで埋まらないようにする）。終了は実データの最大月まで。
  const {minYM, maxYM} = useMemo(()=>{
    const t=new Date();
    const startOfThisYear=t.getFullYear()*100+1;
    let max=null;
    (assignRecords||[]).forEach((r)=>{
      ["工期(自)","工期(至)","配置期間(自)","配置期間(至)"].forEach((col)=>{
        const s=normDigits8(r[col]);
        if(!s) return;
        const ym=parseInt(s.slice(0,6),10);
        if(max===null||ym>max) max=ym;
      });
    });
    if(max===null || max<startOfThisYear+23) max=startOfThisYear+23; // 最低でも2年分は見えるようにする
    return {minYM:startOfThisYear, maxYM:max};
  },[assignRecords]);
  // 配置期間(至)が表示開始（今年の1月）より前＝もう終わっている配置は一覧から除外する。終了日が不明なものは残す。
  const endedBeforeView=(toRaw)=>{
    const s=normDigits8(toRaw);
    if(!s) return false;
    return parseInt(s.slice(0,6),10) < minYM;
  };

  const projects=useMemo(()=>{
    const techByParent={};
    (assignRecords||[]).forEach((r)=>{
      if(r["タイプ"]!=="技術者") return;
      if(!techByParent[r.PARENT]) techByParent[r.PARENT]=[];
      techByParent[r.PARENT].push(r);
    });
    const nameKey=(n)=> (n||"").replace(/\s+/g,"");
    const isRetiredName=(name)=>{
      const emp=Object.values(employeeMap||{}).find((e)=> (e.ID_NAME||"").replace(/\s+/g,"")===nameKey(name));
      return !!(emp && emp.STATUS==="retired");
    };
    const list=Object.values(byId).map((p)=>({
      id:p.ID,
      koban:p["工番・案件"],
      kobanType:classifyKouban(p["工番・案件"]),
      kubun:p["案件区分"],
      name:p["工事名・案件名"],
      branch:p["支店"],
      kokf:p["工期(自)"], kokt:p["工期(至)"],
      techs:(techByParent[p.ID]||[])
        .filter((t)=> !isRetiredName(t["技術者名"]))
        .filter((t)=> !endedBeforeView(t["配置期間(至)"]))
        .map((t)=>({
          name:t["技術者名"], role:t["役割"], kubun:t["案件区分"],
          from:t["配置期間(自)"], to:t["配置期間(至)"],
        })),
    }));
    list.sort((a,b)=> compareKoban(a.koban, a.kubun, b.koban, b.kubun));
    return list.filter((p)=> p.techs.length>0); // 表示期間内の技術者が誰もいない工事は表示しない
  },[assignRecords, byId, employeeMap, minYM]);

  const persons=useMemo(()=>{
    const byName={};
    (assignRecords||[]).forEach((r)=>{
      if(r["タイプ"]!=="技術者") return;
      const name=r["技術者名"];
      if(!name) return;
      if(!byName[name]) byName[name]=[];
      const parent=byId[r.PARENT];
      byName[name].push({
        koban:parent ? parent["工番・案件"] : r["工番・案件"],
        kobanType:classifyKouban(parent ? parent["工番・案件"] : r["工番・案件"]),
        projId: r.PARENT,
        name:parent ? parent["工事名・案件名"] : r["工事名・案件名"],
        role:r["役割"], kubun:r["案件区分"] || (parent && parent["案件区分"]),
        from:r["配置期間(自)"], to:r["配置期間(至)"],
      });
    });
    const nameKey=(n)=> n.replace(/\s+/g,"");
    return Object.entries(byName).map(([name, list])=>{
      const emp=Object.values(employeeMap||{}).find((e)=> (e.ID_NAME||"").replace(/\s+/g,"")===nameKey(name));
      const visibleList=list.filter((a)=> !endedBeforeView(a.to));
      visibleList.sort((a,b)=> (normDigits8(a.from)||"99999999").localeCompare(normDigits8(b.from)||"99999999"));
      return {name, dept: emp ? emp.DEPT : "", retired: !!(emp && emp.STATUS==="retired"), assigns:visibleList};
    }).filter((p)=>!p.retired) // 退職者は配置状況タブでは非表示にする
      .filter((p)=>p.assigns.length>0) // 表示期間内の配置が一件も無い技術者は表示しない
      .sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
  },[assignRecords, byId, employeeMap, minYM]);

  const lookupLitLocal=(type,code)=>{
    if(code===undefined||code===null||code==="") return "";
    const c=String(parseFloat(code));
    return (literalMap && literalMap[type] && literalMap[type][c]) || "";
  };

  // 監理技術者・主任技術者・管理技術者の配置期間重複（据付案件のみ対象）を検出する。
  // 期間は①CORINS従事期間（技術者情報）があれば優先し、無ければ②配置実績（配置期間）を使う。
  // 同一工事内での掛け持ち（複数役割）は対象外。管理技術者どうしの重複は許容する。
  // また、両方とも「案件」（未受注）どうしの重複は対象外（少なくとも一方が「工事」なら対象）。
  const dutyConflictResult=useMemo(()=>{
    const entries=[];
    projects.forEach((p)=>{
      const sesu=classifySesu(p.kubun);
      if(sesu!=="据" && sesu!=="製据") return;
      p.techs.forEach((t)=>{
        const category=categorizeDutyRole(t.role);
        if(!category) return;
        // 配置データ側にそもそも配置期間(自)〜(至)が入っていない行は、比較対象がないので対象外にする
        // （①CORINSは「②の期間を優先して差し替える」ためのものであり、②が無い行を新たに作り出す用途には使わない）。
        if(!(normDigits8(t.from) && normDigits8(t.to))) return;
        let periods=[];
        const engcd=engcdByName[(t.name||"").replace(/\s+/g,"")];
        if(engcd){
          const rows=engIndex[p.koban+"|"+engcd] || [];
          rows.filter((r)=> categorizeDutyRole(lookupLitLocal("TRGT", r.POSICD))===category)
            .forEach((r)=>{
              [["KOKF01","KOKT01"],["KOKF02","KOKT02"],["KOKF03","KOKT03"]].forEach(([kf,kt])=>{
                if(normDigits8(r[kf]) && normDigits8(r[kt])) periods.push({from:r[kf], to:r[kt]});
              });
            });
        }
        if(periods.length===0){
          periods=[{from:t.from, to:t.to}];
        }
        entries.push({person:t.name, personKey:(t.name||"").replace(/\s+/g,""), koban:p.koban, projId:p.id, kobanType:p.kobanType, projName:p.name, role:t.role, category, periods});
      });
    });

    const byPerson={};
    entries.forEach((e)=>{ if(!byPerson[e.personKey]) byPerson[e.personKey]=[]; byPerson[e.personKey].push(e); });

    const conflicts=[];
    Object.values(byPerson).forEach((list)=>{
      for(let i=0;i<list.length;i++){
        for(let j=i+1;j<list.length;j++){
          const a=list[i], b=list[j];
          if(a.koban===b.koban) continue; // 同じ工番・案件番号（＝同一工事）内は対象外
          if(a.category==="管理技術者" && b.category==="管理技術者") continue; // 管理技術者どうしは許容
          if(a.kobanType==="案件" && b.kobanType==="案件") continue; // 案件どうしは対象外
          let found=null;
          for(const pa of a.periods){
            for(const pb of b.periods){
              const d=overlapDays(pa.from, pa.to, pb.from, pb.to);
              if(d>0){
                const ovFrom=normDigits8(pa.from)>normDigits8(pb.from)?pa.from:pb.from;
                const ovTo=normDigits8(pa.to)<normDigits8(pb.to)?pa.to:pb.to;
                found={from:ovFrom, to:ovTo, days:d};
                break;
              }
            }
            if(found) break;
          }
          if(found) conflicts.push({person:a.person, a, b, overlap:found});
        }
      }
    });
    conflicts.sort((x,y)=>(x.person||"").localeCompare(y.person||"","ja"));
    return {conflicts, entries};
  },[projects, engcdByName, engIndex, literalMap]);
  const dutyConflicts=dutyConflictResult.conflicts;
  const dutyEntries=dutyConflictResult.entries;

  // 重複が見つかった「人×工事インスタンス（ID）」の組み合わせを高速判定できるようにしたセット。
  // 工番テキストではなくID単位で持つのは、同じ工番が複数期間・複数件に分かれて登録されているとき、
  // 実際には重複していないほかの期間まで一緒に赤字になってしまうのを防ぐため。
  const conflictKeySet=useMemo(()=>{
    const set=new Set();
    dutyConflicts.forEach((c)=>{
      set.add(c.a.personKey+"|"+c.a.projId);
      set.add(c.b.personKey+"|"+c.b.projId);
    });
    return set;
  },[dutyConflicts]);
  // 赤字判定は「同じ工番の別区分（製）」や「同じ工番の別期間」まで誤って引っかからないよう、
  // その行自体が据付／製据であることと、実際に重複と判定されたプロジェクトIDそのものであることを確認する。
  const isDutyConflict=(name, projId, kubun)=>{
    const sesu=classifySesu(kubun);
    if(sesu!=="据" && sesu!=="製据") return false;
    return conflictKeySet.has((name||"").replace(/\s+/g,"")+"|"+projId);
  };

  // 「工番×役職区分」ごとに、配置されている人物と期間の一覧を持つ索引。赤字の行について、
  // 同じ工事・同じ据付時期・同じ役割に自分を含めて何人配置されているかを数えるのに使う。
  const entryByPersonProj=useMemo(()=>{
    const m={};
    dutyEntries.forEach((e)=>{ m[e.personKey+"|"+e.projId]=e; });
    return m;
  },[dutyEntries]);
  const dutyCountIndex=useMemo(()=>{
    const idx={};
    dutyEntries.forEach((e)=>{
      const key=e.koban+"|"+e.category;
      if(!idx[key]) idx[key]=[];
      idx[key].push({personKey:e.personKey, periods:e.periods});
    });
    return idx;
  },[dutyEntries]);
  const CIRCLED_NUM=["","①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
  const circledNum=(n)=> CIRCLED_NUM[n] || ("("+n+")");
  // 赤字（isDutyConflict）になっている行だけ、自分を含めて同じ工事・同じ据付時期・同じ役割の人数を返す。
  // 対象外や1人（自分だけ）の場合は0（表示しない）。
  const getDutyOverlapCount=(name, projId, kubun)=>{
    if(!isDutyConflict(name, projId, kubun)) return 0;
    const personKey=(name||"").replace(/\s+/g,"");
    const entry=entryByPersonProj[personKey+"|"+projId];
    if(!entry) return 0;
    const list=dutyCountIndex[entry.koban+"|"+entry.category] || [];
    const personSet=new Set();
    list.forEach((item)=>{
      const overlaps=item.periods.some((ip)=> entry.periods.some((p)=> overlapDays(ip.from, ip.to, p.from, p.to)>0));
      if(overlaps) personSet.add(item.personKey);
    });
    const count=personSet.size;
    return count>=2 ? count : 0;
  };

  const q=query.trim();
  const filteredProjects = !q ? projects : projects.filter((p)=>
    (p.koban||"").includes(q) || (p.name||"").includes(q) || p.techs.some((t)=>(t.name||"").includes(q)));
  const filteredPersons = !q ? persons : persons.filter((p)=>
    (p.name||"").includes(q) || p.assigns.some((a)=>(a.koban||"").includes(q) || (a.name||"").includes(q)));

  const months=useMemo(()=>{
    const arr=[];
    let y=Math.floor(minYM/100), m=minYM%100;
    const endY=Math.floor(maxYM/100), endM=maxYM%100;
    while(y<endY || (y===endY && m<=endM)){
      arr.push({y,m});
      m++; if(m>12){ m=1; y++; }
    }
    return arr;
  },[minYM,maxYM]);

  const timelineWidth=months.length*MONTH_W;
  const ymIndex=(ymStr)=>{
    const y=parseInt(ymStr.slice(0,4),10), m=parseInt(ymStr.slice(4,6),10);
    return (y-Math.floor(minYM/100))*12 + (m-(minYM%100));
  };
  const barRect=(fromRaw, toRaw)=>{
    const f=normDigits8(fromRaw);
    if(!f) return null;
    const t=normDigits8(toRaw) || f;
    const startIdx=Math.max(0, ymIndex(f));
    const endIdx=Math.min(months.length-1, ymIndex(t));
    if(endIdx<startIdx) return null;
    return {left:startIdx*MONTH_W, width:(endIdx-startIdx+1)*MONTH_W};
  };

  const LABEL_W=380;
  const LABEL_PAD=20, BADGE_W=28, GAP=6, SUB_INDENT=14;

  // 現在表示中の行の中で最も長いラベル内容の幅を求め、ラベル列専用スクロールバーの可動域として使う。
  const labelMaxScroll=useMemo(()=>{
    let max=0;
    const amtText=(koban)=>{
      const amt=amountByConst[koban];
      return (amt===undefined||amt===null||amt==="") ? "" : "（"+fmtMoney(amt)+"円）";
    };
    if(viewMode==="project"){
      filteredProjects.forEach((p)=>{
        const w=BADGE_W+GAP+measureTextWidth(p.koban,11,600)+GAP+measureTextWidth(p.name,11,800)+GAP+measureTextWidth(amtText(p.koban),10,600);
        if(w>max) max=w;
        p.techs.forEach((t)=>{
          const tw=SUB_INDENT+measureTextWidth(t.name,10,500);
          if(tw>max) max=tw;
        });
      });
    } else {
      filteredPersons.forEach((p)=>{
        const w=measureTextWidth(p.name,11,800)+(p.retired?60:0);
        if(w>max) max=w;
        p.assigns.forEach((a)=>{
          const aw=SUB_INDENT+measureTextWidth(a.role,10,600)+GAP+BADGE_W+GAP+measureTextWidth(a.koban,10,600)+GAP+measureTextWidth(a.name,10,500)+GAP+measureTextWidth(amtText(a.koban),10,600);
          if(aw>max) max=aw;
        });
      });
    }
    return Math.max(0, Math.ceil(max-(LABEL_W-LABEL_PAD))+24);
  },[viewMode, filteredProjects, filteredPersons, amountByConst]);

  // 検索条件や表示モードが変わったらラベル列のスクロール位置を先頭に戻す
  useEffect(()=>{
    setLabelScrollX(0);
    if(labelScrollRef.current) labelScrollRef.current.scrollLeft=0;
  },[viewMode, query]);

  const Bar=({rect, color, textColor, label, title, top, height})=>{
    if(!rect) return null;
    return (
      <div title={title} style={{
        position:"absolute", left:rect.left, top:(top!==undefined?top:3), width:rect.width, height:(height!==undefined?height:ROW_H-6),
        background:color, color:textColor||"#fff", borderRadius:5, display:"flex", alignItems:"center",
        justifyContent:"flex-start", fontSize:9.5, fontWeight:700, overflow:"hidden", whiteSpace:"nowrap",
        padding:"0 6px", boxSizing:"border-box",
      }}>{label}</div>
    );
  };

  // ①CORINSの従事期間を表す細いバー（複数期間ぶんセグメントで表示）。文字は入れず、ホバーで期間を確認する形。
  const CorinsStrip=({periods, top, height})=>{
    if(!periods || periods.length===0) return null;
    return periods.map((pr,i)=>{
      const rect=barRect(pr.from, pr.to);
      if(!rect) return null;
      return (
        <div key={i} title={"①CORINS従事期間　"+fmtDate(pr.from)+"〜"+fmtDate(pr.to)} style={{
          position:"absolute", left:rect.left, top, width:rect.width, height,
          background:"#7C3AED", borderRadius:3, boxSizing:"border-box", opacity:0.9,
        }}/>
      );
    });
  };

  const SesuBadge=({sesu}) => {
    const c=sesuColor(sesu);
    if(!c) return null;
    return <span className="m-badge" style={{flex:"0 0 auto", marginRight:6, fontSize:8.5, padding:"1px 5px", background:c.bg, color:c.fg}}>{sesu}</span>;
  };

  // 工番・案件番号のテキスト。工事詳細検索に該当データがあればクリックで該当工事へジャンプする。
  const KobanText=({koban}) => {
    const clickable = onGotoConstno && koban && hasConst.has(koban);
    return (
      <span
        onClick={clickable ? (e)=>{ e.stopPropagation(); onGotoConstno(koban); } : undefined}
        title={clickable ? "クリックで工事詳細検索の該当工事を開く" : undefined}
        style={{
          color: clickable ? "var(--accent)" : "var(--muted2)", fontWeight:600, flex:"0 0 auto",
          cursor: clickable ? "pointer" : "default",
          textDecoration: clickable ? "underline" : "none",
        }}>{koban}</span>
    );
  };

  // 工事金額（請負金額）。工事詳細検索データに該当工番があれば表示する。
  const AmountTag=({koban}) => {
    const amt=amountByConst[koban];
    if(amt===undefined || amt===null || amt==="") return null;
    return <span style={{color:"var(--muted2)", fontWeight:600, fontSize:"0.92em", flex:"0 0 auto"}}>（{fmtMoney(amt)}円）</span>;
  };

  const Row=({label, sub, children, header, height}) => (
    <div style={{display:"flex", position:"relative", height:(height||ROW_H), borderBottom:"1px solid var(--line-soft)"}}>
      <div style={{
        position:"sticky", left:0, zIndex:2, width:LABEL_W, flex:"0 0 "+LABEL_W+"px",
        background: header ? "var(--panel-raised)" : "var(--panel)",
        borderRight:"1px solid var(--line)", display:"flex", alignItems:"center",
        overflow:"hidden",
      }}>
        <div style={{
          display:"flex", alignItems:"center", gap:6,
          whiteSpace:"nowrap", height:"100%", flex:"0 0 auto",
          transform:"translateX("+(-labelScrollX)+"px)",
          padding:"0 10px", fontSize:header?11:10, fontWeight:header?800:500, color:"var(--ink)",
        }}>
          {label}
          {sub && <span style={{color:"var(--muted2)", fontWeight:500, fontSize:9.5, flex:"0 0 auto"}}>{sub}</span>}
        </div>
      </div>
      <div style={{position:"relative", width:timelineWidth, flex:"0 0 "+timelineWidth+"px"}}>
        {children}
      </div>
    </div>
  );

  return (
    <div className="card">
      <div className="res-hd">
        <div>
          <h2>配置状況</h2>
          <p className="sub">技術者配置システムから取り込んだデータを一覧表示します（閲覧のみ）。①CORINS従事期間と②配置実績のバーを重ねて比較できます</p>
        </div>
      </div>

      <div className="tabs" style={{marginBottom:14}}>
        <button className={"tab-btn"+(viewMode==="project"?" active":"")} onClick={()=>setViewMode("project")}>配置一覧(工事別)</button>
        <button className={"tab-btn"+(viewMode==="person"?" active":"")} onClick={()=>setViewMode("person")}>配置一覧(技術者別)</button>
      </div>

      <input type="text" className="kw-input" style={{marginBottom:10, maxWidth:360}}
        value={query} onChange={(e)=>setQuery(e.target.value)}
        placeholder={viewMode==="project" ? "工番・案件名・技術者名で検索" : "技術者名・工番・案件名で検索"}/>

      <div style={{display:"flex", alignItems:"center", gap:16, marginBottom:14, fontSize:11, color:"var(--muted2)"}}>
        <span style={{display:"flex", alignItems:"center", gap:5}}>
          <span style={{width:16, height:6, borderRadius:3, background:"#7C3AED", display:"inline-block"}}/>
          ①CORINS従事期間（工事詳細検索の技術者情報）
        </span>
        <span style={{display:"flex", alignItems:"center", gap:5}}>
          <span style={{width:16, height:10, borderRadius:3, background:"#6B7280", display:"inline-block"}}/>
          ②配置実績（技術者配置システムの配置期間）
        </span>
      </div>

      {dutyConflicts.length>0 &&
        <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:14, fontSize:11, color:"var(--red)"}}>
          <Ic.Warn size={13}/>
          工事名が赤字の行は、監理・主任・管理技術者の配置期間が他の工事と重複しています（{dutyConflicts.length}件）
        </div>
      }

      {(assignRecords||[]).length===0 ? (
        <div className="empty">配置データがまだ取り込まれていません。「データ更新」から技術者配置システムのExcelを取り込んでください。</div>
      ) : (
        <React.Fragment>
          <div style={{display:"flex", height:16, border:"1px solid var(--line)", borderBottom:"none", borderRadius:"10px 10px 0 0"}}>
            <div style={{width:LABEL_W, flex:"0 0 "+LABEL_W+"px"}}/>
            <div ref={topScrollRef} onScroll={onTopScroll} style={{overflowX:"auto", overflowY:"hidden", flex:"1 1 auto"}}>
              <div style={{width:timelineWidth, height:1}}/>
            </div>
          </div>
          <div ref={mainScrollRef} onScroll={onMainScroll} className="gantt-main-scroll"
            style={{overflow:"auto", maxHeight:640, border:"1px solid var(--line)", borderRadius:"0 0 10px 10px"}}>
          {/* 月ヘッダー（年・月の2段） */}
          <div style={{display:"flex", position:"sticky", top:0, zIndex:3}}>
            <div style={{
              position:"sticky", left:0, top:0, zIndex:4, width:LABEL_W, flex:"0 0 "+LABEL_W+"px",
              background:"var(--panel-raised)", borderRight:"1px solid var(--line)", borderBottom:"1px solid var(--line)",
              display:"flex", alignItems:"center", padding:"0 10px",
            }}>
              {labelMaxScroll>0 &&
                <div ref={labelScrollRef} onScroll={onLabelScroll} title="工事名・案件名をスクロールして全体を表示"
                  style={{overflowX:"auto", overflowY:"hidden", width:"100%", height:10}}>
                  <div style={{width:(LABEL_W-LABEL_PAD)+labelMaxScroll, height:1}}/>
                </div>}
            </div>
            <div style={{width:timelineWidth, flex:"0 0 "+timelineWidth+"px"}}>
              <div style={{display:"flex", background:"var(--panel-raised)", borderBottom:"1px solid var(--line-soft)"}}>
                {months.map((mo,i)=> mo.m===1 || i===0 ? (
                  <div key={i} style={{
                    width:(mo.m===1 && i>0 ? 12 : (13-mo.m))*MONTH_W, flex:"0 0 auto",
                    fontSize:10, fontWeight:800, color:"var(--muted)", padding:"3px 0 3px 4px", boxSizing:"border-box",
                    borderLeft: i>0 ? "1px solid var(--line-soft)" : "none",
                  }}>{mo.y}</div>
                ) : null)}
              </div>

function MasterMaintenance({literals, onSaveLiterals}){
  const [activeMaster,setActiveMaster]=useState("SHRU"); // 現状は「種別」のみ。将来他のコード種別を追加する余地を残す
  const [query,setQuery]=useState("");
  const [editingCode,setEditingCode]=useState(null);
  const [editDraft,setEditDraft]=useState("");
  const [showAdd,setShowAdd]=useState(false);
  const [newCode,setNewCode]=useState("");
  const [newName,setNewName]=useState("");
  const [formError,setFormError]=useState("");

  const MASTERS=[
    {type:"SHRU", label:"種別"},
  ];

  const rows=useMemo(()=>{
    const list=(literals||[]).filter((r)=>r.CDTYP===activeMaster);
    const q=query.trim();
    return list
      .filter((r)=> !q || (r.LTLNM||"").includes(q) || String(r.LTLCD||"").includes(q))
      .sort((a,b)=>parseFloat(a.LTLCD)-parseFloat(b.LTLCD));
  },[literals, activeMaster, query]);

  const startEdit=(r)=>{ setEditingCode(r.LTLCD); setEditDraft(r.LTLNM||""); };
  const cancelEdit=()=>{ setEditingCode(null); setEditDraft(""); };
  const saveEdit=(code)=>{
    const name=editDraft.trim();
    if(!name){ return; }
    const next=(literals||[]).map((r)=> (r.CDTYP===activeMaster && r.LTLCD===code) ? {...r, LTLNM:name} : r);
    onSaveLiterals(next);
    setEditingCode(null);
  };
  const deleteRow=(code)=>{
    if(!confirmDeletePassword()) return;
    if(!window.confirm("この種別を削除します。既存の工事データで使われている場合、名称がコード表示になります。よろしいですか？")) return;
    const next=(literals||[]).filter((r)=> !(r.CDTYP===activeMaster && r.LTLCD===code));
    onSaveLiterals(next);
  };
  const addNew=()=>{
    const code=newCode.trim();
    const name=newName.trim();
    if(!/^\d+$/.test(code)){ setFormError("コードは数字で入力してください"); return; }
    if((literals||[]).some((r)=> r.CDTYP===activeMaster && String(parseFloat(r.LTLCD))===String(parseFloat(code)))){
      setFormError("そのコードは既に登録されています"); return;
    }
    if(!name){ setFormError("名称を入力してください"); return; }
    onSaveLiterals([...(literals||[]), {CDTYP:activeMaster, LTLCD:code, LTLNM:name}]);
    setNewCode(""); setNewName(""); setShowAdd(false); setFormError("");
  };

  return (
    <div className="card">
      <div className="res-hd">
        <div>
          <h2>マスタメンテナンス</h2>
          <p className="sub">{rows.length}件登録中</p>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button className="btn-outline" onClick={()=>{ setShowAdd((v)=>!v); setFormError(""); }}>
            <Ic.Plus/> 新規{MASTERS.find((m)=>m.type===activeMaster).label}を登録
          </button>
        </div>
      </div>

      <div className="tabs" style={{marginBottom:14}}>
        {MASTERS.map((m)=>(
          <button key={m.type} className={"tab-btn"+(activeMaster===m.type?" active":"")}
            onClick={()=>{ setActiveMaster(m.type); setQuery(""); setShowAdd(false); cancelEdit(); }}>
            {m.label}
          </button>
        ))}
      </div>

      {showAdd &&
        <div className="master-add-form">
          <input type="text" placeholder="コード（数字）" value={newCode} onChange={(e)=>setNewCode(e.target.value)}/>
          <input type="text" placeholder="名称" value={newName} onChange={(e)=>setNewName(e.target.value)}/>
          <button className="btn-primary" onClick={addNew}>登録する</button>
          {formError && <span className="m-form-err">{formError}</span>}
        </div>
      }

      <input type="text" className="kw-input" style={{marginTop:14, marginBottom:12, maxWidth:320}}
        value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="コード・名称で検索"/>

      <div className="master-list">
        <div className="master-row master-row-head" style={{gridTemplateColumns:"110px 1fr 160px"}}>
          <span className="m-code">コード</span>
          <span className="m-name">名称</span>
          <span></span>
        </div>
        {rows.map((r)=>{
          const isEditing=editingCode===r.LTLCD;
          return (
            <div key={r.LTLCD} className="master-row" style={{gridTemplateColumns:"110px 1fr 160px"}}>
              <span className="m-code">{r.LTLCD}</span>
              {isEditing ? (
                <input className="m-input" value={editDraft} onChange={(e)=>setEditDraft(e.target.value)}/>
              ) : (
                <span className="m-name">{r.LTLNM}</span>
              )}
              <span className="m-actions">
                {isEditing ? (
                  <React.Fragment>
                    <button className="btn-outline" onClick={()=>saveEdit(r.LTLCD)}>保存</button>
                    <button className="btn-ghost" onClick={cancelEdit}>取消</button>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <button className="btn-ghost" onClick={()=>startEdit(r)}><Ic.Edit/></button>
                    <button className="btn-ghost" onClick={()=>deleteRow(r.LTLCD)}><Ic.X size={13}/></button>
                  </React.Fragment>
                )}
              </span>
            </div>
          );
        })}
        {rows.length===0 && <div className="empty">該当する{MASTERS.find((m)=>m.type===activeMaster).label}がありません</div>}
      </div>
    </div>
  );
}

/* ---------------- data uploader (used both for onboarding & update overlay) ---------------- */
function Uploader({datasets, onMerged, compact}){
  const [dragOver,setDragOver]=useState(false);
  const [loadErrors,setLoadErrors]=useState([]);
  const [pending,setPending]=useState({}); // freshly parsed, not yet merged types this session
  const fileInputRef=useRef(null);

  const handleFiles=useCallback(async (fileList)=>{
    const all=Array.from(fileList);
    const csvFiles=all.filter((f)=>f.name.toLowerCase().endsWith(".csv"));
    const xlsxFiles=all.filter((f)=>{ const n=f.name.toLowerCase(); return n.endsWith(".xlsx")||n.endsWith(".xls"); });
    const jsonFiles=all.filter((f)=>f.name.toLowerCase().endsWith(".json"));

    const csvResults=await Promise.all(csvFiles.map(parseCsvFile));
    const xlsxResults=await Promise.all(xlsxFiles.map(parseXlsxFile));
    const jsonResults=await Promise.all(jsonFiles.map(async (f)=>{
      try{
        const text=await f.text();
        const obj=JSON.parse(text);
        return {ok:true, filename:f.name, obj};
      }catch(e){ return {ok:false, filename:f.name, error:"JSON形式を読み取れませんでした"}; }
    }));

    const errs=[];
    const nextPending={...pending};
    [...csvResults, ...xlsxResults].forEach((r)=>{
      if(r.ok){ nextPending[r.type]={records:r.records, filename:r.filename}; }
      else errs.push(r.filename+": "+r.error);
    });
    jsonResults.forEach((r)=>{
      if(r.ok){
        Object.keys(DATASET_DEFS).forEach((type)=>{
          if(r.obj[type] && Array.isArray(r.obj[type].records)){
            nextPending[type]={records:r.obj[type].records, filename:r.filename};
          }
        });
      } else errs.push(r.filename+": "+r.error);
    });

    setPending(nextPending);
    setLoadErrors(errs);
    // merge immediately into parent datasets
    const merged={...datasets};
    Object.entries(nextPending).forEach(([type,data])=>{
      merged[type] = {
        // 配置データ(assign)は、配置状況が変わるたびに終了した配置が消える必要があるため、
        // 差分マージ（追加・更新のみ）ではなく毎回まるごと入れ替える
        records: type==="assign" ? data.records : mergeRecords(datasets[type]?.records, data.records, MERGE_KEY[type]),
        filename: data.filename,
      };
    });
    // 資格コード(LICCD)は過去のデータで桁数の表記ゆれ（先頭ゼロなし）が残っている場合があるため、
    // 更新のたびに既存データも含めて4桁ゼロ埋めへ正規化する
    if(merged.licenses){
      merged.licenses = {...merged.licenses, records: merged.licenses.records.map((r)=>({...r, LICCD: normLicCode(r.LICCD)}))};
    }
    if(merged.englicense){
      merged.englicense = {...merged.englicense, records: dedupeEngLicense(merged.englicense.records.map((r)=>({...r, LICCD: normLicCode(r.LICCD)})))};
    }
    onMerged(merged);
  },[datasets, pending, onMerged]);

  const onDrop=(e)=>{ e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); };

  return (
    <div>
      <div className={"drop"+(dragOver?" over":"")}
        onDragOver={(e)=>{e.preventDefault(); setDragOver(true);}}
        onDragLeave={()=>setDragOver(false)}
        onDrop={onDrop}
        onClick={()=>fileInputRef.current && fileInputRef.current.click()}>
        <Ic.Upload color={dragOver?"var(--orange)":"var(--blue)"}/>
        <p>CSV／Excel／バックアップJSONファイルをここにドロップ、またはクリックして選択（複数可）</p>
        <p style={{fontSize:11, color:"var(--muted2)", marginTop:2}}>配置データ（技術者配置システムのExcel）は、アップロードのたびに全件を最新の内容に置き換えます</p>
        <input ref={fileInputRef} type="file" multiple accept=".csv,.json,.xlsx,.xls" style={{display:"none"}}
          onChange={(e)=>handleFiles(e.target.files)}/>
      </div>

      {loadErrors.length>0 &&
        <div className="err-box"><Ic.Warn/><div>{loadErrors.map((e,i)=><div key={i}>{e}</div>)}</div></div>
      }

      <div className="status-grid">
        {Object.entries(DATASET_DEFS).map(([key,def])=>{
          const loaded=!!datasets[key];
          return (
            <div key={key} className={"status-card"+(loaded?" on":"")}>
              {loaded ? <Ic.Check color="var(--green)"/> : <Ic.Circle color="var(--faint)"/>}
              <div style={{minWidth:0}}>
                <div className="t">{def.label}</div>
                <div className="n">{loaded ? datasets[key].records.length+"件" : "未読込"}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- main app ---------------- */
function App(){
  const [hasStorage] = useState(()=>storageAvailable());
  const [datasets,setDatasets]=useState({});
  const [loading,setLoading]=useState(true);
  const [showUpdate,setShowUpdate]=useState(false);
  const [toast,setToast]=useState("");

  const [authReady,setAuthReady]=useState(false);
  const [role,setRole]=useState(null); // "editor" | "viewer" | null
  const [authUser,setAuthUser]=useState(null);
  const [loginId,setLoginId]=useState(""); // メールアドレス
  const [loginPw,setLoginPw]=useState("");
  const [loginError,setLoginError]=useState("");
  const [loginBusy,setLoginBusy]=useState(false);
  const canEdit = String(role||"").trim().toLowerCase()==="editor";

  useEffect(()=>{
    let unsub=null;
    waitForFirebase().then(()=>{
      if(!window.fb){ setAuthReady(true); return; }
      const {auth, onAuthStateChanged, db, doc, getDoc} = window.fb;
      unsub = onAuthStateChanged(auth, async (user)=>{
        setAuthUser(user);
        if(user){
          try{
            const snap = await getDoc(doc(db, "users", user.uid));
            if(snap.exists()){
              const raw=snap.data().role;
              setRole(raw || "viewer");
              setToast("取得したrole の値: 「"+JSON.stringify(raw)+"」");
              setTimeout(()=>setToast(""), 6000);
            } else {
              setRole("viewer");
              console.warn("users/"+user.uid+" ドキュメントが見つかりません。UIDが一致しているか確認してください。");
              setToast("権限情報(users/"+user.uid+")が見つからないため、閲覧のみとして扱います");
              setTimeout(()=>setToast(""), 6000);
            }
          }catch(e){
            setRole("viewer");
            console.error("権限情報の取得に失敗:", e);
            setToast("権限情報の取得に失敗しました（"+(e.code||e.message)+"）。閲覧のみとして扱います");
            setTimeout(()=>setToast(""), 6000);
          }
        } else {
          setRole(null);
        }
        setAuthReady(true);
      });
    });
    return ()=>{ if(unsub) unsub(); };
  },[]);

  const doLogin=async ()=>{
    setLoginError("");
    if(!window.fb){ setLoginError("Firebaseへの接続に失敗しました。しばらくして再読み込みしてください。"); return; }
    setLoginBusy(true);
    try{
      await window.fb.signInWithEmailAndPassword(window.fb.auth, loginId.trim(), loginPw);
      // 成功時はonAuthStateChangedがroleをセットする
    }catch(e){
      setLoginError("ログインに失敗しました（メールアドレスまたはパスワードが違います）");
    }
    setLoginBusy(false);
  };
  const doLogout=()=>{
    if(window.fb) window.fb.signOut(window.fb.auth);
    setLoginId(""); setLoginPw(""); setLoginError("");
  };

  useEffect(()=>{
    if(!authUser) return; // ログインしてから読み込む
    loadFromStorage()
      .then((d)=>{
        setDatasets(d);
        // デバッグ用：ブラウザのコンソールで window.debugCounts() を実行すると
        // 各コレクションの読み込み件数が確認できます（本番挙動には影響しません）
        window.debugCounts = ()=>{
          const counts={};
          FS_TYPES.forEach((t)=>{ counts[t] = (d[t] && d[t].records ? d[t].records.length : 0); });
          console.table(counts);
          return counts;
        };
      })
      .catch(()=>setDatasets({}))
      .finally(()=>setLoading(false));
  },[authUser]);

  const requiredLoaded = ["constrslt","eng","kind"].every((k)=>datasets[k]);
  const optionalLoaded = ["employee","literals"].every((k)=>datasets[k]);

  const persist=async (next)=>{
    const prev=datasets;
    setDatasets(next);
    const ok = hasStorage ? await saveToStorage(next, prev) : false;
    setToast(ok ? "データを保存しました（Firestoreに同期済み）"
                : "保存に失敗しました。通信状況を確認し、必要であれば「バックアップ保存」でJSONを書き出しておいてください");
    setTimeout(()=>setToast(""), 4500);

  /* ---------------- search state ---------------- */
  const now=new Date();
  const currentFY = now.getMonth()+1>=4 ? now.getFullYear() : now.getFullYear()-1;
  const [fyFrom,setFyFrom]=useState("");
  const [fyFromMonth,setFyFromMonth]=useState("");

  const [fyToMonth,setFyToMonth]=useState("");

  const [assignDateTo,setAssignDateTo]=useState("");
  const [selectedEngcds,setSelectedEngcds]=useState([]);
  // 重複案件除外フィルタ：ONのとき「据付時期＋監理・主任・管理技術者」以外の配置は重複判定の対象から除外する

  // 検索結果の並び替え：既定（該当件数順）／年齢の昇順・降順／配置予定と重複件数の昇順・降順

  // 技術者コードごとの配置データ（配置データの「技術者」行を、親の「案件・工番」行の情報と結び付けたもの）
  // 期間は①CORINS従事期間（工事詳細検索の技術者情報）があればそれを優先し、無ければ②配置実績（配置期間）を使う。
  const engIndexForAssign=useMemo(()=>{

  const assignRowsByEngcd=useMemo(()=>{

      if(r["タイプ"]!=="技術者") return;

  // 工番・案件番号×役職区分（監理/主任/管理技術者）ごとに、配置されている技術者コードと期間の一覧を持つ索引。
  // 「同じ工事・同じ据付時期・同じ役割」に何人配置されているかを数えるのに使う。
  const dutyAssignIndex=useMemo(()=>{

  const countDutyOverlap=(koban, category, from, to)=>{
    if(!category) return 1;

    const engcdSet=new Set();

  const CIRCLED_NUM=["","①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
  const circledNum=(n)=> CIRCLED_NUM[n] || ("("+n+")");

  const isKoshuOn=(v)=> v!==undefined && v!==null && v!=="" && String(parseFloat(v))==="1";
  // 「必要資格」の各項目について、その技術者が保有しているかどうかを判定する

  const employeeLicMap=useMemo(()=>{

  const results=useMemo(()=>{
    if(!requiredLoaded || !searched) return [];
    const keikMinN = keikMin==="" ? null : parseFloat(keikMin);

    // （役割が自分しかいない、綺麗に専任できている場合のみ除外の対象にする）。
    const excludedForAwardedDutyOverlap = new Set();
    if(excludeAwardedDutyOverlap && hasAssignFilter){
      Object.keys(assignRowsByEngcd).forEach((engcd)=>{
        const hit=(assignRowsByEngcd[engcd]||[]).some((a)=>{
          if(a.kobanType!=="工番") return false; // 案件（未受注）は対象外
          const sesu=classifySesu(a.kubun);
          const category=categorizeDutyRole(a.role);
          if(!((sesu==="据"||sesu==="製据") && category)) return false;
          const aFrom=normDigits8(a.assignFrom);
          if(!aFrom) return false;
          const aTo=normDigits8(a.assignTo) || aFrom;
          const lo = assignFilterFrom===null ? "00000000" : assignFilterFrom;
          const hi = assignFilterTo===null ? "99999999" : assignFilterTo;
          if(!(aFrom<=hi && aTo>=lo)) return false;
          return countDutyOverlap(a.koban, category, a.assignFrom, a.assignTo)===1; // 自分しかいない場合のみ対象
        });
        if(hit) excludedForAwardedDutyOverlap.add(engcd);
      });
    }

    const byEngineer={};

    (datasets.eng?.records||[]).forEach((engRow)=>{
      const proj=projectIndex[engRow.CONSTNO];
      if(!proj) return;

      if(selectedEngcds.length && !selectedEngcds.includes(engRow.ENGCD)) return;

      if(excludeAwardedDutyOverlap && excludedForAwardedDutyOverlap.has(engRow.ENGCD)) return;

      if(!includeRetired){

        if(emp && emp.STATUS==="retired") return;
