        <button className="btn-outline" style={{marginTop:10}} onClick={startAddLic}><Ic.Plus/> 資格を追加</button>
      }
    </div>
  );
}

function PersonnelQualification({employees, enginfoRecords, licenses, engLicenses, literalMap, canEdit, onSaveCertLink, onSaveKanriCert, onSaveEngInfo, onCreateEmployee, onSaveLicenseRow, onDeleteLicenseRow, initialEngcd, jumpNonce}){
  const [query,setQuery]=useState("");
  const [selectedList,setSelectedList]=useState([]);
  const [showNew,setShowNew]=useState(false);
  const [newDraft,setNewDraft]=useState({});
  const [newError,setNewError]=useState("");

  useEffect(()=>{
    if(initialEngcd){
      setSelectedList((list)=> list.includes(initialEngcd) ? list : [...list, initialEngcd]);
    }
  },[jumpNonce]);

  const enginfoMap=useMemo(()=>{
    const map={};
    (enginfoRecords||[]).forEach((r)=>{ map[r.ENGCD]=r; });
    return map;
  },[enginfoRecords]);

  const suggestions=useMemo(()=>{
    const q=query.trim();
    if(!q) return [];
    return employees
      .filter((e)=>e.STATUS!=="retired")
      .filter((e)=>(e.ID_NAME||"").includes(q) || (e.ENGCD||"").includes(q))
      .slice(0,20);
  },[employees, query]);

  const licenseMap=useMemo(()=>{
    const map={};
    (licenses||[]).forEach((l)=>{ map[l.LICCD]=l.LICNM; });
    return map;
  },[licenses]);

  const addPerson=(engcd)=>{
    if(!selectedList.includes(engcd)) setSelectedList([...selectedList, engcd]);
    setQuery("");
  };
  const removePerson=(engcd)=> setSelectedList(selectedList.filter((c)=>c!==engcd));
  const clearAll=()=> setSelectedList([]);

  const heldLicensesFor=(engcd)=>
    (engLicenses||[]).filter((r)=>r.ENGCD===engcd).map((r)=>({
      liccd: r.LICCD,
      name: licenseMap[r.LICCD] || ("資格("+r.LICCD+")"),
      licno: r.LICNO || "-",
      acquired: r.SDAY ? fmtDate(r.SDAY) : "-",
      kbn: lit(literalMap,"KGHO",r.KBN) || "-",
      certUrl: r.CERT_URL || "",
      rawLicno: r.LICNO || "",
      rawSday: r.SDAY || "",
      rawKbn: r.KBN || "",
    }));

  const openNewForm=()=>{ setNewDraft({}); setNewError(""); setShowNew(true); };
  const nf=(field)=>newDraft[field]||"";
  const setNf=(field)=>(v)=>setNewDraft({...newDraft, [field]:v});
  const createNew=()=>{
    const code=(newDraft.ENGCD||"").trim();
    if(!/^\d+$/.test(code)){ setNewError("技術者コードは数字で入力してください"); return; }
    if(employees.some((e)=>e.ENGCD===code)){ setNewError("そのコードは既に登録されています"); return; }
    if(!(newDraft.ID_NAME||"").trim()){ setNewError("氏名を入力してください"); return; }
    onCreateEmployee({ENGCD:code, COMPCD:(newDraft.COMPCD||"").trim(), ID_NAME:newDraft.ID_NAME.trim(), ID_SEI:"", ID_MEI:"", STATUS:"active"});
    setShowNew(false);
    addPerson(code);
  };

  return (
    <div className="card detail-card">
      <div className="res-hd">
        <div>
          <h2>人事資格検索</h2>
          <p className="sub">氏名または技術者コードで検索し、複数人まとめて表示できます</p>
        </div>
        <span style={{display:"flex", gap:8}}>
          {canEdit && <button className="btn-outline" onClick={openNewForm}><Ic.Plus/> 新規技術者を登録</button>}
          {selectedList.length>0 &&
            <button className="btn-ghost" onClick={clearAll}><Ic.X size={13}/> 全て閉じる（{selectedList.length}名）</button>
          }
        </span>
      </div>

      {showNew &&
        <div className="master-add-form" style={{marginBottom:18}}>
          <DTInput value={nf("ENGCD")} onChange={setNf("ENGCD")} placeholder="技術者コード（数字）"/>
          <DTInput value={nf("ID_NAME")} onChange={setNf("ID_NAME")} placeholder="氏名"/>
          <DTInput value={nf("COMPCD")} onChange={setNf("COMPCD")} placeholder="所属コード（任意）"/>
          <button className="btn-primary" onClick={createNew}>登録する</button>
          <button className="btn-ghost" onClick={()=>setShowNew(false)}>キャンセル</button>
          {newError && <div className="m-form-err">{newError}</div>}
        </div>
      }

      <div className="msel" style={{maxWidth:560}}>
        <input type="text" className="kw-input" value={query}
          onChange={(e)=>setQuery(e.target.value)}
          placeholder="例）小西 昭裕 または 625167"/>
        {query.trim() &&
          <div className="msel-panel" style={{maxHeight:260}}>
            <div className="msel-list">
              {suggestions.map((e)=>(
                <div key={e.ENGCD} className="msel-opt-personnel" onClick={()=>addPerson(e.ENGCD)}>
                  <div>
                    <span style={{fontFamily:"var(--mono)", fontSize:11, color:"var(--cyan)"}}>#{e.ENGCD}</span>
                    &nbsp;{e.ID_NAME}
                    {selectedList.includes(e.ENGCD) && <span style={{color:"var(--green)", fontSize:11, marginLeft:6}}>（追加済み）</span>}
                  </div>
                  <div style={{color:"var(--muted2)", fontSize:11}}>{[e.DEPT, e.POSITION].filter(Boolean).join(" ／ ") || e.COMPCD || ""}</div>
                </div>
              ))}
              {suggestions.length===0 && <div style={{fontSize:12,color:"var(--faint)",padding:"6px 8px"}}>該当する社員が見つかりません</div>}
            </div>
          </div>
        }
      </div>

      {selectedList.length===0 &&
        <div className="empty" style={{paddingTop:30}}>検索して技術者を追加すると、ここに表示されます（複数人追加可能）</div>
      }

      <div className="personnel-list">
        {selectedList.map((engcd)=>{
          const emp=employees.find((e)=>e.ENGCD===engcd);
          if(!emp) return null;
          return (
            <PersonnelCard key={engcd}
              emp={emp}
              info={enginfoMap[engcd]}
              heldLicenses={heldLicensesFor(engcd)}
              licenses={licenses}
              literalMap={literalMap}
              onRemove={()=>removePerson(engcd)}
              canEdit={canEdit}
              onSaveCertLink={onSaveCertLink}
              onSaveKanriCert={onSaveKanriCert}
              onSaveEngInfo={onSaveEngInfo}
              onSaveLicenseRow={onSaveLicenseRow}
              onDeleteLicenseRow={onDeleteLicenseRow}
            />
          );
        })}
      </div>
    </div>
  );
}

function EmployeeMaster({employees, onSave, licenses, engLicenses, onSaveEngLicenses}){
  const [query,setQuery]=useState("");
  const [editingCode,setEditingCode]=useState(null);
  const [editDraft,setEditDraft]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [newEmp,setNewEmp]=useState({ENGCD:"",COMPCD:"",ID_NAME:""});
  const [formError,setFormError]=useState("");
  const [showImport,setShowImport]=useState(false);
  const [importPreview,setImportPreview]=useState(null);
  const [importError,setImportError]=useState("");
  const importInputRef=useRef(null);
  const [expandedLic,setExpandedLic]=useState(null);
  const [addLicCode,setAddLicCode]=useState("");

  const licenseMap=useMemo(()=>{
    const map={};
    (licenses||[]).forEach((l)=>{ map[l.LICCD]=l.LICNM; });
    return map;
  },[licenses]);
  const licenseOptionsSorted=useMemo(()=>
    [...(licenses||[])].sort((a,b)=>(a.LICNM||"").localeCompare(b.LICNM||"","ja"))
  ,[licenses]);
  const engLicMap=useMemo(()=>{
    const map={};
    (engLicenses||[]).forEach((r)=>{
      if(!map[r.ENGCD]) map[r.ENGCD]=[];
      map[r.ENGCD].push(r.LICCD);
    });
    return map;
  },[engLicenses]);

  const addLicenseTo=(engcd, liccd)=>{
    if(!liccd) return;
    if((engLicMap[engcd]||[]).includes(liccd)) return;
    onSaveEngLicenses([...(engLicenses||[]), {ENGCD:engcd, LICCD:liccd}]);
    setAddLicCode("");
  };
  const removeLicenseFrom=(engcd, liccd)=>{
    onSaveEngLicenses((engLicenses||[]).filter((r)=> !(r.ENGCD===engcd && r.LICCD===liccd)));
  };

  const filtered=useMemo(()=>{
    const q=query.trim();
    let list=[...employees].sort((a,b)=>(a.ID_NAME||"").localeCompare(b.ID_NAME||"","ja"));
    if(q) list=list.filter((e)=>(e.ID_NAME||"").includes(q) || (e.ENGCD||"").includes(q));
    return list;
  },[employees,query]);

  const activeCount=employees.filter((e)=>e.STATUS!=="retired").length;
  const retiredCount=employees.length-activeCount;

  const startEdit=(emp)=>{
    setEditingCode(emp.ENGCD);
    setEditDraft({ID_NAME:emp.ID_NAME||"", COMPCD:emp.COMPCD||""});
  };
  const cancelEdit=()=>{ setEditingCode(null); setEditDraft({}); };
  const saveEdit=(engcd)=>{
    const next=employees.map((e)=> e.ENGCD===engcd ? {...e, ID_NAME:editDraft.ID_NAME, COMPCD:editDraft.COMPCD} : e);
    onSave(next);
    setEditingCode(null);
  };
  const toggleStatus=(emp)=>{
    const next=employees.map((e)=> e.ENGCD===emp.ENGCD ? {...e, STATUS: e.STATUS==="retired" ? "active" : "retired"} : e);
    onSave(next);
  };
  const addEmployee=()=>{
    const code=newEmp.ENGCD.trim();
    if(!/^\d+$/.test(code)){ setFormError("技術者コードは数字で入力してください"); return; }
    if(employees.some((e)=>e.ENGCD===code)){ setFormError("そのコードは既に登録されています"); return; }
    if(!newEmp.ID_NAME.trim()){ setFormError("氏名を入力してください"); return; }
    const rec={ENGCD:code, COMPCD:newEmp.COMPCD.trim(), ID_NAME:newEmp.ID_NAME.trim(), ID_SEI:"", ID_MEI:"", STATUS:"active"};
    onSave([...employees, rec]);
    setNewEmp({ENGCD:"",COMPCD:"",ID_NAME:""});
    setShowAdd(false);
    setFormError("");
  };

  const handleImportFile=async (file)=>{
    setImportError("");
    setImportPreview(null);
    try{
      let rowsGrid=[];
      const lower=file.name.toLowerCase();
      if(lower.endsWith(".xlsx") || lower.endsWith(".xls")){
        const buf=await file.arrayBuffer();
        const wb=XLSX.read(buf, {type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rowsGrid=XLSX.utils.sheet_to_json(sheet, {header:1});
      } else {
        const text=await file.text();
        const parsed=Papa.parse(text, {skipEmptyLines:true});
        rowsGrid=parsed.data||[];
      }

      // 「在籍社員No／部署／役職」のような見出し行を探す（見つかれば部署・役職も取り込む）
      let headerInfo=null;
      for(let i=0;i<Math.min(rowsGrid.length,5);i++){
        const row=(rowsGrid[i]||[]).map((c)=>String(c||"").trim());
        const codeIdx=row.findIndex((c)=>c.includes("社員No")||c.includes("技術者コード")||c==="ID"||c==="コード");
        if(codeIdx>=0){
          const deptIdx=row.findIndex((c)=>c.includes("部署")||c.includes("所属"));
          const posIdx=row.findIndex((c)=>c.includes("役職"));
          headerInfo={headerRow:i, codeIdx, deptIdx, posIdx};
          break;
        }
      }

      const normalize=(s)=> /^\d+$/.test(s) ? String(parseInt(s,10)) : s;
      const deptPosMap={};
      let rawCodes=[];

      if(headerInfo){
        for(let r=headerInfo.headerRow+1; r<rowsGrid.length; r++){
          const row=rowsGrid[r]||[];
          const codeRaw=String(row[headerInfo.codeIdx]===undefined||row[headerInfo.codeIdx]===null?"":row[headerInfo.codeIdx]).trim();
          if(!/^[0-9A-Za-z]+$/.test(codeRaw)) continue;
          rawCodes.push(codeRaw);
          if(/^\d+$/.test(codeRaw)){
            const dept=headerInfo.deptIdx>=0 ? String(row[headerInfo.deptIdx]||"").replace(/\u3000/g," ").trim() : "";
            const position=headerInfo.posIdx>=0 ? String(row[headerInfo.posIdx]||"").trim() : "";
            deptPosMap[normalize(codeRaw)]={dept, position};
          }
        }
      } else {
        const cells=[];
        rowsGrid.forEach((row)=>{ (row||[]).forEach((c)=>cells.push(c)); });
        rawCodes=cells
          .map((c)=>String(c===undefined||c===null?"":c).trim())
          .filter((s)=>/^[0-9A-Za-z]+$/.test(s));
      }

      if(rawCodes.length===0){
        setImportError("コードを1件も読み取れませんでした。1列に技術者コードが並んだファイルか確認してください。");
        return;
      }
      // 技術者コードは6桁管理だが、ファイル・社員データ側で桁数の表記ゆれ（先頭ゼロの有無）があるため、
      // 数字のみのコードは数値として正規化して突合する（"41"も"000041"も同じ扱いになる）。
      // 英字混じりなど数値化できないものは対象外として分けておく。
      const excluded=rawCodes.filter((s)=>!/^\d+$/.test(s));
      const activeNormSet=new Set(rawCodes.filter((s)=>/^\d+$/.test(s)).map(normalize));

      const existingNorm=employees.map((e)=>({emp:e, norm:normalize(e.ENGCD||"")}));
      const unmatched=[...activeNormSet].filter((n)=> !existingNorm.some((x)=>x.norm===n));
      const matchedCount=existingNorm.filter((x)=>activeNormSet.has(x.norm)).length;
      setImportPreview({
        activeNormSet,
        deptPosMap,
        hasDeptInfo: !!(headerInfo && (headerInfo.deptIdx>=0 || headerInfo.posIdx>=0)),
        totalListed: activeNormSet.size,
        matchedCount,
        toRetireCount: employees.length-matchedCount,
        unmatched,
        excluded,
        filename: file.name,
      });
    }catch(e){
      setImportError("ファイルを読み取れませんでした（"+e.message+"）");
    }
  };

  const applyImport=()=>{
    if(!importPreview) return;
    const normalize=(s)=> /^\d+$/.test(s) ? String(parseInt(s,10)) : s;
    const next=employees.map((e)=>{
      const norm=normalize(e.ENGCD||"");
      const isActive=importPreview.activeNormSet.has(norm);
      const dp=importPreview.deptPosMap[norm];
      return {
        ...e,
        STATUS: isActive ? "active" : "retired",
        DEPT: dp ? dp.dept : e.DEPT,
        POSITION: dp ? dp.position : e.POSITION,
      };
    });
    onSave(next);
    setImportPreview(null);
    setShowImport(false);
  };

  return (
    <div className="card">
      <div className="res-hd">
        <div>
          <h2>技術者情報メンテナンス</h2>
          <p className="sub">{employees.length}名登録中（在職 {activeCount}名 ／ 退職 {retiredCount}名）</p>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button className="btn-outline" onClick={()=>{ setShowImport((v)=>!v); setImportError(""); setImportPreview(null); }}>
            <Ic.Upload/> 在籍社員リストを取り込む
          </button>
          <button className="btn-outline" onClick={()=>{ setShowAdd((v)=>!v); setFormError(""); }}>
            <Ic.Plus/> 新規社員を登録
          </button>
        </div>
      </div>

      {showImport &&
        <div className="master-add-form" style={{flexDirection:"column", alignItems:"stretch"}}>
          <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 10px"}}>
            現在の在職者コード一覧（.csv または .xlsx、1列に技術者コードが並んだもの）を読み込むと、
            リストに載っている社員を「在職」、載っていない社員を「退職」に一括更新します。
          </p>
          <div className="drop" style={{padding:"20px"}} onClick={()=>importInputRef.current && importInputRef.current.click()}>
            <Ic.Upload color="var(--accent)"/>
            <p>ファイルをクリックして選択</p>
            <input ref={importInputRef} type="file" accept=".csv,.xlsx,.xls" style={{display:"none"}}
              onChange={(e)=>{ if(e.target.files[0]) handleImportFile(e.target.files[0]); }}/>
          </div>

          {importError && <div className="err-box" style={{marginTop:10}}><Ic.Warn/><div>{importError}</div></div>}

          {importPreview &&
            <div style={{marginTop:12, fontSize:12.5}}>
              <p style={{margin:"0 0 6px"}}>
                「{importPreview.filename}」から <b>{importPreview.totalListed}</b> 件のコードを読み取りました。
                適用すると、既存の社員データ {employees.length}名のうち
                <b style={{color:"var(--green)"}}> 在職 {importPreview.matchedCount}名</b> ／
                <b style={{color:"var(--red)"}}> 退職 {importPreview.toRetireCount}名</b> になります。
                {importPreview.hasDeptInfo && <span> あわせて部署・役職も更新されます。</span>}
              </p>
              {importPreview.unmatched.length>0 &&
                <div className="storage-warn" style={{marginTop:8}}>
                  <Ic.Warn/> リストには載っているが社員データに未登録のコードが{importPreview.unmatched.length}件あります（今回は反映されません。先に「新規社員を登録」で追加してください）：<br/>
                  <span style={{fontFamily:"var(--mono)"}}>{importPreview.unmatched.join(", ")}</span>
                </div>
              }
              {importPreview.excluded.length>0 &&
                <div className="storage-warn" style={{marginTop:8}}>
                  <Ic.Warn/> 数字のみのコードとして解釈できず、対象外にしたもの({importPreview.excluded.length}件)：<br/>
                  <span style={{fontFamily:"var(--mono)"}}>{importPreview.excluded.join(", ")}</span>
                </div>
              }
              <div style={{display:"flex", gap:10, marginTop:12}}>
                <button className="btn-primary" onClick={applyImport}>この内容で適用する</button>
                <button className="btn-ghost" onClick={()=>{ setImportPreview(null); setShowImport(false); }}>キャンセル</button>
              </div>
            </div>
          }
        </div>
      }

      {showAdd &&
        <div className="master-add-form">
          <input type="text" placeholder="技術者コード（数字）" value={newEmp.ENGCD}
            onChange={(e)=>setNewEmp({...newEmp, ENGCD:e.target.value})}/>
          <input type="text" placeholder="氏名" value={newEmp.ID_NAME}
            onChange={(e)=>setNewEmp({...newEmp, ID_NAME:e.target.value})}/>
          <input type="text" placeholder="所属コード（任意）" value={newEmp.COMPCD}
            onChange={(e)=>setNewEmp({...newEmp, COMPCD:e.target.value})}/>
          <button className="btn-primary" onClick={addEmployee}>登録する</button>
          {formError && <span className="m-form-err">{formError}</span>}
        </div>
      }

      <input type="text" className="kw-input" style={{marginTop:14, marginBottom:12, maxWidth:320}}
        value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="氏名・技術者コードで検索"/>

      {(()=>{
        const renderRow=(emp)=>{
          const retired=emp.STATUS==="retired";
          const isEditing=editingCode===emp.ENGCD;
          const licCodes=engLicMap[emp.ENGCD]||[];
          const licOpen=expandedLic===emp.ENGCD;
          return (
            <React.Fragment key={emp.ENGCD}>
            <div className={"master-row"+(retired?" retired":"")}>
              <span className="m-code">#{emp.ENGCD}</span>
              {isEditing ? (
                <React.Fragment>
                  <input className="m-input" value={editDraft.ID_NAME}
                    onChange={(e)=>setEditDraft({...editDraft, ID_NAME:e.target.value})}/>
                  <input className="m-input" value={editDraft.COMPCD}
                    onChange={(e)=>setEditDraft({...editDraft, COMPCD:e.target.value})}/>
                  <span></span>
                  <span></span>
                  <span className="m-actions">
                    <button className="btn-outline" onClick={()=>saveEdit(emp.ENGCD)}>保存</button>
                    <button className="btn-ghost" onClick={cancelEdit}>取消</button>
                  </span>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <span className="m-name">{emp.ID_NAME}</span>
                  <span className="m-comp" title={(emp.DEPT || emp.POSITION) ? [emp.DEPT, emp.POSITION].filter(Boolean).join(" ／ ") : (emp.COMPCD || "")}>
                    {(emp.DEPT || emp.POSITION)
                      ? [emp.DEPT, emp.POSITION].filter(Boolean).join(" ／ ")
                      : (emp.COMPCD || "-")}
                  </span>
                  <button type="button" className="m-lic-toggle" onClick={()=>setExpandedLic(licOpen?null:emp.ENGCD)}>
                    資格 {licCodes.length}件 {licOpen ? <Ic.Down/> : <Ic.Right/>}
                  </button>
                  <span className={"m-badge"+(retired?" retired":"")}>{retired ? "退職" : "在職"}</span>
                  <span className="m-actions">
                    <button className="btn-ghost" onClick={()=>startEdit(emp)}><Ic.Edit/></button>
                    <button className="btn-ghost" onClick={()=>toggleStatus(emp)}>
                      {retired ? "在職に戻す" : "退職にする"}
                    </button>
                  </span>
                </React.Fragment>
              )}
            </div>
            {licOpen &&
              <div className="m-lic-panel">
                <div className="m-lic-tags">
                  {licCodes.length===0 && <span style={{color:"var(--faint)", fontSize:12}}>保有資格の登録がありません</span>}
                  {licCodes.map((code)=>(
                    <span key={code} className="m-lic-tag">
                      {licenseMap[code] || ("資格("+code+")")}
                      <button onClick={()=>removeLicenseFrom(emp.ENGCD, code)}><Ic.X size={11}/></button>
                    </span>
                  ))}
                </div>
                <div className="m-lic-add">
                  <select value={addLicCode} onChange={(e)=>setAddLicCode(e.target.value)}>
                    <option value="">資格を選択して追加...</option>
                    {licenseOptionsSorted.filter((l)=>!licCodes.includes(l.LICCD)).map((l)=>(
                      <option key={l.LICCD} value={l.LICCD}>{l.LICNM}</option>
                    ))}
                  </select>
                  <button className="btn-outline" onClick={()=>addLicenseTo(emp.ENGCD, addLicCode)}><Ic.Plus/> 追加</button>
                </div>
              </div>
            }
            </React.Fragment>
          );
        };

        const activeList=filtered.filter((e)=>e.STATUS!=="retired");
        const retiredList=filtered.filter((e)=>e.STATUS==="retired");
        const head=(
          <div className="master-row master-row-head">
            <span className="m-code">コード</span>
            <span className="m-name">氏名</span>
            <span className="m-comp">所属</span>
            <span>資格</span>
            <span className="m-status">状態</span>
            <span></span>
          </div>
        );

        return (
          <React.Fragment>
            <div className="master-group-label">在職者（{activeList.length}名）</div>
            <div className="master-list">
              {head}
              {activeList.map(renderRow)}
              {activeList.length===0 && <div className="empty">該当する在職者がいません</div>}
            </div>

            <div className="master-group-label retired">退職者（{retiredList.length}名）</div>
            <div className="master-list">
              {head}
              {retiredList.map(renderRow)}
              {retiredList.length===0 && <div className="empty">該当する退職者がいません</div>}
            </div>
          </React.Fragment>
        );
      })()}
    </div>
  );
}

/* ---------------- data uploader (used both for onboarding & update overlay) ---------------- */
function Uploader({datasets, onMerged, compact}){
  const [dragOver,setDragOver]=useState(false);
  const [loadErrors,setLoadErrors]=useState([]);
  const [pending,setPending]=useState({}); // freshly parsed, not yet merged types this session
  const fileInputRef=useRef(null);

  const handleFiles=useCallback(async (fileList)=>{
    const all=Array.from(fileList);
    const csvFiles=all.filter((f)=>f.name.toLowerCase().endsWith(".csv"));
    const jsonFiles=all.filter((f)=>f.name.toLowerCase().endsWith(".json"));

    const csvResults=await Promise.all(csvFiles.map(parseCsvFile));
    const jsonResults=await Promise.all(jsonFiles.map(async (f)=>{
      try{
        const text=await f.text();
        const obj=JSON.parse(text);
        return {ok:true, filename:f.name, obj};
      }catch(e){ return {ok:false, filename:f.name, error:"JSON形式を読み取れませんでした"}; }
    }));

    const errs=[];
    const nextPending={...pending};
    csvResults.forEach((r)=>{
      if(r.ok){ nextPending[r.type]={records:r.records, filename:r.filename}; }
      else errs.push(r.filename+": "+r.error);
    });
    jsonResults.forEach((r)=>{
      if(r.ok){
        Object.keys(DATASET_DEFS).forEach((type)=>{
          if(r.obj[type] && Array.isArray(r.obj[type].records)){
            nextPending[type]={records:r.obj[type].records, filename:r.filename};
          }
        });
      } else errs.push(r.filename+": "+r.error);
    });

    setPending(nextPending);
    setLoadErrors(errs);
    // merge immediately into parent datasets
    const merged={...datasets};
    Object.entries(nextPending).forEach(([type,data])=>{
      merged[type] = {
        records: mergeRecords(datasets[type]?.records, data.records, MERGE_KEY[type]),
        filename: data.filename,
      };
    });
    // 資格コード(LICCD)は過去のデータで桁数の表記ゆれ（先頭ゼロなし）が残っている場合があるため、
    // 更新のたびに既存データも含めて4桁ゼロ埋めへ正規化する
    if(merged.licenses){
      merged.licenses = {...merged.licenses, records: merged.licenses.records.map((r)=>({...r, LICCD: normLicCode(r.LICCD)}))};
    }
    if(merged.englicense){
      merged.englicense = {...merged.englicense, records: dedupeEngLicense(merged.englicense.records.map((r)=>({...r, LICCD: normLicCode(r.LICCD)})))};
    }
    onMerged(merged);
  },[datasets, pending, onMerged]);

  const onDrop=(e)=>{ e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); };

  return (
    <div>
      <div className={"drop"+(dragOver?" over":"")}
        onDragOver={(e)=>{e.preventDefault(); setDragOver(true);}}
        onDragLeave={()=>setDragOver(false)}
        onDrop={onDrop}
        onClick={()=>fileInputRef.current && fileInputRef.current.click()}>
        <Ic.Upload color={dragOver?"var(--orange)":"var(--blue)"}/>
        <p>CSV／バックアップJSONファイルをここにドロップ、またはクリックして選択（複数可）</p>
        <input ref={fileInputRef} type="file" multiple accept=".csv,.json" style={{display:"none"}}
          onChange={(e)=>handleFiles(e.target.files)}/>
      </div>

      {loadErrors.length>0 &&
        <div className="err-box"><Ic.Warn/><div>{loadErrors.map((e,i)=><div key={i}>{e}</div>)}</div></div>
      }

      <div className="status-grid">
        {Object.entries(DATASET_DEFS).map(([key,def])=>{
          const loaded=!!datasets[key];
          return (
            <div key={key} className={"status-card"+(loaded?" on":"")}>
              {loaded ? <Ic.Check color="var(--green)"/> : <Ic.Circle color="var(--faint)"/>}
              <div style={{minWidth:0}}>
                <div className="t">{def.label}</div>
                <div className="n">{loaded ? datasets[key].records.length+"件" : "未読込"}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- main app ---------------- */
function App(){
  const [hasStorage] = useState(()=>storageAvailable());
  const [datasets,setDatasets]=useState({});
  const [loading,setLoading]=useState(true);
  const [showUpdate,setShowUpdate]=useState(false);
  const [toast,setToast]=useState("");

  const [authReady,setAuthReady]=useState(false);
  const [role,setRole]=useState(null); // "editor" | "viewer" | null
  const [authUser,setAuthUser]=useState(null);
  const [loginId,setLoginId]=useState(""); // メールアドレス
  const [loginPw,setLoginPw]=useState("");
  const [loginError,setLoginError]=useState("");
  const [loginBusy,setLoginBusy]=useState(false);
  const canEdit = String(role||"").trim().toLowerCase()==="editor";

  useEffect(()=>{
    let unsub=null;
    waitForFirebase().then(()=>{
      if(!window.fb){ setAuthReady(true); return; }
      const {auth, onAuthStateChanged, db, doc, getDoc} = window.fb;
      unsub = onAuthStateChanged(auth, async (user)=>{
        setAuthUser(user);
        if(user){
          try{
            const snap = await getDoc(doc(db, "users", user.uid));
            if(snap.exists()){
              const raw=snap.data().role;
              setRole(raw || "viewer");
              setToast("取得したrole の値: 「"+JSON.stringify(raw)+"」");
              setTimeout(()=>setToast(""), 6000);
            } else {
              setRole("viewer");
              console.warn("users/"+user.uid+" ドキュメントが見つかりません。UIDが一致しているか確認してください。");
              setToast("権限情報(users/"+user.uid+")が見つからないため、閲覧のみとして扱います");
              setTimeout(()=>setToast(""), 6000);
            }
          }catch(e){
            setRole("viewer");
            console.error("権限情報の取得に失敗:", e);
            setToast("権限情報の取得に失敗しました（"+(e.code||e.message)+"）。閲覧のみとして扱います");
            setTimeout(()=>setToast(""), 6000);
          }
        } else {
          setRole(null);
        }
        setAuthReady(true);
      });
    });
    return ()=>{ if(unsub) unsub(); };
  },[]);

  const doLogin=async ()=>{
    setLoginError("");
    if(!window.fb){ setLoginError("Firebaseへの接続に失敗しました。しばらくして再読み込みしてください。"); return; }
    setLoginBusy(true);
    try{
      await window.fb.signInWithEmailAndPassword(window.fb.auth, loginId.trim(), loginPw);
      // 成功時はonAuthStateChangedがroleをセットする
    }catch(e){
      setLoginError("ログインに失敗しました（メールアドレスまたはパスワードが違います）");
    }
    setLoginBusy(false);
  };
  const doLogout=()=>{
    if(window.fb) window.fb.signOut(window.fb.auth);
    setLoginId(""); setLoginPw(""); setLoginError("");
  };

  useEffect(()=>{
    if(!authUser) return; // ログインしてから読み込む
    loadFromStorage()
      .then((d)=>setDatasets(d))
      .catch(()=>setDatasets({}))
      .finally(()=>setLoading(false));
  },[authUser]);

  const requiredLoaded = ["constrslt","eng","kind"].every((k)=>datasets[k]);
  const optionalLoaded = ["employee","literals"].every((k)=>datasets[k]);

  const persist=async (next)=>{
    const prev=datasets;
    setDatasets(next);
    const ok = hasStorage ? await saveToStorage(next, prev) : false;
    setToast(ok ? "データを保存しました（Firestoreに同期済み）"
                : "保存に失敗しました。通信状況を確認し、必要であれば「バックアップ保存」でJSONを書き出しておいてください");
    setTimeout(()=>setToast(""), 4500);
  };

  const exportBackup=()=>{
    const blob=new Blob([JSON.stringify(datasets)], {type:"application/json"});
    const url=URL.createObjectURL(blob);
    const now=new Date();
    const ymd=now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0");
    const a=document.createElement("a");
    a.href=url; a.download="配置データバックアップ_"+ymd+".json"; a.click();
    URL.revokeObjectURL(url);
  };

  /* ---------------- search state ---------------- */
  const now=new Date();
  const currentFY = now.getMonth()+1>=4 ? now.getFullYear() : now.getFullYear()-1;
  const [fyFrom,setFyFrom]=useState(currentFY-9);
  const [fyFromMonth,setFyFromMonth]=useState("04");
  const [fyTo,setFyTo]=useState(currentFY);
  const [fyToMonth,setFyToMonth]=useState("04");
  const [selectedBunya,setSelectedBunya]=useState([]);
  const [selectedKind,setSelectedKind]=useState([]);
  const [selectedRoles,setSelectedRoles]=useState([]);
  const [selectedLicenses,setSelectedLicenses]=useState([]);
  const [keikMin,setKeikMin]=useState("");
  const [heighMin,setHeighMin]=useState("");
  const [suisMin,setSuisMin]=useState("");
  const [syusMin,setSyusMin]=useState("");
  const [horyuMin,setHoryuMin]=useState("");
  const [keyword,setKeyword]=useState("");
  const [searched,setSearched]=useState(false);
  const [expanded,setExpanded]=useState({});
  const [includeRetired,setIncludeRetired]=useState(false);
  const [activeTab,setActiveTab]=useState("search");
  const [jumpToConstno,setJumpToConstno]=useState(null);
  const [jumpNonce,setJumpNonce]=useState(0);
  const goToConstno=(cn)=>{ setJumpToConstno(cn); setJumpNonce((n)=>n+1); setActiveTab("detail"); };
  const [jumpToEngcd,setJumpToEngcd]=useState(null);
  const [jumpEngcdNonce,setJumpEngcdNonce]=useState(0);
  const goToPersonnel=(engcd)=>{ setJumpToEngcd(engcd); setJumpEngcdNonce((n)=>n+1); setActiveTab("personnel"); };

  const verifiedMap=useMemo(()=>{
    const map={};
    (datasets.verified?.records||[]).forEach((r)=>{
      map[r.ENGCD+"|"+r.CONSTNO+"|"+r.POSICD] = r.STATUS || "ok"; // 旧データ(STATUS無し)は"ok"扱いで互換
    });
    return map;
  },[datasets.verified]);
  const setVerifyStatus=(engcd, constno, posicd, status)=>{
    const key=engcd+"|"+constno+"|"+posicd;
    const existing=datasets.verified?.records||[];
    const filtered=existing.filter((r)=> !(r.ENGCD===engcd && r.CONSTNO===constno && r.POSICD===posicd));
    const next = (verifiedMap[key]===status) ? filtered : [...filtered, {ENGCD:engcd, CONSTNO:constno, POSICD:posicd, STATUS:status}];
    persist({...datasets, verified:{records: next, filename: datasets.verified?.filename || "手動確認"}});
  };

  const literalMap=useMemo(()=>{
    const map={};
    (datasets.literals?.records||[]).forEach((r)=>{
      const t=r.CDTYP, c=String(parseFloat(r.LTLCD));
      if(!map[t]) map[t]={};
      map[t][c]=r.LTLNM;
    });
    return map;
  },[datasets.literals]);

  const lookupLit=(type,code)=>{
    if(code===undefined||code===null||code==="") return "";
    const c=String(parseFloat(code));
    return (literalMap[type] && literalMap[type][c]) || ("(code:"+code+")");
  };

  const employeeMap=useMemo(()=>{
    const map={};
    (datasets.employee?.records||[]).forEach((r)=>{ map[r.ENGCD]=r; });
    return map;
  },[datasets.employee]);

  const projectIndex=useMemo(()=>{
    if(!requiredLoaded) return null;
    const kindByConst={};
    (datasets.kind.records||[]).forEach((r)=>{
      if(!kindByConst[r.CONSTNO]) kindByConst[r.CONSTNO]=[];
      kindByConst[r.CONSTNO].push(r);
    });
    const constMap={};
    (datasets.constrslt.records||[]).forEach((r)=>{
      constMap[r.CONSTNO]={...r, kinds:kindByConst[r.CONSTNO]||[]};
    });
    return constMap;
  },[datasets, requiredLoaded]);

  const bunyaOptions=useMemo(()=>{
    if(!requiredLoaded) return [];
    const set=new Set();
    (datasets.constrslt.records||[]).forEach((r)=>{ if(r.BUNYA) set.add(String(parseFloat(r.BUNYA))); });
    return [...set].sort((a,b)=>a-b).map((code)=>({code, name:(literalMap.BNYA&&literalMap.BNYA[code])||("分野("+code+")")}));
  },[datasets, requiredLoaded, literalMap]);

  const kindOptions=useMemo(()=>{
    if(!requiredLoaded) return [];
    const set=new Set();
    (datasets.kind.records||[]).forEach((r)=>{ if(r.KIND) set.add(String(parseFloat(r.KIND))); });
    return [...set]
      .filter((code)=> !!(literalMap.SHRU && literalMap.SHRU[code])) // マスタに名称が無いコードは非表示
      .map((code)=>({code, name: literalMap.SHRU[code]}))
      .sort((a,b)=> parseFloat(a.code) - parseFloat(b.code)); // SHRUコード番号の昇順
  },[datasets, requiredLoaded, literalMap]);

  const roleOptions=useMemo(()=>{
    if(!requiredLoaded) return [];
    const set=new Set();
    // マスタに定義済みの役割は全て候補に出す（まだ実績が無い役割も選べるように）
    if(literalMap.TRGT) Object.keys(literalMap.TRGT).forEach((code)=>set.add(code));
    // マスタに無いコードでも実績データ側に出現していれば候補に加える
    (datasets.eng.records||[]).forEach((r)=>{ if(r.POSICD) set.add(String(parseFloat(r.POSICD))); });
    return [...set].sort((a,b)=>a-b).map((code)=>({code, name:(literalMap.TRGT&&literalMap.TRGT[code])||("役割("+code+")")}));
  },[datasets, requiredLoaded, literalMap]);

  const licenseOptions=useMemo(()=>{
    return [...(datasets.licenses?.records||[])]
      .filter((l)=> String(parseFloat(l.LICEFG||"0"))==="1") // 技術者配置使用有無=有りのみ
      .map((l)=>({code:l.LICCD, name:l.LICNM}))
      .sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
  },[datasets.licenses]);

  const licenseNameMap=useMemo(()=>{
    const map={};
    (datasets.licenses?.records||[]).forEach((l)=>{ map[l.LICCD]=l.LICNM; });
    return map;
  },[datasets.licenses]);
  const certLinksByEngcd=useMemo(()=>{
    const map={};
    (datasets.englicense?.records||[]).forEach((r)=>{
      if(!r.CERT_URL) return;
      if(!map[r.ENGCD]) map[r.ENGCD]=[];
      map[r.ENGCD].push({url:r.CERT_URL, name: licenseNameMap[r.LICCD] || ("資格("+r.LICCD+")")});
    });
    return map;
  },[datasets.englicense, licenseNameMap]);
  const kanriCertByEngcd=useMemo(()=>{
    const map={};
    (datasets.enginfo?.records||[]).forEach((r)=>{ if(r.KANRI_CERT_URL) map[r.ENGCD]=r.KANRI_CERT_URL; });
    return map;
  },[datasets.enginfo]);

  const employeeLicMap=useMemo(()=>{
    const map={};
    (datasets.englicense?.records||[]).forEach((r)=>{
      if(!map[r.ENGCD]) map[r.ENGCD]=new Set();
      map[r.ENGCD].add(r.LICCD);
    });
    return map;
  },[datasets.englicense]);

  const results=useMemo(()=>{
    if(!requiredLoaded || !searched) return [];
    const keikMinN = keikMin==="" ? null : parseFloat(keikMin);
    const heighMinN = heighMin==="" ? null : parseFloat(heighMin);
    const suisMinN = suisMin==="" ? null : parseFloat(suisMin);
    const syusMinN = syusMin==="" ? null : parseFloat(syusMin);
    const horyuMinN = horyuMin==="" ? null : parseFloat(horyuMin);
    const kw=keyword.trim();
    const byEngineer={};

    (datasets.eng.records||[]).forEach((engRow)=>{
      const proj=projectIndex[engRow.CONSTNO];
      if(!proj) return;

      if(!includeRetired){
        const emp=employeeMap[engRow.ENGCD];
        if(emp && emp.STATUS==="retired") return;
      }

      if(selectedLicenses.length){
        const held=employeeLicMap[engRow.ENGCD];
        const hasAll=selectedLicenses.every((code)=> held && held.has(code));
        if(!hasAll) return;
      }

      const fy=fiscalYearOf(proj.KOKT);
      const projYM = proj.KOKT && /^\d{8}$/.test(proj.KOKT) ? parseInt(proj.KOKT.slice(0,6),10) : null;
      const fromYM = fyFrom*100 + parseInt(fyFromMonth,10);
      const toYM = fyTo*100 + parseInt(fyToMonth,10);
      if(projYM===null || projYM<fromYM || projYM>toYM) return;
      if(selectedRoles.length && !selectedRoles.includes(String(parseFloat(engRow.POSICD||"")))) return;
      if(selectedBunya.length && !selectedBunya.includes(String(parseFloat(proj.BUNYA||"")))) return;
      if(kw){
        const name=(proj.NAM1||"")+(proj.NAM2||"");
        if(!name.includes(kw)) return;
      }

      const hasKindFilter = selectedKind.length || keikMinN!==null || heighMinN!==null || suisMinN!==null || syusMinN!==null || horyuMinN!==null;
      const matchingKinds=(proj.kinds||[]).filter((k)=>{
        if(selectedKind.length && !selectedKind.includes(String(parseFloat(k.KIND||"")))) return false;
        const num=(v)=> v==="" || v===undefined ? null : parseFloat(v);
        const keik=num(k.KEIK), heigh=num(k.HEIGH), suis=num(k.SUIS), syus=num(k.SYUS), horyu=num(k.HORYU);
        if(keikMinN!==null && (keik===null||keik<keikMinN)) return false;
        if(heighMinN!==null && (heigh===null||heigh<heighMinN)) return false;
        if(suisMinN!==null && (suis===null||suis<suisMinN)) return false;
        if(syusMinN!==null && (syus===null||syus<syusMinN)) return false;
        if(horyuMinN!==null && (horyu===null||horyu<horyuMinN)) return false;
        return true;
      });
      if(hasKindFilter && matchingKinds.length===0) return;

      const engcd=engRow.ENGCD;
      if(!byEngineer[engcd]){
        const emp=employeeMap[engcd];
        byEngineer[engcd]={
          engcd,
          name: emp ? emp.ID_NAME : ("(コード:"+engcd+")"),
          dept: emp ? emp.DEPT : "",
          position: emp ? emp.POSITION : "",
          retired: !!(emp && emp.STATUS==="retired"),
          entries:[],
        };
      }
      const periods=[];
      [["KOKF01","KOKT01"],["KOKF02","KOKT02"],["KOKF03","KOKT03"]].forEach(([f,t])=>{
        if(engRow[f]) periods.push({from:engRow[f], to:engRow[t]});
      });
      // 従事期間が「据付開始日〜工期末」にどれだけ重なっているか（割合%）
      // = 従事期間と据付期間が重なる日数の合計 ÷ 据付期間の日数
      let installPct = null;
      if(validYMD(proj.SSDAY) && validYMD(proj.KOKT) && proj.SSDAY<=proj.KOKT && periods.length>0){
        const installLen = totalDays(proj.SSDAY, proj.KOKT);
        if(installLen>0){
          const overlapSum = periods.reduce((sum,p)=> sum + overlapDays(p.from,p.to, proj.SSDAY, proj.KOKT), 0);
          installPct = Math.min(100, Math.round((overlapSum/installLen)*1000)/10); // 小数点1桁
        }
      }
      const installOK = installPct!==null && installPct>=100;

      const vkey=engcd+"|"+proj.CONSTNO+"|"+engRow.POSICD;
      const entryKinds=(hasKindFilter?matchingKinds:proj.kinds).map((k)=>({
        name: lookupLit("SHRU", k.KIND), kbn: lookupLit("SESU", k.KBN), keik:k.KEIK, heigh:k.HEIGH, suis:k.SUIS, syus:k.SYUS, horyu:k.HORYU, gaiyo:k.KGAI,
      }));
      // 製据区分が「据付」または「製据」を含み、かつ（据付期間内100% or 従事割合100%＝専任）なら自動で「有」
      // 逆に据付期間内が80%以下なら自動で「無」（80〜100%未満はどちらとも判定せず、人の目で確認）
      const isInstallKbn = entryKinds.some((k)=> k.kbn==="据付" || k.kbn==="製据");
      const jwariFull = engRow.JWARI!==undefined && engRow.JWARI!==null && engRow.JWARI!=="" && parseFloat(engRow.JWARI)>=99.95;
      const autoOK = isInstallKbn && (installOK || jwariFull);
      const autoNo = !autoOK && installPct!==null && installPct<=80;
      const manualStatus = verifiedMap[vkey] || null;
      const effectiveStatus = manualStatus==="no" ? "no" : (manualStatus==="ok" ? "ok" : (autoOK ? "ok" : (autoNo ? "no" : null)));

      byEngineer[engcd].entries.push({
        constno: proj.CONSTNO,
        posicd: engRow.POSICD,
        vkey,
        verifyStatus: effectiveStatus,
        isAutoVerified: manualStatus===null && (autoOK || autoNo),
        installOK,
        installPct,
        point: proj.POINT,
        corinsUrl: proj.CORINS_URL,
        ratingPdfUrl: proj.RATING_PDF_URL,
        awardPdfUrl: proj.AWARD_PDF_URL,
        name: ((proj.NAM1||"")+" "+(proj.NAM2||"")).trim(),
        orderer: proj.KYA1, kokf: proj.KOKF, kokt: proj.KOKT, ssday: proj.SSDAY, fy,
        bunya: lookupLit("BNYA", proj.BUNYA),
        role: lookupLit("TRGT", engRow.POSICD),
        isJv: !!proj.JVNM,
        periods,
        jwari: engRow.JWARI,
        kinds: entryKinds,
      });
    });

    Object.values(byEngineer).forEach((r)=>{
      r.hasVerified = r.entries.some((e)=>e.verifyStatus==="ok");
      r.allRejected = !r.hasVerified && r.entries.length>0 && r.entries.every((e)=>e.verifyStatus==="no");
      const okPoints = r.entries.filter((e)=>e.verifyStatus==="ok" && e.point!==undefined && e.point!=="" && !isNaN(parseFloat(e.point))).map((e)=>parseFloat(e.point));
      r.bestPoint = okPoints.length>0 ? Math.max(...okPoints) : null;
      r.certLinks = certLinksByEngcd[r.engcd] || [];
      r.kanriCertUrl = kanriCertByEngcd[r.engcd] || null;
    });

    return Object.values(byEngineer).sort((a,b)=>b.entries.length-a.entries.length);
  },[requiredLoaded, searched, datasets, projectIndex, fyFrom, fyFromMonth, fyTo, fyToMonth, selectedRoles,
     selectedBunya, selectedKind, keikMin, heighMin, suisMin, syusMin, horyuMin, keyword, employeeMap, literalMap, includeRetired,
     selectedLicenses, employeeLicMap, verifiedMap, certLinksByEngcd, kanriCertByEngcd]);

  const resetFilters=()=>{
    setFyFrom(currentFY-9); setFyFromMonth("04"); setFyTo(currentFY); setFyToMonth("04");
    setSelectedBunya([]); setSelectedKind([]); setSelectedRoles([]); setSelectedLicenses([]);
    setKeikMin(""); setHeighMin(""); setSuisMin(""); setSyusMin(""); setHoryuMin("");
    setKeyword(""); setSearched(false); setExpanded({});
  };

  if(!authReady){
    return <div className="wrap"><div className="onboard"><p>認証状態を確認中…</p></div></div>;
  }

  if(!role){
    return (
      <div className="wrap">
        <div className="onboard">
          <h2>ログイン</h2>
          <p>メールアドレスとパスワードを入力してください（編集権限／閲覧のみの2種類があります）</p>
          <div style={{textAlign:"left", maxWidth:340, margin:"0 auto"}}>
            <input className="kw-input" type="email" style={{marginBottom:10, width:"100%"}} placeholder="メールアドレス"
              value={loginId} onChange={(e)=>setLoginId(e.target.value)}
              onKeyDown={(e)=>{ if(e.key==="Enter") doLogin(); }}/>
            <input className="kw-input" type="password" style={{marginBottom:14, width:"100%"}} placeholder="パスワード"
              value={loginPw} onChange={(e)=>setLoginPw(e.target.value)}
              onKeyDown={(e)=>{ if(e.key==="Enter") doLogin(); }}/>
            {loginError && <p style={{color:"var(--red)", fontSize:12, margin:"0 0 12px"}}>{loginError}</p>}
            <button className="btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={doLogin} disabled={loginBusy}>
              {loginBusy ? "ログイン中…" : "ログイン"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if(loading){
    return <div className="wrap"><div className="onboard"><p>読み込み中…</p></div></div>;
  }

  /* ---------------- onboarding screen ---------------- */
  if(!requiredLoaded){
    return (
      <div className="wrap">
        <div className="onboard">
          <h2>初期セットアップ</h2>
          <p>工事実績データ・技術者情報・種別情報の3ファイル（社員データ／コードマスタは任意）を読み込んでください。一度読み込めば、次回からはこの画面は表示されず検索画面が直接開きます。<br/>
          以前「バックアップ保存」で書き出した.jsonファイルがあれば、それをドロップするだけで即座に復元できます。</p>
          <Uploader datasets={datasets} onMerged={(next)=>persist(next)} />
          {!hasStorage &&
            <div className="storage-warn">
              <Ic.Warn/> このブラウザ／開き方（file://での直接オープンなど）では自動保存が利用できない可能性があります。読み込み後は右上の「バックアップ保存」でJSONを書き出し、次回はそのファイルを読み込んでください。
            </div>
          }
        </div>
      </div>
    );
  }

  /* ---------------- main search screen ---------------- */
  return (
    <div className="wrap">
      <div className="topbar" style={{padding:0, marginBottom:18}}>
        <div className="brand">
          <div>
            <div className="eyebrow">ENGINEERING RECORDS — CANDIDATE SEARCH</div>
            <h1>新営業工事実績システム２</h1>
          </div>
        </div>
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          {authUser && <span style={{fontSize:11, color:"var(--muted2)"}}>{authUser.email}</span>}
          <span className={"role-pill"+(canEdit?" editor":"")}>{canEdit ? "編集権限" : "閲覧のみ"}</span>
          <button className="link-btn" onClick={exportBackup}><Ic.Download/> バックアップ保存</button>
          {canEdit && <button className="link-btn" onClick={()=>setShowUpdate(true)}><Ic.Refresh/> データ更新</button>}
          <button className="link-btn" onClick={doLogout}><Ic.X size={13}/> ログアウト</button>
        </div>
      </div>

      {!optionalLoaded &&
        <p className="note" style={{marginBottom:14}}>※ 社員データ／コードマスタが未読込のため、氏名や種別名の一部がコード表示になっています。{canEdit ? "「データ更新」から追加できます。" : ""}</p>
      }

      <div className="tabs">
        <button className={"tab-btn"+(activeTab==="search"?" active":"")} onClick={()=>setActiveTab("search")}>配置候補検索</button>
        <button className={"tab-btn"+(activeTab==="detail"?" active":"")} onClick={()=>setActiveTab("detail")}>工事詳細データ</button>
        <button className={"tab-btn"+(activeTab==="personnel"?" active":"")} onClick={()=>setActiveTab("personnel")}>人事資格検索</button>
        {canEdit &&
          <button className={"tab-btn"+(activeTab==="master"?" active":"")} onClick={()=>setActiveTab("master")}>技術者情報メンテナンス</button>
        }
      </div>

      {activeTab==="detail" &&
        <ConstructionDetail
          constrsltRecords={datasets.constrslt.records}
          kindByConst={(()=>{
            const map={};
            (datasets.kind.records||[]).forEach((r)=>{
              if(!map[r.CONSTNO]) map[r.CONSTNO]=[];
              map[r.CONSTNO].push(r);
            });
            return map;
          })()}
          engRecords={datasets.eng.records}
          literalMap={literalMap}
          employeeMap={employeeMap}
          initialConstno={jumpToConstno}
          jumpNonce={jumpNonce}
          canEdit={canEdit}
          onSaveProject={(constno, updated)=>{
            const next={...datasets, constrslt:{
              records: datasets.constrslt.records.map((r)=> r.CONSTNO===constno ? {...r, ...updated, CONSTNO:constno} : r),
              filename: datasets.constrslt.filename,
            }};
            persist(next);
          }}
          onSaveKinds={(constno, newKinds)=>{
            const next={...datasets, kind:{
              records: [...datasets.kind.records.filter((r)=>r.CONSTNO!==constno), ...newKinds],
              filename: datasets.kind.filename,
            }};
            persist(next);
          }}
          onSaveEng={(constno, newEng)=>{
            const next={...datasets, eng:{
              records: [...datasets.eng.records.filter((r)=>r.CONSTNO!==constno), ...newEng],
              filename: datasets.eng.filename,
            }};
            persist(next);
          }}
          onCreateProject={(newProj)=>{
            const next={...datasets, constrslt:{
              records: [...datasets.constrslt.records, newProj],
              filename: datasets.constrslt.filename,
            }};
            persist(next);
          }}
        />
      }

      {activeTab==="personnel" &&
        <PersonnelQualification
          employees={datasets.employee?.records || []}
          enginfoRecords={datasets.enginfo?.records || []}
          licenses={datasets.licenses?.records || []}
          engLicenses={datasets.englicense?.records || []}
          literalMap={literalMap}
          canEdit={canEdit}
          initialEngcd={jumpToEngcd}
          jumpNonce={jumpEngcdNonce}
          onSaveCertLink={(engcd, liccd, url)=>{
            const next={...datasets, englicense:{
              records: datasets.englicense.records.map((r)=> (r.ENGCD===engcd && r.LICCD===liccd) ? {...r, CERT_URL:url} : r),
              filename: datasets.englicense.filename,
            }};
            persist(next);
          }}
          onSaveKanriCert={(engcd, url)=>{
            const existing=datasets.enginfo?.records || [];
            const has=existing.some((r)=>r.ENGCD===engcd);
            const nextRecords = has
              ? existing.map((r)=> r.ENGCD===engcd ? {...r, KANRI_CERT_URL:url} : r)
              : [...existing, {ENGCD:engcd, KANRI_CERT_URL:url}];
            const next={...datasets, enginfo:{records: nextRecords, filename: datasets.enginfo?.filename || "手動編集"}};
            persist(next);
          }}
          onSaveEngInfo={(engcd, draft)=>{
            const existing=datasets.enginfo?.records || [];
            const has=existing.some((r)=>r.ENGCD===engcd);
            const nextRecords = has
              ? existing.map((r)=> r.ENGCD===engcd ? {...r, ...draft, ENGCD:engcd} : r)
              : [...existing, {...draft, ENGCD:engcd}];
            const next={...datasets, enginfo:{records: nextRecords, filename: datasets.enginfo?.filename || "手動編集"}};
            persist(next);
          }}
          onCreateEmployee={(rec)=>{
            const next={...datasets, employee:{
              records: [...(datasets.employee?.records||[]), rec],
              filename: datasets.employee?.filename || "手動編集",
            }};
            persist(next);
          }}
          onSaveLicenseRow={(engcd, originalLiccd, fields)=>{
            const norm=normLicCode(fields.LICCD);
            const existing=datasets.englicense?.records || [];
            let records;
            if(originalLiccd){
              records = existing.map((r)=> (r.ENGCD===engcd && r.LICCD===originalLiccd) ? {...r, ...fields, ENGCD:engcd, LICCD:norm} : r);
            } else {
              records = [...existing, {...fields, ENGCD:engcd, LICCD:norm}];
            }
            persist({...datasets, englicense:{records, filename: datasets.englicense?.filename || "手動編集"}});
          }}
          onDeleteLicenseRow={(engcd, liccd)=>{
            const records=(datasets.englicense?.records||[]).filter((r)=> !(r.ENGCD===engcd && r.LICCD===liccd));
            persist({...datasets, englicense:{records, filename: datasets.englicense?.filename}});
          }}
        />
      }

      {activeTab==="master" && canEdit &&
        <EmployeeMaster
          employees={datasets.employee?.records || []}
          onSave={(records)=>{
            const next={...datasets, employee:{records, filename: datasets.employee?.filename || "手動編集"}};
            persist(next);
          }}
          licenses={datasets.licenses?.records || []}
          engLicenses={datasets.englicense?.records || []}
          onSaveEngLicenses={(records)=>{
            const next={...datasets, englicense:{records, filename: datasets.englicense?.filename || "手動編集"}};
            persist(next);
          }}
        />
      }

      {activeTab==="search" && <React.Fragment>

      {/* search panel */}
      <div className="search-panel">
        <div className="search-header"><Ic.Filter/> 配置候補技術者の検索</div>
        <div className="search-body">

          <div className="field-row pair-row">
            <div className="pair-group-grow top">
              <div className="field-label">年度</div>
              <div className="field-control">
                <div className="yr-inline">
                  <input type="number" value={fyFrom} onChange={(e)=>setFyFrom(parseInt(e.target.value||0,10))}/>
                  <span>年</span>
                  <select value={fyFromMonth} onChange={(e)=>setFyFromMonth(e.target.value)}>
                    {Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")).map((m)=>(
                      <option key={m} value={m}>{parseInt(m,10)}月</option>
                    ))}
                  </select>
                  <span className="yr-era">{eraLabel(fyFrom)}年度</span>
                  <span>〜</span>
                  <input type="number" value={fyTo} onChange={(e)=>setFyTo(parseInt(e.target.value||0,10))}/>
                  <span>年</span>
                  <select value={fyToMonth} onChange={(e)=>setFyToMonth(e.target.value)}>
                    {Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")).map((m)=>(
                      <option key={m} value={m}>{parseInt(m,10)}月</option>
                    ))}
                  </select>
                  <span className="yr-era">{eraLabel(fyTo)}年度</span>
                </div>
                <div className="yr-presets">
                  {[5,10,15].map((n)=>(
                    <button key={n} onClick={()=>{ setFyFrom(currentFY-(n-1)); setFyFromMonth("04"); setFyTo(currentFY); setFyToMonth("04"); }}>直近{n}年度</button>
                  ))}
                </div>
              </div>
            </div>
            <div className="pair-group top">
              <div className="field-label">退職者</div>
              <label className="chk-inline" style={{width:"fit-content"}}>
                <input type="checkbox" checked={includeRetired} onChange={(e)=>setIncludeRetired(e.target.checked)}/>
                <span style={{color:"var(--muted)"}}>退職者も候補に含める</span>
              </label>
            </div>
          </div>

          <div className="field-row pair-row">
            <div className="pair-group-grow">
              <div className="field-label">種別</div>
              <div className="field-control">
                <MultiSelect options={kindOptions} selected={selectedKind} onChange={setSelectedKind} searchable placeholder="選択してください（複数可）"/>
              </div>
            </div>
            <div className="pair-group-grow">
              <div className="field-label">役割</div>
              <div className="field-control">
                <MultiSelect options={roleOptions} selected={selectedRoles} onChange={setSelectedRoles} placeholder="選択してください（複数可）"/>
              </div>
            </div>
          </div>

          <div className="field-row pair-row">
            <div className="pair-group-grow">
              <div className="field-label">所持資格</div>
              <div className="field-control">
                <MultiSelect options={licenseOptions} selected={selectedLicenses} onChange={setSelectedLicenses} searchable placeholder="選択してください（複数可・すべて保有する人が対象）"/>
              </div>
            </div>
            <div className="pair-group-grow" aria-hidden="true" style={{visibility:"hidden"}}>
              <div className="field-label">-</div>
              <div className="field-control"></div>
            </div>
          </div>

          <div className="field-row pair-row">
            <div className="pair-group">
              <div className="field-label">径間以上</div>
              <div className="field-control narrow small"><input type="number" value={keikMin} onChange={(e)=>setKeikMin(e.target.value)} placeholder="0"/></div>
              <div className="field-unit">m</div>
            </div>
            <div className="pair-group">
              <div className="field-label">高さ以上</div>
              <div className="field-control narrow small"><input type="number" value={heighMin} onChange={(e)=>setHeighMin(e.target.value)} placeholder="0"/></div>
              <div className="field-unit">m</div>
            </div>
          </div>

          <div className="field-row pair-row">
            <div className="pair-group">
              <div className="field-label">水深以上</div>
              <div className="field-control narrow small"><input type="number" value={suisMin} onChange={(e)=>setSuisMin(e.target.value)} placeholder="0"/></div>
              <div className="field-unit">m</div>
            </div>
            <div className="pair-group">
              <div className="field-label">取水量以上</div>
              <div className="field-control narrow small"><input type="number" value={syusMin} onChange={(e)=>setSyusMin(e.target.value)} placeholder="0"/></div>
              <div className="field-unit">m³/s</div>
            </div>
            <div className="pair-group">
              <div className="field-label">放流量以上</div>
              <div className="field-control narrow small"><input type="number" value={horyuMin} onChange={(e)=>setHoryuMin(e.target.value)} placeholder="0"/></div>
              <div className="field-unit">m³/s</div>
            </div>
          </div>

          <FieldRow label="工事件名">
            <div className="field-control"><input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="キーワード（任意）例）ダム、水門"/></div>
          </FieldRow>

        </div>
        <div className="actions-row">
          <button className="btn-ghost" onClick={resetFilters}><Ic.Reset/> クリア</button>
          <button className="btn-search" onClick={()=>setSearched(true)}><Ic.Search/> 検索する</button>
        </div>
      </div>

      {/* results */}
      {searched &&
        <div className="card">
          <div className="res-hd">
            <div>
              <h2>配置候補技術者</h2>
              <p className="sub">{results.length}名が該当しました</p>
            </div>
          </div>

          {results.length===0 &&
            <div className="empty">条件に合致する技術者が見つかりませんでした。条件を緩めて再検索してください。</div>
          }

          {results.map((r)=>{
            const isOpen=!!expanded[r.engcd];
            return (
              <div key={r.engcd} className={"eng-item"+(r.hasVerified?" verified":"")+(r.allRejected?" rejected":"")}>
                <div className="eng-hd" role="button" tabIndex={0}
                  onClick={()=>setExpanded((e)=>({...e,[r.engcd]:!e[r.engcd]}))}
                  onKeyDown={(e)=>{ if(e.key==="Enter"||e.key===" ") setExpanded((ex)=>({...ex,[r.engcd]:!ex[r.engcd]})); }}>
                  <div className="left">
                    {isOpen ? <Ic.Down/> : <Ic.Right/>}
                    <button type="button" className="name name-link" onClick={(e)=>{ e.stopPropagation(); goToPersonnel(r.engcd); }}>{r.name}</button>
                    {(r.dept || r.position) &&
                      <span className="code">{[r.dept, r.position].filter(Boolean).join(" ／ ")}</span>
                    }
                    {r.retired && <span className="m-badge retired">退職</span>}
                    {r.hasVerified && <span className="verified-badge"><Ic.Check size={12}/> 確認済み</span>}
                    {r.allRejected && <span className="rejected-badge"><Ic.X size={12}/> 据付実績なし</span>}
                    {r.kanriCertUrl &&
                      <a className="corins-link" href={r.kanriCertUrl} target="_blank" rel="noopener noreferrer"
                        title="監理技術者資格証" onClick={(e)=>e.stopPropagation()}>
                        <Ic.Link size={12}/> 監理技術者資格証
                      </a>
                    }
                    {r.certLinks.map((cl,ci)=>(
                      <a key={ci} className="corins-link" href={cl.url} target="_blank" rel="noopener noreferrer"
                        title={cl.name+"の証明書"} onClick={(e)=>e.stopPropagation()}>
                        <Ic.Link size={12}/> {cl.name}
                      </a>
                    ))}
                  </div>
                  <span style={{display:"flex", alignItems:"center", gap:8}}>
                    {r.bestPoint!==null && <span className="point-badge" title="据付実績「有」の中での最高工事点数"><Ic.Star size={12}/> 最高点 {r.bestPoint}点</span>}
                    <span className="badge-count">該当 {r.entries.length} 件</span>
                  </span>
                </div>
                {isOpen &&
                  <div className="eng-body">
                    {r.entries.map((en,i)=>(
                      <div key={i} className={"entry"+(en.verifyStatus==="ok"?" verified":"")+(en.verifyStatus==="no"?" rejected":"")}>
                        <div className="row1">
                          <div className="row1-left">
                            <div className="verify-toggle" onClick={(e)=>e.stopPropagation()}>
                              <button type="button"
                                className={"vt-btn vt-ok"+(en.verifyStatus==="ok"?" active":"")}
                                title="据付実績あり（実績として認める）"
                                onClick={()=>setVerifyStatus(r.engcd, en.constno, en.posicd, "ok")}>
                                <Ic.Check size={13}/> 有
                              </button>
                              <button type="button"
                                className={"vt-btn vt-no"+(en.verifyStatus==="no"?" active":"")}
                                title="据付実績なし（実績として認めない）"
                                onClick={()=>setVerifyStatus(r.engcd, en.constno, en.posicd, "no")}>
                                <Ic.X size={13}/> 無
                              </button>
                              {en.isAutoVerified && <span className="auto-tag" title="製据区分が「据付/製据」かつ据付期間内100%または専任100%のため自動判定">自動</span>}
                            </div>
                            <button type="button" className="constno-link" onClick={()=>goToConstno(en.constno)}>{en.constno}</button>
                            <span className="pname">{en.name || "(工事名なし)"}</span>
                            <span className="role-badge">{en.role||"役割不明"}</span>
                            {en.isJv && <span className="jv-badge">JV</span>}
                            {en.installPct!==null && (
                              <span className={"install-badge"+(en.installOK?" full":"")} title="従事期間のうち、据付開始日〜工期末と重なっている日数の割合">
                                据付期間内 {en.installPct}%
                              </span>
                            )}
                            {en.point!==undefined && en.point!==null && en.point!=="" &&
                              <span className="score-badge" title="この工事の工事点数">
                                <Ic.Star size={12}/> 工事点数 {en.point}点
                              </span>
                            }
                          </div>
                          <div className="row1-right">
                            {en.corinsUrl &&
                              <a className="corins-link" href={en.corinsUrl} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()}>
                                <Ic.Link size={12}/> コリンズ証明書
                              </a>
                            }
                            {en.ratingPdfUrl &&
                              <a className="corins-link" href={en.ratingPdfUrl} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()}>
                                <Ic.Link size={12}/> 工事評定点PDF
                              </a>
                            }
                            {en.awardPdfUrl &&
                              <a className="corins-link" href={en.awardPdfUrl} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()}>
                                <Ic.Link size={12}/> 工事表彰PDF
                              </a>
                            }
                          </div>
                        </div>
                        <div className="meta">
                          発注者: {en.orderer||"-"} ／ 工期: {fmtDate(en.kokf)} 〜 {fmtDate(en.kokt)}（{eraLabel(en.fy)}年度） ／ 分野: {en.bunya||"-"}
                          {en.ssday && <span> ／ 据付開始日: <b>{fmtDate(en.ssday)}</b></span>}
                        </div>
                        <div className="meta">
                          従事期間: {en.periods.length>0 ? en.periods.map((p,pi)=>(
                            <span key={pi}>{pi>0 && "、"}{fmtDate(p.from)}〜{fmtDate(p.to)}</span>
                          )) : "-"}
                          {" ／ 従事割合: "}
                          {en.jwari!==undefined && en.jwari!==null && en.jwari!=="" ? (
                            parseFloat(en.jwari)>=99.95
                              ? <span className="jwari-full">専任(100%)</span>
                              : <span>{en.jwari}%</span>
                          ) : "-"}
                        </div>
                        {en.kinds.length>0 &&
                          <div className="kinds-list">
                            {en.kinds.map((k,ki)=>(
                              <div key={ki} className="kind-item">
                                <span className="kind-tag">
                                  {k.kbn && <span className="kbn-prefix">{k.kbn}</span>}
                                  {k.name}
                                  {(k.keik||k.heigh||k.suis||k.syus||k.horyu) ?
                                    " ("+[
                                      k.keik && ("径間"+k.keik),
                                      k.heigh && ("高さ"+k.heigh),
                                      k.suis && ("水深"+k.suis),
                                      k.syus && ("取水量"+k.syus),
                                      k.horyu && ("放流量"+k.horyu),
                                    ].filter(Boolean).join(" / ")+")" : ""}
                                </span>
                                {k.gaiyo &&
                                  <span className="kind-gaiyo">
                                    <span className="gaiyo-label">概要</span>
                                    <span className="gaiyo-text">{k.gaiyo}</span>
                                  </span>
                                }
                              </div>
                            ))}
                          </div>
                        }
                      </div>
                    ))}
                  </div>
                }
              </div>
            );
          })}
        </div>
      }

      </React.Fragment>}

      {/* update overlay */}
      {showUpdate &&
        <div className="overlay-bg" onClick={(e)=>{ if(e.target===e.currentTarget) setShowUpdate(false); }}>
          <div className="overlay-card">
            <div className="overlay-hd">
              <h3>データ更新（追加・上書き）</h3>
              <button className="icon-btn" onClick={()=>setShowUpdate(false)}><Ic.X/></button>
            </div>
            <p style={{fontSize:12,color:"var(--muted)",marginTop:0}}>
              新しいCSVを読み込むと、同じ工事番号／コードのデータは上書きされ、新規分は追加されます。
            </p>
            <Uploader datasets={datasets} onMerged={(next)=>persist(next)} />
          </div>
        </div>
      }

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
