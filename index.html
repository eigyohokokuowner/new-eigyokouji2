      if(!includeOfficeTech){
        const emp=employeeMap[engRow.ENGCD];
        if(emp && emp.OFFICE_TECH) return;
      }

      if(ageMinN!==null || ageMaxN!==null){
        const kinfo=enginfoByEngcd[engRow.ENGCD];
        const age=kinfo ? calcAge(kinfo.BDAY, ageAsOf) : null;
        if(age===null) return; // 生年月日が不明な技術者は年齢条件では対象外にする
        if(ageMinN!==null && age<ageMinN) return;
        if(ageMaxN!==null && age>ageMaxN) return;
      }

      if(femaleOnly){
        const emp=employeeMap[engRow.ENGCD];
        if(!emp || emp.GENDER!=="女性") return;
      }

      if(selectedDept.length){
        const emp=employeeMap[engRow.ENGCD];
        const matched=selectedDept.some((cat)=> deptCategoryMatches(emp && emp.DEPT, cat));
        if(!matched) return;
      }

      if(selectedLicenses.length){
        const matched = licenseMode==="and"
          ? selectedLicenses.every((name)=> isQualHeld(engRow.ENGCD, name))
          : selectedLicenses.some((name)=> isQualHeld(engRow.ENGCD, name));
        if(!matched) return;
      }

      if(pointMinN!==null){
        const pt = (proj.POINT===undefined||proj.POINT===null||proj.POINT==="") ? null : parseFloat(proj.POINT);
        if(pt===null || isNaN(pt) || pt<pointMinN) return;
      }

      const fy=fiscalYearOf(proj.KOKT);
      const projYMDigits = normDigits8(proj.KOKT);
      const projYM = projYMDigits ? parseInt(projYMDigits.slice(0,6),10) : null;
      // 年度が未入力（空欄）の側は制限なし。両方空欄なら日付での絞り込みは行わない（＝すべてのデータが対象）。
      const hasFrom = fyFrom!=="" && fyFrom!==null && fyFrom!==undefined && !isNaN(parseInt(fyFrom,10));
      const hasTo = fyTo!=="" && fyTo!==null && fyTo!==undefined && !isNaN(parseInt(fyTo,10));
      const fromYM = hasFrom ? parseInt(fyFrom,10)*100 + parseInt(fyFromMonth||"1",10) : null;
      const toYM = hasTo ? parseInt(fyTo,10)*100 + parseInt(fyToMonth||"12",10) : null;
      if(fromYM!==null || toYM!==null){
        if(projYM===null) return; // 日付フィルタが有効なのに工期(至)が無いものは対象外
        if(fromYM!==null && projYM<fromYM) return;
        if(toYM!==null && projYM>toYM) return;
      }
      if(selectedRoles.length && !selectedRoles.includes(String(parseFloat(engRow.POSICD||"")))) return;
      if(selectedBunya.length && !selectedBunya.includes(String(parseFloat(proj.BUNYA||"")))) return;

      const hasKindFilter = selectedGateCategory.length || selectedGateType.length || selectedGateStructure.length || selectedKaihei.length || keikMinN!==null || heighMinN!==null || areaMinN!==null || suisMinN!==null || syusMinN!==null || horyuMinN!==null;
      const matchingKinds=(proj.kinds||[]).filter((k)=>{
        if(selectedGateCategory.length || selectedGateType.length || selectedGateStructure.length){
          const h=gateHierarchyByCode[String(parseFloat(k.KIND||""))];
          if(!h) return false; // 分類対象外（今回除外）の種別は階層フィルタにヒットさせない
          if(selectedGateCategory.length && !selectedGateCategory.includes(h.category)) return false;
          if(selectedGateType.length && !selectedGateType.includes(h.type)) return false;
          if(selectedGateStructure.length && !selectedGateStructure.includes(h.structure)) return false;
        }
        if(selectedKaihei.length && !selectedKaihei.includes(String(parseFloat(k.KIKA||"")))) return false;
        const num=(v)=> v==="" || v===undefined ? null : parseFloat(v);
        const keik=num(k.KEIK), heigh=num(k.HEIGH), suis=num(k.SUIS), syus=num(k.SYUS), horyu=num(k.HORYU);
        if(keikMinN!==null && (keik===null||keik<keikMinN)) return false;
        if(heighMinN!==null && (heigh===null||heigh<heighMinN)) return false;
        if(areaMinN!==null){
          let area = (keik!==null && heigh!==null) ? keik*heigh : null;
          if(area!==null && areaIncludeSuis){ area = (suis!==null) ? area*suis : null; }
          if(area===null || area<areaMinN) return false;
        }
        if(suisMinN!==null && (suis===null||suis<suisMinN)) return false;
        if(syusMinN!==null && (syus===null||syus<syusMinN)) return false;
        if(horyuMinN!==null && (horyu===null||horyu<horyuMinN)) return false;
        return true;
      });
      if(hasKindFilter && matchingKinds.length===0) return;

      const engcd=engRow.ENGCD;
      if(!byEngineer[engcd]){
        const emp=employeeMap[engcd];
        const kinfo=enginfoByEngcd[engcd];
        const assignList=assignRowsByEngcd[engcd]||[];
        const assignConflicts = hasAssignFilter ? assignList.filter((a)=>{
          const sesu=classifySesu(a.kubun);
          const isDuty=!!categorizeDutyRole(a.role);
          if(dutyOnlyFilter && !((sesu==="据"||sesu==="製据") && isDuty)) return false; // 据付＋監理/主任/管理技術者以外を除外
          const aFrom=normDigits8(a.assignFrom);
          if(!aFrom) return false;
          const aTo=normDigits8(a.assignTo) || aFrom;
          const lo = assignFilterFrom===null ? "00000000" : assignFilterFrom;
          const hi = assignFilterTo===null ? "99999999" : assignFilterTo;
          return aFrom<=hi && aTo>=lo;
        }) : [];
        byEngineer[engcd]={
          engcd,
          name: emp ? emp.ID_NAME : ("(コード:"+engcd+")"),
          dept: emp ? emp.DEPT : "",
          position: emp ? emp.POSITION : "",
          age: kinfo ? calcAge(kinfo.BDAY, ageAsOf) : null,
          retired: !!(emp && emp.STATUS==="retired"),
          assignList,
          assignConflicts,
          assignFilterActive: hasAssignFilter,
          entries:[],
        };
      }
      const periods=[];
      [["KOKF01","KOKT01"],["KOKF02","KOKT02"],["KOKF03","KOKT03"]].forEach(([f,t])=>{
        if(engRow[f]) periods.push({from:engRow[f], to:engRow[t]});
      });
      // 従事期間が「据付開始日〜完工日（未入力なら工期末）」にどれだけ重なっているか（割合%）
      // = 従事期間と据付期間が重なる日数の合計 ÷ 据付期間の日数
      const installEndRaw = proj.KOJDAY ? proj.KOJDAY : proj.KOKT;
      const installPct = computeEngagementPct(periods, proj.SSDAY, installEndRaw);
      const installOK = installPct!==null && installPct>=100;
      // 従事割合（全体）＝ 従事期間が工期全体（proj.KOKF〜proj.KOKT）に対してどれだけの割合を占めるか。
      // 手入力データ（旧JWARI）には頼らず、工期と従事期間から自動計算する。
      const jwariPct = computeEngagementPct(periods, proj.KOKF, proj.KOKT);

      const vkey=engcd+"|"+proj.CONSTNO+"|"+engRow.POSICD;
      const entryKinds=(hasKindFilter?matchingKinds:proj.kinds).map((k)=>({
        name: lookupLit("SHRU", k.KIND), kbn: lookupLit("SESU", k.KBN), keik:k.KEIK, heigh:k.HEIGH, suis:k.SUIS, syus:k.SYUS, horyu:k.HORYU, gaiyo:k.KGAI,
      }));
      // 製据区分が「据付」または「製据」を含み、かつ（据付期間内100% or 従事割合100%＝専任）なら自動で「有」
      // 逆に据付期間内が80%以下なら自動で「無」（80〜100%未満はどちらとも判定せず、人の目で確認）
      const isInstallKbn = entryKinds.some((k)=> k.kbn==="据付" || k.kbn==="製据");
      const jwariFull = jwariPct!==null && jwariPct>=100;
      const schedChecked = parseFloat(proj.SCHED_CHECKED)===1;
      // 実施工程表との整合性が未確認の場合は「据付実績あり」と判定できない（自動・手動とも）。
      // ただし従事割合が100%（専任）の場合のみ、整合性未確認でも「有」と判定できる例外とする。
      const canMarkOk = schedChecked || jwariFull;
      const autoOK = isInstallKbn && (installOK || jwariFull) && canMarkOk;
      const autoNo = !autoOK && installPct!==null && installPct<=80;
      // 据付期間内100%（または専任100%）は、案件条件に関わらず常に「実績」として動かない事実なので、
      // その判定（人による有/無の上書きを含む）は端末をまたいで保存（Firestore）する。
      // 一方、それ以外（80〜100%未満の境界線上）の有/無判定は、検討中の入札案件の技術者条件によって
      // 変わり得る（今回はOKでも次回はNGということがあり得る）ため、保存はせず、
      // このセッション（ページを開いている間）だけ有効な一時的な判断として扱う。
      const autoQualifies = isInstallKbn && (installOK || jwariFull);
      const manualStatusRaw = autoQualifies ? (verifiedMap[vkey] || null) : (sessionVerified[vkey] || null);
      // 条件（整合性確認 or 従事割合100%）を満たさない手動「有」は無効化する
      const manualStatus = (manualStatusRaw==="ok" && !canMarkOk) ? null : manualStatusRaw;
      const effectiveStatus = manualStatus==="no" ? "no" : (manualStatus==="ok" ? "ok" : (autoOK ? "ok" : (autoNo ? "no" : null)));

      byEngineer[engcd].entries.push({
        constno: proj.CONSTNO,
        posicd: engRow.POSICD,
        vkey,
        verifyStatus: effectiveStatus,
        isAutoVerified: manualStatus===null && (autoOK || autoNo),
        autoQualifies,
        installOK,
        installPct,
        point: proj.POINT,
        corinsUrl: proj.CORINS_URL,
        ratingPdfUrl: proj.RATING_PDF_URL,
        awardPdfUrl: proj.AWARD_PDF_URL,
        scheduleUrl: proj.SCHEDULE_URL,
        schedChecked,
        isInstallKbn,
        canMarkOk,
        name: ((proj.NAM1||"")+" "+(proj.NAM2||"")).trim(),
        orderer: proj.KYA1, kokf: proj.KOKF, kokt: proj.KOKT, ssday: proj.SSDAY, fy,
        bunya: lookupLit("BNYA", proj.BUNYA),
        role: lookupLit("TRGT", engRow.POSICD),
        isJv: !!proj.JVNM,
        periods,
        jwari: jwariPct,
        kinds: entryKinds,
      });
    });

    Object.values(byEngineer).forEach((r)=>{
      r.okCount = r.entries.filter((e)=>e.verifyStatus==="ok").length;
      r.noCount = r.entries.filter((e)=>e.verifyStatus==="no").length;
      r.totalCount = r.entries.length;
      r.pendingCount = r.totalCount - r.okCount - r.noCount; // 「有」「無」どちらとも判定されていない件数
      r.hasVerified = r.okCount>0;
      // 保留（未判定）が無く、全件が「有」または「無」で決着している場合のみ確定的に色分けする。
      // 有が1件以上あり、残りも含めて全件が判定済み（保留なし）→ 実績あり（緑）
      // 有が1件以上あるが、まだ判定されていない工事が残っている → 一部確認済み（黄）
      // 有が0件で、全件が明確に「無」と判定されている → 据付実績なし（赤）
      // 有が0件で、保留の工事がある（まだ何も確認できていない）→ 白のまま
      r.allVerified = r.totalCount>0 && r.pendingCount===0 && r.okCount>0;
      r.partialVerified = r.okCount>0 && r.pendingCount>0;
      r.allRejected = r.okCount===0 && r.noCount>0 && r.pendingCount===0;
      const okPoints = r.entries.filter((e)=>e.verifyStatus==="ok" && e.point!==undefined && e.point!=="" && !isNaN(parseFloat(e.point))).map((e)=>parseFloat(e.point));
      r.bestPoint = okPoints.length>0 ? Math.max(...okPoints) : null;
      r.certLinks = certLinksByEngcd[r.engcd] || [];
      r.kanriCertUrl = kanriCertByEngcd[r.engcd] || null;
    });

    return Object.values(byEngineer).sort((a,b)=>b.entries.length-a.entries.length);
  },[requiredLoaded, searched, datasets, projectIndex, fyFrom, fyFromMonth, fyTo, fyToMonth, selectedRoles,
     selectedBunya, selectedGateCategory, selectedGateType, selectedGateStructure, selectedKaihei, gateHierarchyByCode,
     keikMin, heighMin, areaMin, areaIncludeSuis, suisMin, syusMin, horyuMin, pointMin, ageMin, ageMax, ageAsOf, selectedDept,
     assignDateFrom, assignDateTo, dutyOnlyFilter, excludeAwardedDutyOverlap, assignRowsByEngcd, dutyAssignIndex, selectedEngcds,
     employeeMap, literalMap, includeRetired, includeOfficeTech, femaleOnly,
     selectedLicenses, licenseMode, enginfoByEngcd, liccdByNormName, employeeLicMap, verifiedMap, sessionVerified, certLinksByEngcd, kanriCertByEngcd]);

  const sortedResults=useMemo(()=>{
    if(sortMode==="default") return results;
    const list=[...results];
    const cmp={
      age_asc:(a,b)=> (a.age===null?1:0)-(b.age===null?1:0) || (a.age||0)-(b.age||0),
      age_desc:(a,b)=> (a.age===null?1:0)-(b.age===null?1:0) || (b.age||0)-(a.age||0),
      conflict_asc:(a,b)=> a.assignConflicts.length-b.assignConflicts.length,
      conflict_desc:(a,b)=> b.assignConflicts.length-a.assignConflicts.length,
    }[sortMode];
    if(cmp) list.sort(cmp);
    return list;
  },[results, sortMode]);

  const resetFilters=()=>{
    setFyFrom(currentFY-9); setFyFromMonth("04"); setFyTo(currentFY); setFyToMonth("04");
    setSelectedBunya([]); setSelectedGateCategory([]); setSelectedGateType([]); setSelectedGateStructure([]);
    setSelectedKaihei([]);
    setSelectedRoles([]); setSelectedLicenses([]); setLicenseMode("or");
    setAgeMin(""); setAgeMax(""); setAgeAsOf(""); setSelectedDept([]);
    setAssignDateFrom(""); setAssignDateTo(""); setAssignKobanTypeFilter([]); setSelectedEngcds([]);
    setKeikMin(""); setHeighMin(""); setAreaMin(""); setAreaIncludeSuis(false);
    setSuisMin(""); setSyusMin(""); setHoryuMin(""); setPointMin("");
    setSearched(false); setExpanded({});
  };

  if(!authReady){
    return <div className="wrap"><div className="onboard"><p>認証状態を確認中…</p></div></div>;
  }

  if(!role){
    return (
      <div className="wrap">
        <div className="onboard">
          <h2>ログイン</h2>
          <p>メールアドレスとパスワードを入力してください（編集権限／閲覧のみの2種類があります）</p>
          <div style={{textAlign:"left", maxWidth:340, margin:"0 auto"}}>
            <input className="kw-input" type="email" style={{marginBottom:10, width:"100%"}} placeholder="メールアドレス"
              value={loginId} onChange={(e)=>setLoginId(e.target.value)}
              onKeyDown={(e)=>{ if(e.key==="Enter") doLogin(); }}/>
            <input className="kw-input" type="password" style={{marginBottom:14, width:"100%"}} placeholder="パスワード"
              value={loginPw} onChange={(e)=>setLoginPw(e.target.value)}
              onKeyDown={(e)=>{ if(e.key==="Enter") doLogin(); }}/>
            {loginError && <p style={{color:"var(--red)", fontSize:12, margin:"0 0 12px"}}>{loginError}</p>}
            <button className="btn-primary" style={{width:"100%", justifyContent:"center"}} onClick={doLogin} disabled={loginBusy}>
              {loginBusy ? "ログイン中…" : "ログイン"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if(loading){
    return <div className="wrap"><div className="onboard"><p>読み込み中…</p></div></div>;
  }

  /* ---------------- onboarding screen ---------------- */
  if(!requiredLoaded){
    return (
      <div className="wrap">
        <div className="onboard">
          <h2>初期セットアップ</h2>
          <p>工事実績データ・技術者情報・種別情報の3ファイル（社員データ／コードマスタは任意）を読み込んでください。一度読み込めば、次回からはこの画面は表示されず検索画面が直接開きます。<br/>
          以前「バックアップ保存」で書き出した.jsonファイルがあれば、それをドロップするだけで即座に復元できます。</p>
          <Uploader datasets={datasets} onMerged={(next)=>persist(next)} />
          {!hasStorage &&
            <div className="storage-warn">
              <Ic.Warn/> このブラウザ／開き方（file://での直接オープンなど）では自動保存が利用できない可能性があります。読み込み後は右上の「バックアップ保存」でJSONを書き出し、次回はそのファイルを読み込んでください。
            </div>
          }
        </div>
      </div>
    );
  }

  /* ---------------- main search screen ---------------- */
  const renderCandidateRow=(r, inConsiderList)=>{
            const isOpen=!!expanded[r.engcd];
            return (
              <div key={r.engcd} className={"eng-item"+(r.allRejected?" rejected":(r.allVerified?" verified":(r.partialVerified?" partial":"")))}>
                <div className="eng-hd" role="button" tabIndex={0} style={!isOpen ? {borderRadius:11} : undefined}
                  onClick={()=>setExpanded((e)=>({...e,[r.engcd]:!e[r.engcd]}))}
                  onKeyDown={(e)=>{ if(e.key==="Enter"||e.key===" ") setExpanded((ex)=>({...ex,[r.engcd]:!ex[r.engcd]})); }}>
                  <div className="left">
                    {inConsiderList &&
                      <div className="consider-role-compact" onClick={(e)=>e.stopPropagation()}>
                        <select className="tiny-select"
                          value={(considerRole[r.engcd]&&considerRole[r.engcd].kubun)||""}
                          onChange={(e)=>setConsiderRoleField(r.engcd,"kubun",e.target.value)}>
                          <option value="">区分</option>
                          <option value="製作">製作</option>
                          <option value="据付">据付</option>
                          <option value="製据">製据</option>
                        </select>
                        <select className="tiny-select"
                          value={(considerRole[r.engcd]&&considerRole[r.engcd].role)||""}
                          onChange={(e)=>setConsiderRoleField(r.engcd,"role",e.target.value)}>
                          <option value="">役割</option>
                          <option value="監理技術者">監理技術者</option>
                          <option value="主任技術者">主任技術者</option>
                          <option value="担当技術者">担当技術者</option>
                          <option value="管理技術者">管理技術者</option>
                          <option value="現場代理人">現場代理人</option>
                          <option value="システム設計技術者">システム設計技術者</option>
                        </select>
                      </div>
                    }
                    {isOpen ? <Ic.Down/> : <Ic.Right/>}
                    <button type="button" className="name name-link" onClick={(e)=>{ e.stopPropagation(); goToPersonnel(r.engcd); }}>{r.name}</button>
                    {(r.age!==null && r.age!==undefined) || r.dept || r.position ? (
                      <span className="code">
                        {[r.age!==null && r.age!==undefined ? r.age+"歳" : null, r.dept, r.position].filter(Boolean).join(" ／ ")}
                      </span>
                    ) : null}
                    {r.retired && <span className="m-badge retired">退職</span>}
                    {r.allVerified && <span className="verified-badge"><Ic.Check size={12}/> 確認済み（{r.okCount}/{r.totalCount}）</span>}
                    {r.partialVerified && <span className="partial-badge"><Ic.Check size={12}/> 一部確認済み（{r.okCount}/{r.totalCount}）</span>}
                    {r.allRejected && <span className="rejected-badge"><Ic.X size={12}/> 据付実績なし</span>}
                    {r.assignFilterActive && (
                      r.assignConflicts.length>0
                        ? <span className="sched-badge-hover-wrap" onClick={(e)=>e.stopPropagation()}>
                            <span className="sched-badge warn">配置予定と重複（{r.assignConflicts.length}件）</span>
                            <div className="assign-conflict-popover">
                              <div className="assign-conflict-hd">配置予定と重複している配置（{r.assignConflicts.length}件）</div>
                              {r.assignConflicts.map((a,ai)=>{
                                const category=categorizeDutyRole(a.role);
                                const isAwardedDutyOverlap = a.kobanType==="工番" && (classifySesu(a.kubun)==="据"||classifySesu(a.kubun)==="製据") && !!category;
                                const dupCount = category ? countDutyOverlap(a.koban, category, a.assignFrom, a.assignTo) : 1;
                                return (
                                  <div key={ai} className="assign-conflict-row">
                                    {dupCount>=2 &&
                                      <span className="assign-conflict-dup" title={"自分を含めて同じ工事・同じ時期・同じ役割で"+dupCount+"人が配置予定になっています"}>
                                        {circledNum(dupCount)}
                                      </span>
                                    }
                                    <span className="assign-conflict-kbn">{(a.kubun||"-")}/{(a.role||"-")}</span>
                                    <span className="assign-conflict-koban">{a.koban}</span>
                                    <span className={"assign-conflict-name"+(isAwardedDutyOverlap?" strong":"")}>{a.name}</span>
                                    <span className="assign-conflict-meta">（{a.kobanType||"-"}） {fmtDate(a.assignFrom)}〜{fmtDate(a.assignTo)}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </span>
                        : <span className="sched-badge ok">指定期間は配置予定なし</span>
                    )}
                    {r.kanriCertUrl &&
                      <a className="corins-link" href={r.kanriCertUrl} target="_blank" rel="noopener noreferrer"
                        title="監理技術者資格証" onClick={(e)=>e.stopPropagation()}>
                        <Ic.Link size={12}/> 監技証
                      </a>
                    }
                    {r.certLinks.map((cl,ci)=>(
                      <a key={ci} className="corins-link" href={cl.url} target="_blank" rel="noopener noreferrer"
                        title={cl.name+"の証明書"} onClick={(e)=>e.stopPropagation()}>
                        <Ic.Link size={12}/> {abbreviateLicenseName(cl.name)}
                      </a>
                    ))}
                  </div>
                  <span style={{display:"flex", alignItems:"center", gap:8, flexShrink:0, whiteSpace:"nowrap"}}>
                    {r.bestPoint!==null && <span className="point-badge" title="据付実績「有」の中での最高工事点数">最高点 {r.bestPoint}点</span>}
                    <span className="badge-count">該当 {r.entries.length} 件</span>
                    <button type="button" className="consider-badge-btn"
                      style={isInConsiderList(r.engcd) ? {background:"var(--green-soft)", borderColor:"var(--green)", color:"var(--green)"} : undefined}
                      onClick={(e)=>{ e.stopPropagation(); toggleConsiderList(r); }}>
                      {isInConsiderList(r.engcd) ? <React.Fragment><Ic.Check size={11}/> 検討中</React.Fragment> : "検討リストに追加"}
                    </button>
                  </span>
                </div>
                {isOpen &&
                  <div className="eng-body">
                    {r.entries.map((en,i)=>(
                      <div key={i} className={"entry"+(en.verifyStatus==="ok"?" verified":"")+(en.verifyStatus==="no"?" rejected":"")}>
                        <div className="row1">
                          <div className="row1-left">
                            <div className="verify-toggle" onClick={(e)=>e.stopPropagation()}>
                              <button type="button"
                                className={"vt-btn vt-ok"+(en.verifyStatus==="ok"?" active":"")}
                                title={en.canMarkOk ? (en.autoQualifies ? "据付実績あり（実績として認める）" : "据付実績あり（今回の検索セッションのみ有効・保存されません）") : "実施工程表との整合性が未確認のため選択できません（従事割合100%の場合を除く）"}
                                disabled={!en.canMarkOk}
                                onClick={()=>{ if(en.canMarkOk) setVerifyStatus(r.engcd, en.constno, en.posicd, "ok", en.autoQualifies); }}>
                                <Ic.Check size={13}/> 有
                              </button>
                              <button type="button"
                                className={"vt-btn vt-no"+(en.verifyStatus==="no"?" active":"")}
                                title={en.autoQualifies ? "据付実績なし（実績として認めない）" : "据付実績なし（今回の検索セッションのみ有効・保存されません）"}
                                onClick={()=>setVerifyStatus(r.engcd, en.constno, en.posicd, "no", en.autoQualifies)}>
                                <Ic.X size={13}/> 無
                              </button>
                              {en.isAutoVerified && <span className="auto-tag" title="製据区分が「据付/製据」かつ据付期間内100%または専任100%のため自動判定">自動</span>}
                              {!en.autoQualifies && en.verifyStatus &&
                                <span className="session-tag" title="据付期間内が100%未満の境界線上のため、この有/無判定は保存されず、次にページを開いたときは未判定に戻ります">一時判定</span>
                              }
                            </div>
                            <button type="button" className="constno-link" onClick={()=>goToConstno(en.constno)}>{en.constno}</button>

              <div className="field-label">技術者</div>
              <div className="field-control">
                <MultiSelect options={employeeOptions} selected={selectedEngcds} onChange={setSelectedEngcds} searchable placeholder="氏名で検索して選択してください（複数可・未選択＝全員対象）"/>
              </div>
            </div>
            <div className="pair-group">
              <div className="field-label">営業所専任技術者</div>
              <label className="chk-inline" style={{width:"fit-content"}}>
                <input type="checkbox" checked={includeOfficeTech} onChange={(e)=>setIncludeOfficeTech(e.target.checked)}/>
                <span style={{color:"var(--muted)"}}>配置候補技術者に含める</span>
              </label>
            </div>
          </div>

        </div>
        <div className="actions-row">
          <button className="btn-ghost" onClick={resetFilters}><Ic.Reset/> クリア</button>
          <button className="btn-search" onClick={()=>setSearched(true)}><Ic.Search/> 検索する</button>
        </div>
      </div>

      {/* results */}
      {searched &&
        <div className="card">
          <div className="res-hd">
            <div>
              <div style={{display:"flex", alignItems:"center", gap:14, flexWrap:"wrap"}}>
                <h2>{showConsiderList ? "配置検討リスト" : "配置候補技術者"}</h2>
                {!showConsiderList &&
                  <label className="chk-inline" style={{width:"fit-content"}}
                    title="工番（受注済み）の据付案件で、監理・主任・管理技術者として配置予定期間と重複している技術者を除外します。ただし、その工事・その役割にすでに複数人登録されている（重複登録がある）場合は対象外＝除外しません（役割が自分1人だけの場合のみ除外）">
                    <input type="checkbox" checked={excludeAwardedDutyOverlap} onChange={(e)=>setExcludeAwardedDutyOverlap(e.target.checked)}/>
                    <span style={{color:"var(--muted)", fontWeight:500, fontSize:12.5}}>受注工事で専任配置が重複する技術者を除く</span>
                  </label>
                }
              </div>
              <p className="sub">{showConsiderList ? considerList.length+"名を検討中です"+(currentListTitle?"　（保存名：「"+currentListTitle+"」）":"") : results.length+"名が該当しました"}</p>
            </div>
            <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
              {!showConsiderList &&
                <select className="dt-select" style={{width:"auto"}} value={sortMode} onChange={(e)=>setSortMode(e.target.value)}>
                  <option value="default">並び替え：既定（該当件数順）</option>
                  <option value="age_asc">年齢が若い順</option>
                  <option value="age_desc">年齢が高い順</option>
                  <option value="conflict_asc">配置予定と重複が少ない順</option>
                  <option value="conflict_desc">配置予定と重複が多い順</option>
                </select>
              }
              {showConsiderList &&
                <React.Fragment>
                  <button className="btn-outline" onClick={openLoadDialog}>保存済みのリストを開く</button>
                  <button className="btn-outline" onClick={openSaveDialog} disabled={considerList.length===0}>
                    {currentListTitle ? "上書き保存" : "名前を付けて保存"}
                  </button>
                </React.Fragment>
              }
              <button className="btn-outline" onClick={()=>setShowConsiderList(!showConsiderList)}>
                {showConsiderList ? "← 検索結果に戻る" : "配置検討リストを見る（"+considerList.length+"名）"}
              </button>
            </div>
          </div>

          {showConsiderList ? (
            <React.Fragment>
              {considerList.length===0 &&
                <div className="empty">配置検討リストはまだ空です。候補カードの「検討リストに追加」から追加してください。</div>
              }
              {considerList.map((r)=>renderCandidateRow(r, true))}
            </React.Fragment>
          ) : (
            <React.Fragment>
              {results.length===0 &&
                <div className="empty">条件に合致する技術者が見つかりませんでした。条件を緩めて再検索してください。</div>
              }
              {sortedResults.map((r)=>renderCandidateRow(r, false))}
            </React.Fragment>
          )}
        </div>
      }

      </React.Fragment>}

      {/* 配置検討リスト：名前を付けて保存 */}
      {showSaveDialog &&
        <div className="overlay-bg" onClick={(e)=>{ if(e.target===e.currentTarget && !savingList) setShowSaveDialog(false); }}>
          <div className="overlay-card" style={{maxWidth:440}}>
            <div className="overlay-hd">
              <h3>配置検討リストを保存</h3>
              <button className="icon-btn" onClick={()=>setShowSaveDialog(false)} disabled={savingList}><Ic.X/></button>
            </div>
            <p style={{fontSize:12,color:"var(--muted)",marginTop:0}}>
              工事名・案件名などで名前を付けて保存します。同じ名前で保存すると上書きされます。上長など他の方も、このアプリの「保存済みのリストを開く」から同じ内容を開けます。
            </p>
            <input type="text" className="kw-input" style={{marginBottom:14}} placeholder="例：利根川河口堰_配置検討"
              value={saveTitleInput} onChange={(e)=>setSaveTitleInput(e.target.value)} autoFocus/>
            <div className="actions-row">
              <button className="btn-ghost" onClick={()=>setShowSaveDialog(false)} disabled={savingList}>キャンセル</button>
              <button className="btn-search" onClick={doSaveConsiderList} disabled={savingList || !saveTitleInput.trim()}>
                {savingList ? "保存中…" : "保存する"}
              </button>
            </div>
          </div>
        </div>
      }

      {/* 配置検討リスト：保存済みのリストを開く */}
      {showLoadDialog &&
        <div className="overlay-bg" onClick={(e)=>{ if(e.target===e.currentTarget) setShowLoadDialog(false); }}>
          <div className="overlay-card" style={{maxWidth:560}}>
            <div className="overlay-hd">
              <h3>保存済みの配置検討リスト</h3>
              <button className="icon-btn" onClick={()=>setShowLoadDialog(false)}><Ic.X/></button>
            </div>
            {loadingLists ? (
              <p style={{fontSize:12.5,color:"var(--muted)"}}>読み込み中…</p>
            ) : (savedListsIndex && savedListsIndex.length===0) ? (
              <div className="empty">保存済みのリストはまだありません。</div>
            ) : (
              <div style={{display:"flex", flexDirection:"column", gap:8, maxHeight:420, overflowY:"auto"}}>
                {(savedListsIndex||[]).map((it)=>(
                  <button key={it.id} className="saved-list-item" onClick={()=>doLoadConsiderList(it.id)} disabled={loadingListId!==null}>
                    <span className="saved-list-title">{it.title}</span>
                    <span className="saved-list-meta">
                      {it.updatedAt ? new Date(it.updatedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "-"}
                      　更新・{it.count}名
                    </span>
                    {loadingListId===it.id && <span className="saved-list-loading">開いています…</span>}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      }

      {/* update overlay */}
      {showUpdate &&
        <div className="overlay-bg" onClick={(e)=>{ if(e.target===e.currentTarget) setShowUpdate(false); }}>
          <div className="overlay-card">
            <div className="overlay-hd">
              <h3>データ更新（追加・上書き）</h3>
              <button className="icon-btn" onClick={()=>setShowUpdate(false)}><Ic.X/></button>
            </div>
            <p style={{fontSize:12,color:"var(--muted)",marginTop:0}}>
              新しいCSVを読み込むと、同じ工事番号／コードのデータは上書きされ、新規分は追加されます。
            </p>
            <Uploader datasets={datasets} onMerged={(next)=>persist(next)} />
          </div>
        </div>
      }

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
