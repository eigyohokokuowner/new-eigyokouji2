    projectId: "new-eigyokouji2",
    storageBucket: "new-eigyokouji2.firebasestorage.app",

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FB;
    --panel:#FFFFFF; --panel-raised:#F6F7FB; --panel-sunk:#F1F3F9;
    --line:#C7CEE0; --line-soft:#E4E8F2;
    --ink:#12142B; --muted:#5B5F82; --muted2:#7A7E9E; --faint:#A6A9C7;
    --accent:#4F46E5; --accent2:#06B6D4; --accent-soft:rgba(79,70,229,.08);
    --cyan:#0E7490; --cyan-soft:rgba(14,116,144,.08);
    --green:#059669; --green-soft:rgba(5,150,105,.09);
    --red:#DC2626; --red-soft:rgba(220,38,38,.08);
    --amber:#B45309; --amber-soft:rgba(180,83,9,.09);
    /* legacy aliases kept so existing rules below don't need renaming */
    --paper:var(--panel-sunk); --paper-deep:var(--panel-raised);
    --navy:#12142B; --navy-deep:#0A0B1A; --blue:var(--cyan); --lchip:var(--cyan-soft);
    --orange:var(--accent);
    --grad:linear-gradient(135deg, #4F46E5, #06B6D4);
    --shadow-sm:0 1px 2px rgba(18,20,43,.05), 0 1px 3px rgba(18,20,43,.04);
    --shadow-md:0 2px 4px rgba(18,20,43,.04), 0 8px 20px rgba(18,20,43,.06);
    --shadow-lg:0 4px 8px rgba(18,20,43,.04), 0 16px 40px rgba(18,20,43,.08);
    --glow:var(--shadow-md);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --display:'Zen Kaku Gothic New', "Hiragino Kaku Gothic ProN", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% -12%, rgba(6,182,212,.10), transparent 62%),
      radial-gradient(760px 460px at -8% 8%, rgba(79,70,229,.10), transparent 60%);
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  input,button,select{font-family:inherit;}
  input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px;}
  ::selection{background:var(--accent-soft); color:var(--ink);}
  .topbar{display:flex;align-items:center;justify-content:space-between;max-width:1360px;margin:0 auto;
    padding:28px 20px 20px;border-bottom:1px solid var(--line-soft);}
  .brand{display:flex;align-items:center;gap:14px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted2);
    text-transform:uppercase;margin-bottom:6px;}
  .brand h1{font-family:var(--display);font-size:23px;font-weight:900;margin:0;letter-spacing:.01em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .link-btn{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:6px;padding:9px 14px;}
  .link-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .role-pill{font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;
    background:var(--panel-raised);color:var(--muted);border:1px solid var(--line);}
  .role-pill.editor{background:var(--accent-soft);color:var(--accent);border-color:rgba(79,70,229,.25);}
  .wrap{max-width:1360px;margin:0 auto;padding:20px 20px 70px;}

  /* ---- onboarding (initial setup) ---- */
  .onboard{max-width:640px;margin:60px auto;text-align:center;}
  .onboard h2{font-family:var(--display);font-size:22px;font-weight:900;margin:18px 0 6px;}
  .onboard p{font-size:13px;color:var(--muted);margin:0 0 26px;}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:36px 20px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;transition:.15s;text-align:center;background:var(--panel);}
  .drop.over{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft);}
  .drop p{font-size:13px;margin:8px 0 0;color:var(--ink);}
  .status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px;text-align:left;}
  @media(min-width:600px){.status-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
  .status-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;background:var(--panel-raised);overflow:hidden;}
  .status-card svg{flex-shrink:0;}
  .status-card.on{border-color:var(--green);background:var(--green-soft);}
  .status-card .t{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-card .n{font-family:var(--mono);font-size:10px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .err-box{margin-top:14px;font-size:12px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;
    display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid rgba(192,57,43,.25);}
  .note{font-size:11px;color:var(--amber);margin-top:12px;text-align:left;}
  .storage-warn{font-size:11px;color:var(--amber);background:var(--amber-soft);border:1px solid rgba(255,182,72,.3);
    border-radius:8px;padding:8px 12px;margin-top:14px;text-align:left;}
  .btn-primary{display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:13px;
    font-weight:800;background:var(--grad);color:#fff;border:none;cursor:pointer;
    box-shadow:0 6px 20px rgba(79,70,229,.30);}
  .btn-outline{display:flex;align-items:center;gap:6px;font-size:12px;padding:7px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-raised);color:var(--cyan);cursor:pointer;}
  .center-row{display:flex;justify-content:center;margin-top:22px;}

  /* ---- update overlay ---- */
  .overlay-bg{position:fixed;inset:0;background:rgba(4,7,10,.72);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
  .overlay-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:26px;}
  .overlay-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .overlay-hd h3{font-family:var(--display);font-size:16px;font-weight:900;margin:0;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);}
  .saved-list-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-raised);cursor:pointer;position:relative;}
  .saved-list-item:hover{border-color:#AAB4CC;background:var(--panel);}
  .saved-list-item:disabled{opacity:.6;cursor:default;}
  .saved-list-title{font-weight:800;font-size:13px;color:var(--ink);}
  .saved-list-meta{font-size:11px;color:var(--muted2);}
  .saved-list-loading{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--accent);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-raised);
    border:1px solid var(--line);color:var(--ink);
    padding:10px 18px;border-radius:999px;font-size:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}

  /* ---- search panel ---- */
  .search-panel{position:relative;border-radius:16px;border:1px solid var(--line);overflow:visible;
    background:var(--panel);margin-bottom:22px;box-shadow:var(--shadow-md);}
  .search-panel::before{content:"";display:block;height:3px;border-radius:16px 16px 0 0;
    background:var(--grad);}
  .search-header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:10px;
    font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:.01em;
    border-bottom:1px solid var(--line-soft);}
  .search-header svg{color:var(--accent2);}
  .search-body{padding:6px 24px 22px;}
  .field-row{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .field-row:last-of-type{border-bottom:none;}
  .field-row.wrap-row{align-items:flex-start;}
  .field-label{flex:0 0 140px;background:var(--panel-raised);color:var(--ink);font-size:12.5px;font-weight:700;
    letter-spacing:.01em;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    border-left:3px solid var(--accent2);text-align:left;}
  .field-op{flex:0 0 auto;font-size:14px;color:var(--muted);}
  .field-control{flex:1;min-width:0;}
  .field-control.narrow{flex:0 1 360px;max-width:360px;}
  .field-control.narrow.small{flex:0 1 130px;max-width:130px;}
  .pair-row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .pair-group{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .pair-group-grow{display:flex;align-items:center;gap:18px;flex:1 1 0;min-width:280px;}
  .pair-group-grow.top{align-items:flex-start;}
  .pair-group.top{align-items:flex-start;}
  .field-control.half{flex:0 1 50%;max-width:620px;}
  .field-control input[type=text],.field-control input[type=number]{width:100%;border:1.5px solid var(--line);
    background:var(--panel-sunk);color:var(--ink);
    border-radius:9px;padding:10px 13px;font-size:13px;font-family:inherit;
    transition:border-color .15s, box-shadow .15s, background-color .15s;}
  .field-control input::placeholder{color:var(--muted2);}
  .field-control input:hover{border-color:#AAB4CC;}
  .field-control input:focus,.msel-btn:focus,.msel-search input:focus{outline:none;border-color:var(--accent);
    background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft);}
  .field-unit{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted2);width:52px;}
  .yr-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .yr-inline input{width:92px !important;font-family:var(--mono);background:var(--panel-sunk);color:var(--ink);
    border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:13px;
    transition:border-color .15s, box-shadow .15s, background-color .15s;}
  .yr-inline input:hover{border-color:#AAB4CC;}
  .yr-inline input:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft);}
  .yr-inline select{font-family:inherit;background:var(--panel-sunk);color:var(--ink);
    border:1.5px solid var(--line);border-radius:9px;padding:10px 8px;font-size:13px;cursor:pointer;}
  .yr-inline select:hover{border-color:#AAB4CC;}
  .yr-inline select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .yr-era{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .yr-presets{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .yr-presets button{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s;}
  .yr-presets button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .chk-inline{display:flex;align-items:center;gap:10px;font-size:12.5px;background:var(--panel-sunk);
    border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;}

  /* multi-select dropdown */
  .msel{position:relative;}
  .msel-btn{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;
    font-size:13px;background:var(--panel-sunk);cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    color:var(--ink);transition:border-color .15s, box-shadow .15s, background-color .15s;}
  .msel-btn:hover{border-color:#AAB4CC;}
  .msel-btn.placeholder{color:var(--faint);}
  .msel-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;max-height:340px;display:flex;
    flex-direction:column;overflow:hidden;}
  .msel-search{padding:9px;border-bottom:1px solid var(--line-soft);}
  .msel-search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:8px;padding:7px 11px;font-size:12.5px;}
  .msel-list{overflow-y:auto;padding:6px;}
  .msel-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;
    cursor:pointer;color:var(--ink);}
  .msel-opt:hover{background:var(--accent-soft);}
  .msel-opt-personnel{display:flex;flex-direction:column;gap:2px;padding:8px 9px;border-radius:8px;
    font-size:12.5px;cursor:pointer;color:var(--ink);}
  .msel-opt-personnel:hover{background:var(--accent-soft);}
  .msel-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .msel-tag{font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:4px 10px;
    border-radius:999px;display:flex;align-items:center;gap:5px;border:1px solid rgba(79,70,229,.18);}
  .msel-tag button{background:none;border:none;cursor:pointer;color:var(--accent);font-size:11px;line-height:1;
    padding:0;opacity:.7;}
  .msel-tag button:hover{opacity:1;}

  .actions-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:4px 24px 22px;}
  .btn-ghost{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:12.5px;
    font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    transition:.15s;}
  .btn-ghost:hover{color:var(--ink);border-color:#CDD3E3;background:var(--panel-raised);}
  .btn-search{display:flex;align-items:center;gap:8px;padding:11px 26px;border-radius:10px;font-size:13px;
    font-weight:800;background:var(--grad);color:#fff;border:none;cursor:pointer;
    box-shadow:0 4px 14px rgba(79,70,229,.28);transition:.15s;}
  .btn-search:hover{filter:brightness(1.06);box-shadow:0 6px 20px rgba(79,70,229,.36);}

  /* ---- results ---- */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;
    box-shadow:var(--shadow-md);}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;
    background:var(--grad);}
  .res-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .res-hd h2{font-family:var(--display);font-size:17px;font-weight:900;margin:0;}
  .res-hd .sub{font-size:12.5px;color:var(--muted);margin:5px 0 0;}
  .empty{text-align:center;padding:40px 0;font-size:13px;color:var(--faint);}
  .eng-item{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:visible;background:var(--panel);
    transition:border-color .15s, box-shadow .15s;}
  .eng-item:hover{border-color:#CDD3E3;box-shadow:var(--shadow-sm);}
  .eng-hd{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;border-radius:11px 11px 0 0;}
  .eng-hd:hover{background:var(--panel-raised);}
  .eng-hd .left{display:flex;align-items:center;flex-wrap:wrap;gap:7px;row-gap:7px;}
  .eng-hd .name{font-weight:800;font-size:13.5px;color:var(--ink);}
  .name-link{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;text-decoration:none;}
  .name-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .eng-hd .code{font-size:11px;color:var(--muted2);white-space:nowrap;}
  .badge-count{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(79,70,229,.18);}
  .consider-badge-btn{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer;
    background:var(--panel-raised);color:var(--muted);border:1px solid var(--line);}
  .consider-badge-btn:hover{background:var(--panel);}
  .eng-body{border-top:1px solid var(--line-soft);padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-radius:0 0 11px 11px;}
  .consider-role-compact{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;}
  .tiny-select{font-size:11px;font-weight:800;padding:2px 3px;border-radius:5px;border:1px solid var(--line);
    background:var(--green-soft);color:var(--ink);width:108px;height:21px;line-height:1;}
  .sched-badge-hover-wrap{position:relative;display:inline-flex;}
  .assign-conflict-popover{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:440px;max-width:625px;
    background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);
    padding:10px 12px;flex-direction:column;gap:6px;cursor:default;}
  .sched-badge-hover-wrap:hover .assign-conflict-popover{display:flex;}
  .assign-conflict-hd{font-size:11.5px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line-soft);padding-bottom:6px;margin-bottom:2px;}
  .assign-conflict-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .assign-conflict-dup{font-weight:900;color:var(--red);font-size:13px;}
  .assign-conflict-kbn{font-weight:700;color:var(--ink);}
  .assign-conflict-koban{font-family:var(--mono);color:var(--accent);}
  .assign-conflict-name{color:var(--ink);}
  .assign-conflict-name.strong{font-weight:800;color:var(--red);}
  .assign-conflict-meta{color:var(--muted2);font-size:11px;}
  .entry{font-size:12px;border-radius:11px;padding:12px 14px;background:var(--panel-raised);border:1px solid var(--line-soft);}
  .entry .row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .row1-left{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .row1-right{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto;}
  .entry .constno{font-family:var(--mono);font-size:10.5px;color:var(--accent);}
  .eng-item.verified{background:#EAF7EE;border-color:#BEE3C6;}
  .eng-item.verified .eng-hd:hover{background:#DFF2E4;}
  .eng-item.partial{background:#FFF9E6;border-color:#F3E2A0;}
  .eng-item.partial .eng-hd:hover{background:#FFF3CC;}
  .eng-item.rejected{background:#FBEEEE;border-color:#EFC7C7;}
  .eng-item.rejected .eng-hd:hover{background:#F7E4E4;}
  .verified-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;line-height:1.3;

    const yNum = m[2]==="元" ? 1 : parseInt(m[2],10);
    const year=base+yNum, month=parseInt(m[3],10), day=parseInt(m[4],10);
    if(month<1||month>12||day<1||day>31) return null;
    return String(year).padStart(4,"0")+String(month).padStart(2,"0")+String(day).padStart(2,"0");
  }
  // 元号アルファベット + 区切りなし6桁（例: R080710 = 令和8年7月10日）
  m=s.match(/^([RHSTMrhstm])(\d{2})(\d{2})(\d{2})$/);
  if(m){
    const base=ERA_BASE_YEAR[m[1].toUpperCase()];
    if(base===undefined) return null;
    const year=base+parseInt(m[2],10), month=parseInt(m[3],10), day=parseInt(m[4],10);
    if(month<1||month>12||day<1||day>31) return null;
    return String(year).padStart(4,"0")+String(month).padStart(2,"0")+String(day).padStart(2,"0");
  }
  return null;
}
function ymdToDate(s){
  const str=String(s);
  return new Date(parseInt(str.slice(0,4),10), parseInt(str.slice(4,6),10)-1, parseInt(str.slice(6,8),10));
}
// 期間[aFrom,aTo]と[bFrom,bTo]が重なる日数（両端を含む日数）を返す。重ならなければ0。
function overlapDays(aFrom, aTo, bFrom, bTo){
  const nAFrom=normDigits8(aFrom), nATo=normDigits8(aTo), nBFrom=normDigits8(bFrom), nBTo=normDigits8(bTo);
  if(![nAFrom,nATo,nBFrom,nBTo].every(Boolean)) return 0;
  const start = nAFrom > nBFrom ? nAFrom : nBFrom;
  const end = nATo < nBTo ? nATo : nBTo;
  if(start > end) return 0;
  const ms = ymdToDate(end) - ymdToDate(start);
  return Math.round(ms/86400000) + 1;
}
function totalDays(from, to){
  const nFrom=normDigits8(from), nTo=normDigits8(to);
  if(!nFrom || !nTo || nFrom>nTo) return 0;
  return Math.round((ymdToDate(nTo)-ymdToDate(nFrom))/86400000) + 1;
}
// 技術者の従事期間（最大3期間）が、工期全体（from〜to）に対してどれだけの割合を占めるか（％）を自動計算する
function computeEngagementPct(periods, from, to){
  const nFrom=normDigits8(from), nTo=normDigits8(to);
  if(!nFrom || !nTo || nFrom>nTo) return null;
  const totalLen=totalDays(nFrom, nTo);
  if(totalLen<=0) return null;
  const validPeriods=(periods||[]).filter((p)=>p.from);
  if(validPeriods.length===0) return null;
  const sum=validPeriods.reduce((s,p)=> s + overlapDays(p.from, p.to, nFrom, nTo), 0);
  return Math.min(100, Math.round((sum/totalLen)*1000)/10);
}

// 配置データの「工番・案件」列を、工番（受注済み）か案件（未受注・将来案件）かに識別する。
// "H"で始まるもの、および"84149A-1"のような「5桁数字＋アルファベット1文字＋ハイフン＋数字」形式は未受注の案件。
// それ以外（"66G-0044"のような工番形式含む）は受注済みの工番として扱う。
function classifyKouban(koban){
  const s=String(koban||"").trim();
  if(!s) return "不明";
  if(/^H/i.test(s)) return "案件";
  if(/^\d{5}[A-Za-z]-\d+$/.test(s)) return "案件";
  return "工番";
}
// 「案件区分」列（製作／据付／製据 など）から、一覧の先頭に出す短縮バッジ表記を判定する。
function classifySesu(kubun){
  const s=String(kubun||"").trim();
  if(!s) return null;
  const hasSei=s.includes("製作")||s.includes("製");
  const hasSetsu=s.includes("据付")||s.includes("据");
  if(hasSei && hasSetsu) return "製据";
  if(hasSetsu) return "据";
  if(hasSei) return "製";
  return null;
}
// 製・据・製据バッジの色（製＝青、据＝緑、製据＝アンバー）
function sesuColor(sesu){
  if(sesu==="製") return {bg:"var(--accent-soft)", fg:"var(--accent)"};
  if(sesu==="据") return {bg:"var(--green-soft)", fg:"var(--green)"};
  if(sesu==="製据") return {bg:"var(--amber-soft)", fg:"var(--amber)"};
  return null;
}
// 役割テキストから「監理技術者・主任技術者・管理技術者」のいずれかを判定する（据付の専任重複チェック用）。
// 「監理」と「管理」は別の役職として区別する。該当しない役割（担当・現場代理人など）はnull。
function categorizeDutyRole(roleText){
  const s=String(roleText||"").trim();
  if(!s) return null;
  if(s.includes("監理")) return "監理技術者";
  if(s.includes("主任")) return "主任技術者";
  if(s.includes("管理")) return "管理技術者";
  return null;
}
// 「配置一覧(工事別)」の並び順を決めるためのキーを工番・案件番号から求める。
// ルール：
//   ・「○○G-1○○○」→「○○G-2○○○」→「○○G-3○○○」…の順（ハイフン直後の数字＝グループ）。
//   ・「H1○○○○○○」は「○○G-1○○○」と同じグループ、「H2○○○○○○」は「○○G-2○○○」と同じグループ…
//     （Hの直後の数字＝グループ）。同じグループ内では、○○G-#○○○を先に、H#○○○○○○をその後に表記する。
//   ・○○G-#○○○同士は、先頭の「○○G」の数字が若い順に並べる。
function kobanSortKey(koban){
  const s=String(koban||"").trim();
  let m=s.match(/^(\d+)G-(\d)(\d*)/i);
  if(m) return {group:parseInt(m[2],10), typeOrder:0, prefix:parseInt(m[1],10), rest:parseInt(m[3]||"0",10), raw:s};
  m=s.match(/^H(\d)(\d*)/i);
  if(m) return {group:parseInt(m[1],10), typeOrder:1, prefix:0, rest:parseInt(m[2]||"0",10), raw:s};
  return {group:99, typeOrder:2, prefix:0, rest:0, raw:s};
}
// 同じ工番・案件番号内では「製」を「据」より先に表示する（製据区分での並び）。
const SESU_ORDER={"製":0, "据":1, "製据":2};
function compareKoban(aKoban, aKubun, bKoban, bKubun){
  const ka=kobanSortKey(aKoban), kb=kobanSortKey(bKoban);
  if(ka.group!==kb.group) return ka.group-kb.group;
  if(ka.typeOrder!==kb.typeOrder) return ka.typeOrder-kb.typeOrder;
  if(ka.prefix!==kb.prefix) return ka.prefix-kb.prefix;
  if(ka.rest!==kb.rest) return ka.rest-kb.rest;
  if(ka.raw!==kb.raw) return ka.raw.localeCompare(kb.raw,"ja");
  const sa=SESU_ORDER[classifySesu(aKubun)] ?? 9, sb=SESU_ORDER[classifySesu(bKubun)] ?? 9;
  return sa-sb;
}
// 製・据 × 工番・案件 の組み合わせでガントバーの色を決める（製=青系、据=緑系。案件＝受注前は薄い色に）。
//   製作・工番 → 青／製作・案件 → 水色／据付・工番 → 緑／据付・案件 → 黄緑
function ganttBarColor(kobanType, kubun){
  const sesu=classifySesu(kubun);
  const isKoban=kobanType==="工番";
  if(sesu==="据") return isKoban ? "#0E9F6E" : "#84CC16";
  return isKoban ? "#2F6FED" : "#38BDF8";
}
function detectType(rows){
  for(let i=0;i<Math.min(rows.length,4);i++){
    const row=rows[i].map((c)=>String(c||"").trim());
    for(const [type,def] of Object.entries(DATASET_DEFS)){
      if(def.headerMustInclude.every((h)=>row.includes(h))){
        return {type, headerRowIndex:i, headerRow:row};
      }
    }
  }
  return null;
}

// 生年月日(YYYYMMDD)から、基準日(asOf, 未指定なら本日)時点の満年齢を計算する
function calcAge(bday, asOf){
  const s=normDigits8(bday);
  if(!s) return null;
  const y=parseInt(s.slice(0,4),10), m=parseInt(s.slice(4,6),10), d=parseInt(s.slice(6,8),10);
  const nAsOf=normDigits8(asOf);
  const ref = nAsOf ? {y:parseInt(nAsOf.slice(0,4),10), m:parseInt(nAsOf.slice(4,6),10), d:parseInt(nAsOf.slice(6,8),10)}
    : (()=>{ const t=new Date(); return {y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate()}; })();
  let age=ref.y-y;
  const hadBirthday=(ref.m>m) || (ref.m===m && ref.d>=d);
  if(!hadBirthday) age--;
  return age;
}
function parseXlsxFile(file){
  return new Promise(async (resolve)=>{
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf, {type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet, {header:1});
      const detected=detectType(rows);
      if(!detected){ resolve({ok:false, filename:file.name, error:"列構成を認識できませんでした"}); return; }
      const {type, headerRowIndex, headerRow} = detected;
      const def=DATASET_DEFS[type];
      const colIndex={};
      headerRow.forEach((h,idx)=>{ if(h) colIndex[h]=idx; });
      const keyCol = def.keyCol || (def.keyColCandidates && def.keyColCandidates.find((c)=>colIndex[c]!==undefined));
      const keyIdx=colIndex[keyCol];
      const records=[];
      for(let r=headerRowIndex+1; r<rows.length; r++){
        const row=rows[r];
        if(!row) continue;
        const keyVal=row[keyIdx];
        if(!def.keyValid(keyVal)) continue;
        const rec={};
        Object.entries(colIndex).forEach(([col,idx])=>{ rec[col]= row[idx]!==undefined ? String(row[idx]).trim() : ""; });
        if(def.aliasKeyTo && keyCol && keyCol!==def.aliasKeyTo){ rec[def.aliasKeyTo]=rec[keyCol]; }
        records.push(rec);
      }
      resolve({ok:true, filename:file.name, type, records});
    }catch(e){
      resolve({ok:false, filename:file.name, error:"読み取りに失敗しました（"+(e.message||e)+"）"});
    }
  });
}
function parseCsvFile(file){
  return new Promise((resolve)=>{
    Papa.parse(file,{
      encoding:"UTF-8",
      skipEmptyLines:true,
      complete:(res)=>{
        const rows=res.data;
        const detected=detectType(rows);
        if(!detected){ resolve({ok:false, filename:file.name, error:"列構成を認識できませんでした"}); return; }
        const {type, headerRowIndex, headerRow} = detected;
        const def=DATASET_DEFS[type];
        const colIndex={};
        headerRow.forEach((h,idx)=>{ if(h) colIndex[h]=idx; });
        const keyCol = def.keyCol || (def.keyColCandidates && def.keyColCandidates.find((c)=>colIndex[c]!==undefined));
        const keyIdx=colIndex[keyCol];
        const records=[];
        for(let r=headerRowIndex+1; r<rows.length; r++){
          const row=rows[r];
          if(!row) continue;
          const keyVal=row[keyIdx];
          if(!def.keyValid(keyVal)) continue;
          const rec={};
          Object.entries(colIndex).forEach(([col,idx])=>{ rec[col]= row[idx]!==undefined ? String(row[idx]).trim() : ""; });
          if(def.aliasKeyTo && keyCol && keyCol!==def.aliasKeyTo){ rec[def.aliasKeyTo]=rec[keyCol]; }
          // 資格コード(LICCD)は資料によって桁数の表記ゆれ（先頭ゼロの有無）があるため、4桁ゼロ埋めに統一する
          if((type==="licenses" || type==="englicense") && rec.LICCD!==undefined){
            rec.LICCD = normLicCode(rec.LICCD);
          }
          records.push(rec);
        }
        resolve({ok:true, filename:file.name, type, records});
      },
      error:(err)=>resolve({ok:false, filename:file.name, error:err.message}),
    });
  });
}

function mergeRecords(existing, incoming, keyFn){
  const incomingKeys = new Set(incoming.map(keyFn));
  const kept = (existing||[]).filter((r)=>!incomingKeys.has(keyFn(r)));
  return [...kept, ...incoming];
}
// ENGCD+LICCDが同じ行が複数あるとき、より情報量の多い(免許No等が埋まっている)方を残して統合する
function dedupeEngLicense(records){
  const map=new Map();
  records.forEach((r)=>{
    const key=r.ENGCD+"|"+r.LICCD;
    const prev=map.get(key);
    if(!prev){ map.set(key,r); return; }
    const score=(x)=>(x.LICNO?1:0)+(x.SDAY?1:0)+(x.KBN?1:0);
    if(score(r) >= score(prev)) map.set(key,r);
  });
  return [...map.values()];
}

/* ---------------- storage helpers (Firebase Firestore) ----------------
   1データ種別＝1コレクション、1行＝1ドキュメントとしてFirestoreに保存する。
   保存のたびに、前回の状態と比べて変化があった種別だけ差分（追加・更新・削除）を書き込む。 */
const FS_TYPES=["constrslt","eng","kind","employee","literals","licenses","englicense","enginfo","verified","assign"];

function waitForFirebase(){
  return new Promise((resolve)=>{
    if(window.fb){ resolve(); return; }
    window.addEventListener("firebase-ready", ()=>resolve(), {once:true});
    setTimeout(()=>resolve(), 5000); // 5秒待っても来なければ諦めて進む（window.fb未定義のままになる）
  });
}

function docIdFor(type, r){
  switch(type){
    case "constrslt": return r.CONSTNO;
    case "employee": return r.ENGCD;
    case "literals": return r.CDTYP+"__"+r.LTLCD;
    case "licenses": return r.LICCD;
    case "englicense": return r.ENGCD+"__"+r.LICCD;

    case "verified": return r.ENGCD+"__"+r.CONSTNO+"__"+r.POSICD;
    case "assign": return r.ID;

      return (r.CONSTNO||"")+"__"+(r.__seq!==undefined ? r.__seq : "0");
    default: return null;
  }
}
// kind/engは同一CONSTNOに複数行あるので、出現順に連番(__seq)を振ってIDを一意にする
function withSeq(records){
  const cnt={};
  return records.map((r)=>{
    const c=r.CONSTNO||"";
    const seq=cnt[c]||0;
    cnt[c]=seq+1;
    return {...r, __seq:seq};
  });
}

/* ---- ローカルキャッシュ（ブラウザ内、IndexedDB）----
   Firestoreから取得した各データ種別を、更新日時と一緒にこの端末のブラウザ内に保存しておく。
   次回読み込み時は、まずFirestore側の「meta（更新日時）」だけを安く確認し、
   前回から変わっていない種別はここに保存したキャッシュをそのまま使う。 */
const LCACHE_DB="engSearchLocalCache", LCACHE_STORE="cache";
function lcacheOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(LCACHE_DB,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(LCACHE_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function lcacheGetAll(){
  try{
    const db=await lcacheOpen();
    return await new Promise((resolve)=>{
      const tx=db.transaction(LCACHE_STORE,"readonly");
      const req=tx.objectStore(LCACHE_STORE).get("all");
      req.onsuccess=()=>resolve(req.result || {});
      req.onerror=()=>resolve({});
    });
  }catch(e){ return {}; }
}
async function lcacheSetAll(cacheObj){
  try{
    const db=await lcacheOpen();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(LCACHE_STORE,"readwrite");
      tx.objectStore(LCACHE_STORE).put(cacheObj, "all");
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* キャッシュ保存に失敗しても致命的ではないので無視 */ }
}

async function loadFromStorage(){
  await waitForFirebase();
  if(!window.fb) return {};
  const {db, collection, doc, getDoc, getDocs}=window.fb;
  const localCache=await lcacheGetAll(); // { [type]: {records:[...], updatedAtMs:number} }
  const nextCache={...localCache};
  const out={};

  for(const type of FS_TYPES){
    let serverUpdatedMs=null;
    try{
      const metaSnap=await getDoc(doc(db,"meta",type));
      if(metaSnap.exists()){
        const ts=metaSnap.data().updatedAt;
        // 新形式：数値のミリ秒。旧形式（serverTimestamp()で書かれたTimestamp型）にも一応対応。
        serverUpdatedMs = typeof ts==="number" ? ts : (ts && ts.toMillis ? ts.toMillis() : null);
      }
    }catch(e){ /* metaが読めない場合はキャッシュを信用せず必ず取得し直す */ }

    const cached=localCache[type];
    const cacheIsFresh = cached && serverUpdatedMs!==null && cached.updatedAtMs===serverUpdatedMs;

    if(cacheIsFresh){
      if(cached.records.length>0) out[type]={records: cached.records, filename:"firestore(cache)"};
      continue;
    }

    try{
      const snap=await getDocs(collection(db, type));
      const records=[];
      snap.forEach((d)=>{ const data={...d.data()}; delete data.__seq; records.push(data); });
      if(records.length>0) out[type]={records, filename:"firestore"};
      nextCache[type]={records, updatedAtMs: serverUpdatedMs};
    }catch(e){
      // 未作成のコレクション・権限不足は無視して次へ
    }
  }

  lcacheSetAll(nextCache); // 完了を待たずに進めてよい
  return out;
}

async function saveToStorage(next, prev){
  await waitForFirebase();
  if(!window.fb) return false;
  const {db, doc, setDoc, writeBatch}=window.fb;
  try{
    const localCache=await lcacheGetAll();
    const nextCache={...localCache};

    for(const type of FS_TYPES){
      const nextRecordsRaw=next[type]?.records || [];
      const prevRecordsRaw=(prev && prev[type]?.records) || [];
      if(nextRecordsRaw===prevRecordsRaw) continue; // 参照が同じ＝変更なし

      const nextRecords=(type==="kind"||type==="eng") ? withSeq(nextRecordsRaw) : nextRecordsRaw;
      const prevRecords=(type==="kind"||type==="eng") ? withSeq(prevRecordsRaw) : prevRecordsRaw;

      const nextIds=new Set(nextRecords.map((r)=>docIdFor(type,r)).filter(Boolean));
      const prevIds=prevRecords.map((r)=>docIdFor(type,r)).filter(Boolean);
      const toDelete=prevIds.filter((id)=>!nextIds.has(id));

      // 変更検知のため、id→内容(JSON文字列)のマップを作っておく
      const prevById={};
      prevRecords.forEach((r)=>{
        const id=docIdFor(type,r);
        if(!id) return;
        const {__seq, ...data}=r;
        prevById[id]=JSON.stringify(data);
      });

      const ops=[];
      nextRecords.forEach((r)=>{
        const id=docIdFor(type,r);
        if(!id) return;
        const {__seq, ...data}=r;
        const dataStr=JSON.stringify(data);
        if(prevById[id]===dataStr) return; // 内容が変わっていないレコードは書き込まない
        ops.push({op:"set", id, data});
      });
      toDelete.forEach((id)=>ops.push({op:"delete", id}));

      for(let i=0;i<ops.length;i+=450){
        const chunk=ops.slice(i,i+450);
        const batch=writeBatch(db);
        chunk.forEach((o)=>{
          const ref=doc(db, type, o.id);
          if(o.op==="set") batch.set(ref, o.data);
          else batch.delete(ref);
        });
        await batch.commit();
      }

      // この種別の更新日時を、サーバーとローカルキャッシュの両方に「同じ数値」で記録する。
      // （以前はサーバー側をserverTimestamp()、ローカル側をDate.now()で別々に記録しており、
      // 　両者がミリ秒単位で一致することはほぼ無いため、保存した本人のキャッシュまで
      // 　毎回無効化されて無駄なフル再読み込みが発生するバグがあった）
      const updatedAtMs=Date.now();
      await setDoc(doc(db,"meta",type), {updatedAt: updatedAtMs});
      nextCache[type]={records: nextRecordsRaw, updatedAtMs};
    }

    lcacheSetAll(nextCache);
    return true;
  }catch(e){
    console.error("Firestore save error:", e);
    return false;
  }
}

function stripUndefinedForFirestore(value){

async function listConsiderListsFromFirestore(){

      title: data.title || d.id,
      updatedAt: data.updatedAt || 0,
      count: (data.candidates||[]).length,

// ゲートカテゴリ／ゲート種類／ゲート構造の3階層分類
// 「ダム（ローラゲート・ガーダ）」「河川（ローラゲート・ガーダ）」のような命名規則の種別名を
// カテゴリ（ダム／河川）・種類・構造に分解する。ダム／河川以外は「その他」カテゴリとし、
// 名称全体をそのまま「ゲート種類」として扱う（構造は空欄）。
// 下記リストの名称は、命名規則がまちまちで自動分解になじまないため、今回の分類対象からは除外する。
const GATE_HIERARCHY_EXCLUDED = new Set([
  "ゴム引布製起伏堰","ウオッチマンゲート","壁付円形多段ゲート","多孔式（斜樋）ゲート","ラジアルゲート","ラジアルゲート（高圧）","ローラゲート（ガーター）","ローラゲート（シェル式）",
  "ローラゲート（高圧）","ライジングセクターゲート","スライドゲート","起伏ゲート","スイング式ゲート",
  "門柱レスゲート","フラップゲート","横引き式ゲート","角落としゲート","フローティングゲート","魚道ゲート",
  "ジェットフローゲート","高圧スライドバルブ","スルースバルブ","水圧鉄管・放流管・内張管","除塵設備","修繕（水門）",
  "開閉装置","操作制御設備","ポンプゲート","バタフライバルブ","ダム付属設備","鋼製付属設備","電気設備",
  "通船ゲート",
]);
function parseGateHierarchy(shruName){
  const n=(shruName||"").trim();
  if(!n) return null;
  if(GATE_HIERARCHY_EXCLUDED.has(n)) return null; // 今回の分類対象外
  const m=n.match(/^(ダム|河川)[（(](.+)[）)]$/);
  if(m){
    const category=m[1];
    const parts=m[2].split("・");
    const type=(parts[0]||"").trim();
    const structure=parts.slice(1).join("・").trim();
    return {category, type, structure};
  }
  return {category:"その他", type:n, structure:""};
}

// 工番（例：54G-9010）を「頭の数字→ハイフン後の数字」の順で若い順に並べる比較関数
function compareConstno(a,b){
  const pa=String(a||"").match(/^(\d+)[A-Za-z]+-(\d+)$/);
  const pb=String(b||"").match(/^(\d+)[A-Za-z]+-(\d+)$/);
  if(pa && pb){
    const d1=parseInt(pa[1],10)-parseInt(pb[1],10);
    if(d1!==0) return d1;
    return parseInt(pa[2],10)-parseInt(pb[2],10);
  }
  return String(a||"").localeCompare(String(b||""));
}

function xmlFind(root, ...tagPath){
  let cur=root;
  for(const tag of tagPath){
    if(!cur) return null;
    const found=cur.getElementsByTagName(tag);
    if(!found.length) return null;
    cur=found[0];
  }
  return cur;
}
function xmlFindText(root, ...tagPath){
  const el=xmlFind(root, ...tagPath);
  return el ? (el.textContent||"").trim() : "";
}
function xmlAll(root, tag){
  return root ? Array.from(root.getElementsByTagName(tag)) : [];
}
const DAKUTEN_MAP={"ガ":"カ","ギ":"キ","グ":"ク","ゲ":"ケ","ゴ":"コ","ザ":"サ","ジ":"シ","ズ":"ス","ゼ":"セ","ゾ":"ソ",
  "ダ":"タ","ヂ":"チ","ヅ":"ツ","デ":"テ","ド":"ト","バ":"ハ","ビ":"ヒ","ブ":"フ","ベ":"ヘ","ボ":"ホ",
  "パ":"ハ","ピ":"ヒ","プ":"フ","ペ":"ヘ","ポ":"ホ","ヴ":"ウ"};
function dakutenNormalize(s){
  return (s||"").split("").map((c)=>DAKUTEN_MAP[c]||c).join("");
}
// 氏名の「姓 名」のスペース有無・全角半角の表記ゆれを無視して比較するための正規化
function normName(s){
  return (s||"").replace(/[\s　]/g,"");
}
function findCodeByName(literalMap, type, name){
  if(!name) return "";
  const map=literalMap[type]||{};
  for(const code of Object.keys(map)){ if(map[code]===name) return code; }
  for(const code of Object.keys(map)){ if(map[code] && (map[code].includes(name) || name.includes(map[code]))) return code; }
  const normName=dakutenNormalize(name);
  for(const code of Object.keys(map)){ if(map[code] && dakutenNormalize(map[code])===normName) return code; }
  return "";
}
function findEigyoCodeByName(name){
  for(const code of Object.keys(EIGYCD_MAP)){ if(EIGYCD_MAP[code]===name) return code; }
  return "";
}
// 「国の機関　　農林水産省　　東海農政局　　○○事務所」のような分類名を
// 発注者（KYA1）／担当事務所（KYA2）に分割する
function splitOrderer(bunruimei){
  const parts=(bunruimei||"").split(/　　+/).map((s)=>s.trim()).filter(Boolean);
  if(parts.length>=3) return {kya1: parts.slice(1,-1).join(""), kya2: parts[parts.length-1]};
  if(parts.length===2) return {kya1: parts[0], kya2: parts[1]};
  if(parts.length===1) return {kya1: parts[0], kya2: ""};
  return {kya1:"", kya2:""};
}

function parseCorinsXml(xmlString, literalMap, employeeMap){
  let doc;
  try{
    doc=new DOMParser().parseFromString(xmlString, "application/xml");
  }catch(e){
    return {error:"XMLとして読み取れませんでした"};
  }
  if(doc.getElementsByTagName("parsererror").length){
    return {error:"XMLの形式が正しくありません（貼り付けた内容を確認してください）"};
  }
  const root=doc.documentElement;
  if(!root || root.tagName!=="コリンズ"){
    return {error:"コリンズ形式のXMLではないようです（ルート要素が<コリンズ>ではありません）"};
  }

  const {kya1, kya2}=splitOrderer(xmlFindText(root,"発注機関情報","発注機関分類名"));
  const tkindText=xmlFindText(root,"登録種別","登録種別");
  const tkind = tkindText.includes("竣工") ? findCodeByName(literalMap,"TSBT","竣工")
              : tkindText.includes("変更") ? findCodeByName(literalMap,"TSBT","変更")
              : tkindText.includes("受注") ? findCodeByName(literalMap,"TSBT","受注") : "";

  const kyknIncl=parseFloat(xmlFindText(root,"請負金額"));
  const header={
    TNO: xmlFindText(root,"登録番号"),
    TKIND: tkind,
    NAM1: xmlFindText(root,"件名"),
    NAM2: "",
    KYKN: isNaN(kyknIncl) ? "" : String(Math.round(kyknIncl/1.1)), // コリンズの請負金額は税込のため税抜きに変換
    KOKF: xmlFindText(root,"契約工期","開始年月日"),
    KOKT: xmlFindText(root,"契約工期","完了年月日"),
    KYA1: kya1,
    KYA2: kya2,
    SEAD: xmlFindText(root,"施工場所等","施工場所","起点","住所"),
    BUNYA: findCodeByName(literalMap,"BNYA", xmlFindText(root,"公共事業の分野","公共事業の分野")),
    KKGY: findCodeByName(literalMap,"KKGS", xmlFindText(root,"本件登録工事の受注に対応した建設業許可業種","本件登録工事の受注に対応した建設業許可業種")),
    NSKBN: findCodeByName(literalMap,"NSKB", xmlFindText(root,"本件登録工事の入札参加資格区分","本件登録工事の入札参加資格区分")),
    KTYP: findCodeByName(literalMap,"KYKT", xmlFindText(root,"契約方式","契約方式")),
    JTYP: findCodeByName(literalMap,"JCKT", xmlFindText(root,"受注形態","受注形態")),
    KKIND01: findCodeByName(literalMap,"KOSY", xmlFindText(root,"工種_工法_型式","工種")),
    KMETH01: findCodeByName(literalMap,"KATA", xmlFindText(root,"工種_工法_型式","工法_型式")),
    EIGYCD: findEigyoCodeByName(xmlFindText(root,"請負者情報","請負者","幹事企業","事業所","事業所名") || xmlFindText(root,"請負者情報","幹事企業","事業所","事業所名")),
    JVNM: xmlFindText(root,"受注形態","受注形態")==="単独" ? "" : xmlFindText(root,"件名"),
  };

  const engBlocks=xmlAll(root,"技術者情報");
  const projTotalDays=totalDays(header.KOKF, header.KOKT);
  const engRows=engBlocks.map((el)=>{
    const name=xmlFindText(el,"氏名");
    const roleText=xmlFindText(el,"役割");
    const emp=Object.values(employeeMap||{}).find((e)=>normName(e.ID_NAME)===normName(name));
    const kokf01=xmlFindText(el,"従事期間","開始年月日");
    const kokt01=xmlFindText(el,"従事期間","完了年月日");
    // 従事割合はXMLに無いため、従事期間1の日数 ÷ 工期全体の日数 から算出する
    const periodDays=totalDays(kokf01, kokt01);
    const jwari=(projTotalDays>0 && periodDays>0)
      ? String(Math.min(100, Math.round((periodDays/projTotalDays)*1000)/10))
      : "";
    return {
      role: roleText,
      POSICD: findCodeByName(literalMap,"TRGT",roleText),
      name,
      ENGCD: emp ? emp.ENGCD : "",
      matched: !!emp,
      KOKF01: kokf01,
      KOKT01: kokt01,
      KOKF02:"", KOKT02:"", KOKF03:"", KOKT03:"",
      JWARI: jwari,
    };
  });

  const kindRows=[];
  const suimon=xmlFind(root,"詳細技術情報","水門扉等工事","河川用水門扉工");
  if(suimon){
    const suis=xmlFindText(suimon,"設計水深");
    const gateType=xmlFindText(suimon,"ゲートの種類","ゲートの種類") || xmlFindText(suimon,"ゲートの種類");
    const items=xmlAll(suimon,"扉体_開閉機の種類");
    items.forEach((item)=>{
      const keik=xmlFindText(item,"扉体の純径間");

      const kaihei=(xmlFindText(item,"開閉機の種類","開閉機の種類") || xmlFindText(item,"開閉機の種類")).replace(/^その他[\u3000 ]*/,"");
      const nameGuess="河川（"+gateType.replace("ローラーゲート","ローラゲート")+(kouzou?"・"+kouzou:"")+"）";

      });
    });
  }

  return {
    header, engRows, kindRows,
    rawGaiyo: xmlFindText(root,"工事概要"),
    unsupportedKind: !suimon,
  };
}

  const [editingHeader,setEditingHeader]=useState(false);
  const [headerDraft,setHeaderDraft]=useState({});
  const [editingRows,setEditingRows]=useState(false);
  const [kindsDraft,setKindsDraft]=useState([]);
  const [engDraft,setEngDraft]=useState([]);
  const [showNew,setShowNew]=useState(false);
  const [newDraft,setNewDraft]=useState({});
  const [newError,setNewError]=useState("");
  const [fIncludeRetired,setFIncludeRetired]=useState(false);

  const now=new Date();
  const currentFY = now.getMonth()+1>=4 ? now.getFullYear() : now.getFullYear()-1;
  const [fFyFrom,setFFyFrom]=useState("");
  const [fFyFromMonth,setFFyFromMonth]=useState("");
  const [fFyTo,setFFyTo]=useState("");
  const [fFyToMonth,setFFyToMonth]=useState("");
  const [fSelectedGateCategory,setFSelectedGateCategory]=useState([]);
  const [fSelectedGateType,setFSelectedGateType]=useState([]);
  const [fSelectedGateStructure,setFSelectedGateStructure]=useState([]);
  const [fSelectedKaihei,setFSelectedKaihei]=useState([]);
  const [fSelectedSesu,setFSelectedSesu]=useState([]);
  const [fKeikMin,setFKeikMin]=useState("");
  const [fHeighMin,setFHeighMin]=useState("");
  const [fAreaMin,setFAreaMin]=useState("");
  const [fAreaIncludeSuis,setFAreaIncludeSuis]=useState(false);
  const [fSuisMin,setFSuisMin]=useState("");
  const [fSyusMin,setFSyusMin]=useState("");
  const [fHoryuMin,setFHoryuMin]=useState("");
  const [fPointMin,setFPointMin]=useState("");
  const [filterSearched,setFilterSearched]=useState(false);

  useEffect(()=>{
    if(initialConstno){
      setSelected(initialConstno);
      setQuery(initialConstno);
      setEditingHeader(false);
      setEditingRows(false);
    }
  },[jumpNonce]);

  // 選択している工事が切り替わったら、前の工事の編集下書きが誤って残らないよう必ず破棄する
  useEffect(()=>{
    setEditingHeader(false);
    setHeaderDraft({});
    setEditingRows(false);
    setKindsDraft([]);
    setEngDraft([]);
  },[selected]);

  const suggestions=useMemo(()=>{
    const q=query.trim();
    if(!q) return [];
    return constrsltRecords
      .filter((r)=> r.CONSTNO.includes(q) || ((r.NAM1||"")+(r.NAM2||"")).includes(q))
      .slice(0,20);
  },[constrsltRecords, query]);

  const filterGateHierarchyByCode=useMemo(()=>{
    const map={};
    const set=new Set();
    Object.values(kindByConst).forEach((rows)=>{ (rows||[]).forEach((k)=>{ if(k.KIND) set.add(String(parseFloat(k.KIND))); }); });
    set.forEach((code)=>{
      const name=literalMap.SHRU && literalMap.SHRU[code];
      if(name) map[code]=parseGateHierarchy(name);
    });
    return map;
  },[kindByConst, literalMap]);

  const FILTER_GATE_CATEGORY_ORDER=["ダム","河川","その他"];
  const filterGateCategoryOptions=useMemo(()=>{
    const set=new Set();
    Object.values(filterGateHierarchyByCode).forEach((h)=>{ if(h) set.add(h.category); });
    return FILTER_GATE_CATEGORY_ORDER.filter((c)=>set.has(c)).map((c)=>({code:c, name:c}));
  },[filterGateHierarchyByCode]);

  const filterGateTypeOptions=useMemo(()=>{
    const set=new Set();
    Object.values(filterGateHierarchyByCode).forEach((h)=>{
      if(!h) return;
      if(fSelectedGateCategory.length && !fSelectedGateCategory.includes(h.category)) return;
      if(h.type) set.add(h.type);
    });
    return [...set].sort((a,b)=>a.localeCompare(b,"ja")).map((t)=>({code:t, name:t}));
  },[filterGateHierarchyByCode, fSelectedGateCategory]);

  const filterGateStructureOptions=useMemo(()=>{
    const set=new Set();
    Object.values(filterGateHierarchyByCode).forEach((h)=>{
      if(!h || !h.structure) return;
      if(fSelectedGateCategory.length && !fSelectedGateCategory.includes(h.category)) return;
      if(fSelectedGateType.length && !fSelectedGateType.includes(h.type)) return;
      set.add(h.structure);
    });
    return [...set].sort((a,b)=>a.localeCompare(b,"ja")).map((s)=>({code:s, name:s}));
  },[filterGateHierarchyByCode, fSelectedGateCategory, fSelectedGateType]);

  const filterKaiheiOptions=useMemo(()=> optionsFromLiteral(literalMap,"KHKI"), [literalMap]);

  const filterResults=useMemo(()=>{
    if(!filterSearched) return [];
    // 年度が未入力（空欄）の側は制限なし。両方空欄なら日付での絞り込みは行わない（＝すべてのデータが対象）。
    const fHasFrom = fFyFrom!=="" && fFyFrom!==null && fFyFrom!==undefined && !isNaN(parseInt(fFyFrom,10));
    const fHasTo = fFyTo!=="" && fFyTo!==null && fFyTo!==undefined && !isNaN(parseInt(fFyTo,10));
    const fromYM = fHasFrom ? parseInt(fFyFrom,10)*100 + parseInt(fFyFromMonth||"1",10) : null;
    const toYM = fHasTo ? parseInt(fFyTo,10)*100 + parseInt(fFyToMonth||"12",10) : null;
    const keikMinN=fKeikMin===""?null:parseFloat(fKeikMin);
    const heighMinN=fHeighMin===""?null:parseFloat(fHeighMin);
    const areaMinN=fAreaMin===""?null:parseFloat(fAreaMin);
    const suisMinN=fSuisMin===""?null:parseFloat(fSuisMin);
    const syusMinN=fSyusMin===""?null:parseFloat(fSyusMin);
    const horyuMinN=fHoryuMin===""?null:parseFloat(fHoryuMin);
    const pointMinN=fPointMin===""?null:parseFloat(fPointMin);
    const hasKindFilter = fSelectedGateCategory.length || fSelectedGateType.length || fSelectedGateStructure.length || fSelectedKaihei.length || fSelectedSesu.length || keikMinN!==null || heighMinN!==null || areaMinN!==null || suisMinN!==null || syusMinN!==null || horyuMinN!==null;

    return constrsltRecords.filter((r)=>{
      const ymDigits = normDigits8(r.KOKT);
      const ym = ymDigits ? parseInt(ymDigits.slice(0,6),10) : null;
      if(fromYM!==null || toYM!==null){
        if(ym===null) return false;
        if(fromYM!==null && ym<fromYM) return false;
        if(toYM!==null && ym>toYM) return false;
      }
      if(pointMinN!==null){
        const pt = (r.POINT===undefined||r.POINT===null||r.POINT==="") ? null : parseFloat(r.POINT);
        if(pt===null || isNaN(pt) || pt<pointMinN) return false;
      }
      if(hasKindFilter){
        const kinds=kindByConst[r.CONSTNO]||[];
        const ok=kinds.some((k)=>{
          if(fSelectedGateCategory.length || fSelectedGateType.length || fSelectedGateStructure.length){
            const h=filterGateHierarchyByCode[String(parseFloat(k.KIND||""))];
            if(!h) return false;
            if(fSelectedGateCategory.length && !fSelectedGateCategory.includes(h.category)) return false;
            if(fSelectedGateType.length && !fSelectedGateType.includes(h.type)) return false;
            if(fSelectedGateStructure.length && !fSelectedGateStructure.includes(h.structure)) return false;
          }
          if(fSelectedKaihei.length && !fSelectedKaihei.includes(String(parseFloat(k.KIKA||"")))) return false;
          if(fSelectedSesu.length && !fSelectedSesu.includes(String(parseFloat(k.KBN||"")))) return false;
          const num=(v)=> v===""||v===undefined ? null : parseFloat(v);
          const keik=num(k.KEIK), heigh=num(k.HEIGH), suis=num(k.SUIS), syus=num(k.SYUS), horyu=num(k.HORYU);
          if(keikMinN!==null && (keik===null||keik<keikMinN)) return false;
          if(heighMinN!==null && (heigh===null||heigh<heighMinN)) return false;
          if(areaMinN!==null){
            let area = (keik!==null && heigh!==null) ? keik*heigh : null;
            if(area!==null && fAreaIncludeSuis){ area = (suis!==null) ? area*suis : null; }
            if(area===null || area<areaMinN) return false;
          }
          if(suisMinN!==null && (suis===null||suis<suisMinN)) return false;
          if(syusMinN!==null && (syus===null||syus<syusMinN)) return false;
          if(horyuMinN!==null && (horyu===null||horyu<horyuMinN)) return false;
          return true;
        });
        if(!ok) return false;
      }
      const kw=query.trim();
      if(kw && !(r.CONSTNO.includes(kw) || ((r.NAM1||"")+(r.NAM2||"")).includes(kw))) return false;
      return true;
    }).sort((a,b)=>compareConstno(a.CONSTNO,b.CONSTNO)).slice(0,300);
  },[filterSearched, constrsltRecords, kindByConst, fFyFrom, fFyFromMonth, fFyTo, fFyToMonth,
     fSelectedGateCategory, fSelectedGateType, fSelectedGateStructure, fSelectedKaihei, fSelectedSesu, filterGateHierarchyByCode,
     fKeikMin, fHeighMin, fAreaMin, fAreaIncludeSuis, fSuisMin, fSyusMin, fHoryuMin, fPointMin, query]);

  const resetFilter=()=>{
    setFFyFrom(currentFY-9); setFFyFromMonth("04"); setFFyTo(currentFY); setFFyToMonth("04");
    setFSelectedGateCategory([]); setFSelectedGateType([]); setFSelectedGateStructure([]); setFSelectedKaihei([]); setFSelectedSesu([]);
    setFKeikMin(""); setFHeighMin(""); setFAreaMin(""); setFAreaIncludeSuis(false);
    setFSuisMin(""); setFSyusMin(""); setFHoryuMin(""); setFPointMin(""); setQuery("");
    setFIncludeRetired(false);
    setFilterSearched(false);
  };

  const pickFromFilter=(cn)=>{ setSelected(cn); setQuery(cn); };

  const proj=useMemo(()=> selected ? constrsltRecords.find((r)=>r.CONSTNO===selected) : null, [constrsltRecords, selected]);
  const kinds=useMemo(()=> (selected && kindByConst[selected]) || [], [selected, kindByConst]);
  const engRowsAll=useMemo(()=> selected ? engRecords.filter((r)=>r.CONSTNO===selected) : [], [selected, engRecords]);
  const engRows=useMemo(()=>{
    if(fIncludeRetired) return engRowsAll;
    return engRowsAll.filter((r)=>{
      const emp=employeeMap[r.ENGCD];
      return !emp || emp.STATUS!=="retired";
    });
  }, [engRowsAll, fIncludeRetired, employeeMap]);

  const bunyaOpts=useMemo(()=>optionsFromLiteral(literalMap,"BNYA"),[literalMap]);
  const kkgsOpts=useMemo(()=>optionsFromLiteral(literalMap,"KKGS"),[literalMap]);
  const nskbOpts=useMemo(()=>optionsFromLiteral(literalMap,"NSKB"),[literalMap]);
  const kyktOpts=useMemo(()=>optionsFromLiteral(literalMap,"KYKT"),[literalMap]);
  const jcktOpts=useMemo(()=>optionsFromLiteral(literalMap,"JCKT"),[literalMap]);
  const tsbtOpts=useMemo(()=>optionsFromLiteral(literalMap,"TSBT"),[literalMap]);
  const kosyOpts=useMemo(()=>optionsFromLiteral(literalMap,"KOSY"),[literalMap]);
  const kataOpts=useMemo(()=>optionsFromLiteral(literalMap,"KATA"),[literalMap]);
  const sesuOpts=useMemo(()=>optionsFromLiteral(literalMap,"SESU"),[literalMap]);
  const shruOpts=useMemo(()=>optionsFromLiteral(literalMap,"SHRU"),[literalMap]);
  const khkiOpts=useMemo(()=>optionsFromLiteral(literalMap,"KHKI"),[literalMap]);
  const trgtOpts=useMemo(()=>optionsFromLiteral(literalMap,"TRGT"),[literalMap]);
  const eigyoOpts=useMemo(()=>Object.entries(EIGYCD_MAP).map(([code,name])=>({code,name})),[]);

  const startEditHeader=()=>{ setHeaderDraft({...proj}); setEditingHeader(true); };
  const cancelEditHeader=()=>setEditingHeader(false);
  const saveHeader=()=>{ onSaveProject(selected, headerDraft); setEditingHeader(false); };
  const hf=(field)=>headerDraft[field]||"";
  const setHf=(field)=>(v)=>setHeaderDraft({...headerDraft, [field]:v});
  const toggleSchedCheck=()=>{
    if(!proj || !canEdit) return;
    const next = parseFloat(proj.SCHED_CHECKED)===1 ? "0" : "1";
    onSaveProject(selected, {...proj, SCHED_CHECKED: next});
  };

  const startEditRows=()=>{
    setKindsDraft(kinds.map((k)=>({...k})));
    setEngDraft(engRowsAll.map((e)=>({...e})));
    setEditingRows(true);
  };
  const cancelEditRows=()=>setEditingRows(false);
  const saveRows=()=>{
    onSaveKinds(selected, kindsDraft.map((k,i)=>({...k, CONSTNO:selected, SEQNO:String(i+1)})));
    onSaveEng(selected, engDraft.map((e,i)=>({...e, CONSTNO:selected, SEQNO:String(i+1)})));
    setEditingRows(false);
  };
  const addKindRow=()=>setKindsDraft([...kindsDraft, {CONSTNO:selected, SEQNO:"", KBN:"", KIND:"", KGAI:"", KIKA:"", ZAIS:"", KEIK:"", HEIGH:"", INZU:"", SUIS:"", SYUS:"", HORYU:""}]);
  const removeKindRow=(i)=>setKindsDraft(kindsDraft.filter((_,idx)=>idx!==i));
  const updKind=(i,field)=>(v)=>setKindsDraft(kindsDraft.map((k,idx)=> idx===i ? {...k,[field]:v} : k));
  const addEngRow=()=>setEngDraft([...engDraft, {CONSTNO:selected, SEQNO:"", POSICD:"", ENGCD:"", KOKF01:"",KOKT01:"",KOKF02:"",KOKT02:"",KOKF03:"",KOKT03:"", JWARI:""}]);
  const removeEngRow=(i)=>setEngDraft(engDraft.filter((_,idx)=>idx!==i));
  const updEng=(i,field)=>(v)=>setEngDraft(engDraft.map((e,idx)=> idx===i ? {...e,[field]:v} : e));
  // 技術者コード欄に氏名が入力された場合、社員データの氏名と突き合わせてコードに変換する（数字ならそのまま）
  const resolveEngcdByName=(inputVal)=>{
    const s=String(inputVal||"").trim();
    if(!s || /^\d+$/.test(s)) return null;
    const key=s.replace(/\s+/g,"");
    const found=Object.values(employeeMap||{}).find((e)=>(e.ID_NAME||"").replace(/\s+/g,"")===key);
    return found ? found.ENGCD : null;
  };

  const openNewForm=()=>{ setNewDraft({}); setNewError(""); setShowNew(true); };
  const nf=(field)=>newDraft[field]||"";
  const setNf=(field)=>(v)=>setNewDraft({...newDraft, [field]:v});
  const createNewProject=()=>{
    const cn=(newDraft.CONSTNO||"").trim();
    if(!cn){ setNewError("工番を入力してください"); return; }
    if(constrsltRecords.some((r)=>r.CONSTNO===cn)){ setNewError("その工番は既に存在します"); return; }
    onCreateProject({CONSTNO:cn, ...newDraft});
    setShowNew(false);
    setSelected(cn);
    setQuery(cn);
  };

  const [showXml,setShowXml]=useState(false);
  const [xmlConstno,setXmlConstno]=useState("");
  const [xmlRaw,setXmlRaw]=useState("");
  const [xmlError,setXmlError]=useState("");
  const [xmlResultMsg,setXmlResultMsg]=useState("");
  const [xmlDragOver,setXmlDragOver]=useState(false);
  const xmlFileInputRef=useRef(null);
  const readXmlFile=(file)=>{
    setXmlError("");
    const reader=new FileReader();
    reader.onload=(ev)=>setXmlRaw(String(ev.target.result||""));
    reader.onerror=()=>setXmlError("ファイルを読み取れませんでした");
    reader.readAsText(file, "UTF-8");
  };
  const importCorinsXml=()=>{
    setXmlError(""); setXmlResultMsg("");
    const cn=xmlConstno.trim();
    if(!cn){ setXmlError("工番を入力してください（XMLには工番の情報が含まれていないため）"); return; }
    if(!xmlRaw.trim()){ setXmlError("XMLの内容を貼り付けてください"); return; }
    const parsed=parseCorinsXml(xmlRaw, literalMap, employeeMap);
    if(parsed.error){ setXmlError(parsed.error); return; }

    const exists=constrsltRecords.some((r)=>r.CONSTNO===cn);
    if(exists){
      onSaveProject(cn, parsed.header);
    } else {
      onCreateProject({CONSTNO:cn, ...parsed.header});
    }

    const existingKinds=kindByConst[cn]||[];
    const newKinds=parsed.kindRows.map((k)=>({CONSTNO:cn, SEQNO:"", KBN:k.KBN, KIND:k.KIND, KGAI:k.KGAI, KIKA:k.KIKA, ZAIS:k.ZAIS, KEIK:k.KEIK, HEIGH:k.HEIGH, INZU:k.INZU, SUIS:k.SUIS, SYUS:k.SYUS, HORYU:k.HORYU}));
    onSaveKinds(cn, [...existingKinds, ...newKinds].map((k,i)=>({...k, CONSTNO:cn, SEQNO:String(i+1)})));

    const existingEng=engRecords.filter((r)=>r.CONSTNO===cn);
    const newEng=parsed.engRows.map((e)=>({CONSTNO:cn, SEQNO:"", POSICD:e.POSICD, ENGCD:e.ENGCD, KOKF01:e.KOKF01, KOKT01:e.KOKT01, KOKF02:"", KOKT02:"", KOKF03:"", KOKT03:"", JWARI:e.JWARI}));
    onSaveEng(cn, [...existingEng, ...newEng].map((e,i)=>({...e, CONSTNO:cn, SEQNO:String(i+1)})));

    const unmatched=parsed.engRows.filter((e)=>!e.matched).map((e)=>e.name);
    let msg=(exists?"既存の工事に追加取込みしました。":"新規登録しました。")
      +"種別"+parsed.kindRows.length+"件、技術者"+parsed.engRows.length+"件を取り込みました。";
    if(parsed.unsupportedKind) msg+=" ※この工種カテゴリの種別自動判定には対応していないため、種別は0件です。手動で追加してください。";
    if(unmatched.length) msg+=" ※社員データに見つからなかった技術者："+unmatched.join("、")+"（技術者在籍・所属管理で先に登録してから、種別・技術者の編集でコードを入力してください）";
    msg+=" 必ず内容を確認・修正してください（従事割合は従事期間1÷工期全体日数から自動算出した参考値、製据区分などXMLに無い項目は空欄になっています。金額は税込→税抜きに換算済みです）。";
    setXmlResultMsg(msg);
    setSelected(cn);
    setQuery(cn);
    setEditingHeader(false);
    setEditingRows(false);
  };

  return (
    <div className="card detail-card">
      <div className="res-hd">
        <div>
          <h2>工事詳細検索</h2>
          <p className="sub">条件を指定して検索してください</p>
        </div>
        {canEdit &&
          <span style={{display:"flex", gap:8}}>
            <button className="btn-outline" onClick={()=>{ setShowXml((v)=>!v); setXmlError(""); setXmlResultMsg(""); }}><Ic.Upload/> コリンズXMLから取込</button>
            <button className="btn-outline" onClick={openNewForm}><Ic.Plus/> 新規工事を登録</button>
          </span>
        }
      </div>

      {showXml &&
        <div className="master-add-form" style={{flexDirection:"column", alignItems:"stretch", marginBottom:18}}>
          <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 10px"}}>
            コリンズから出力したXMLを貼り付けると、工事情報・種別・技術者を自動で取り込みます。
            工番はXMLに含まれないため、既存の工番なら追加取込み、新しい工番なら新規登録になります。
            取り込み後は必ず内容を確認・修正してください（従事割合は従事期間1と工期全体から自動算出した参考値、製据区分などXMLに無い項目は空欄になります。金額は税込→税抜きに換算します）。
          </p>
          <DTInput value={xmlConstno} onChange={setXmlConstno} placeholder="工番（例：99G-9999）" mono/>
          <div className={"drop xml-drop"+(xmlDragOver?" over":"")} style={{marginTop:10, padding:"18px"}}
            onDragOver={(e)=>{ e.preventDefault(); setXmlDragOver(true); }}
            onDragLeave={()=>setXmlDragOver(false)}
            onDrop={(e)=>{
              e.preventDefault(); setXmlDragOver(false);
              const file=e.dataTransfer.files && e.dataTransfer.files[0];
              if(file) readXmlFile(file);
            }}
            onClick={()=>xmlFileInputRef.current && xmlFileInputRef.current.click()}>
            <Ic.Upload color={xmlDragOver?"var(--accent)":"var(--blue)"} size={22}/>
            <p style={{margin:"6px 0 0", fontSize:12}}>XMLファイルをここにドロップ、またはクリックして選択</p>
            <input ref={xmlFileInputRef} type="file" accept=".xml" style={{display:"none"}}
              onChange={(e)=>{ if(e.target.files[0]) readXmlFile(e.target.files[0]); }}/>
          </div>
          <textarea className="xml-textarea" style={{marginTop:10}} rows={6} value={xmlRaw}
            onChange={(e)=>setXmlRaw(e.target.value)} placeholder="またはここにXMLの内容を直接貼り付け"/>
          <div style={{display:"flex", gap:10, marginTop:10}}>
            <button className="btn-primary" onClick={importCorinsXml}>取り込む</button>
            <button className="btn-ghost" onClick={()=>setShowXml(false)}>キャンセル</button>
          </div>
          {xmlError && <div className="m-form-err" style={{marginTop:8}}>{xmlError}</div>}
          {xmlResultMsg && <div className="storage-warn" style={{marginTop:10}}>{xmlResultMsg}</div>}
        </div>
      }

      {showNew &&
        <div className="master-add-form" style={{flexDirection:"column", alignItems:"stretch", marginBottom:18}}>
          <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 10px"}}>工番だけ先に登録し、あとから詳細・種別・技術者を編集で追加できます。</p>
          <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"center"}}>
            <DTInput value={nf("CONSTNO")} onChange={setNf("CONSTNO")} placeholder="工番（例：99G-9999）" mono/>
            <DTInput value={nf("NAM1")} onChange={setNf("NAM1")} placeholder="工事件名"/>
            <DTInput value={nf("KYA1")} onChange={setNf("KYA1")} placeholder="発注者"/>
            <button className="btn-primary" onClick={createNewProject}>登録する</button>
            <button className="btn-ghost" onClick={()=>setShowNew(false)}>キャンセル</button>
          </div>
          {newError && <div className="m-form-err" style={{marginTop:8}}>{newError}</div>}
        </div>
      }

      <div className="search-panel" style={{marginBottom:0}}>
        <div className="search-header"><Ic.Filter/> 工事の条件検索</div>
        <div className="search-body">
          <div className="field-row pair-row">
            <div className="pair-group-grow top">
              <div className="field-label">年度</div>
              <div className="field-control">
                <div className="yr-inline">
                  <input type="number" placeholder="指定なし" value={fFyFrom} onChange={(e)=>setFFyFrom(e.target.value)}/>
                  <span>年</span>
                  <select value={fFyFromMonth} onChange={(e)=>setFFyFromMonth(e.target.value)}>
                    <option value="">指定なし</option>
                    {Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")).map((m)=>(
                      <option key={m} value={m}>{parseInt(m,10)}月</option>
                    ))}
                  </select>
                  <span className="yr-era">{eraLabel(parseInt(fFyFrom,10))}{fFyFrom!==""?"年度":""}</span>
                  <span>〜</span>
                  <input type="number" placeholder="指定なし" value={fFyTo} onChange={(e)=>setFFyTo(e.target.value)}/>
                  <span>年</span>
                  <select value={fFyToMonth} onChange={(e)=>setFFyToMonth(e.target.value)}>
                    <option value="">指定なし</option>
                    {Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")).map((m)=>(
