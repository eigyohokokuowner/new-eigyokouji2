<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>社員 有資格一覧</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1f2330; --muted:#5d6377; --line:#c9ced9; --line-dot:#d5d9e2;
    --emp-hd:#fbe5c0; --emp-hd2:#fdf1dc;
    --reg-hd:#d8ebf8; --reg-hd2:#eaf4fb;
    --qual-hd:#f9d6dc; --qual-hd2:#fce8eb; --qual-on:#fdecef;
    --filter-bg:#3b3f4a; --accent:#2f6fed;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:#f4f5f8;font-size:12px;}
  button,input,select{font-family:inherit;font-size:12px;}

  /* ---- login ---- */
  #login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06);}
  #login h1{font-size:18px;margin:0 0 4px;}
  #login p{color:var(--muted);margin:0 0 18px;}
  #login label{display:block;font-weight:700;margin:12px 0 4px;}
  #login input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;}
  #login button{width:100%;margin-top:18px;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
  #login button:disabled{opacity:.6;}
  .err{color:#c62828;margin-top:10px;min-height:1em;}

  /* ---- toolbar ---- */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .bar h1{font-size:15px;margin:0 8px 0 0;}
  .bar .meta{color:var(--muted);}
  .bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:200px;}
  .bar select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;}
  .btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .spacer{flex:1;}
  .chk{display:flex;align-items:center;gap:4px;}

  /* ---- table ---- */
  #app:not([hidden]){display:flex;flex-direction:column;height:100vh;}
  .bar{flex:0 0 auto;}
  .table-wrap{overflow:auto;flex:1 1 auto;min-height:0;background:#fff;}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  th,td{border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;}
  td{border-bottom:1px dotted var(--line-dot);height:20px;text-align:center;}
  td.l{text-align:left;}
  th{font-weight:700;text-align:center;line-height:1.25;position:sticky;z-index:10;}
  tr.h1 th{top:0;height:24px;}
  tr.h2 th{top:24px;height:34px;}
  tr.h3 th{top:58px;height:20px;font-weight:600;}
  tr.h4 th{top:78px;height:20px;padding:0;background:var(--filter-bg)!important;}
  th.emp{background:var(--emp-hd);} tr.h2 th.emp,tr.h3 th.emp{background:var(--emp-hd2);}
  th.reg{background:var(--reg-hd);} tr.h2 th.reg,tr.h3 th.reg{background:var(--reg-hd2);}
  th.qual{background:var(--qual-hd);} tr.h2 th.qual,tr.h3 th.qual{background:var(--qual-hd2);}
  tr.h1 th, tr.h2 th, tr.h3 th{border-bottom:1px solid var(--line);}
  th.grp-start, td.grp-start{border-left:2px solid #8a90a0;}
  td.on{background:var(--qual-on);}
  td.reg-on{background:#eef6fc;}
  tbody tr:hover td{background:#fff8d6;}
  tr.retired td{color:#9a9fae;}
  .sticky-l{position:sticky;z-index:5;background:#fff;}
  th.sticky-l{z-index:20;}
  .order-bar{display:none;align-items:center;gap:8px;padding:8px 14px;background:#fff7d6;border-bottom:1px solid #ecd27a;}
  .editing-order .order-bar{display:flex;}
  .editing-order tbody tr{cursor:grab;}
  tbody tr.dragging td{opacity:.35;}
  tbody tr.drop-before td{box-shadow:inset 0 2px 0 #2f6fed;}
  tbody tr.drop-after td{box-shadow:inset 0 -2px 0 #2f6fed;}
  tbody tr.moved td{background:#fff3b0!important;}
  .code-edit{display:flex;align-items:center;gap:3px;justify-content:space-between;}
  .code-edit .grip{color:#8a90a0;cursor:grab;font-size:13px;}
  .code-edit button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 4px;line-height:15px;font-size:10px;cursor:pointer;}
  .code-edit button:hover{border-color:var(--accent);color:var(--accent);}
  /* ---- タブ切り替え ---- */
  .tabsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .tabsw button{border:none;background:#fff;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted);}
  .tabsw button+button{border-left:1px solid var(--line);}
  .tabsw button.on{background:var(--accent);color:#fff;}
  #app.tab-struct .t1{display:none!important;}
  #app.tab-struct .order-bar{display:none!important;}
  /* ---- 技術者構成・推移 ---- */
  .struct{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 18px 40px;}
  .subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subnav button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted);}
  .subnav button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .subnav button:disabled{cursor:default;opacity:.55;}
  .subnav .soon{font-size:10px;margin-left:4px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 4px;}
  .card .desc{color:var(--muted);margin:0 0 12px;line-height:1.6;}
  .grid-tbl{border-collapse:collapse;font-size:12px;}
  .grid-tbl th,.grid-tbl td{border:1px solid var(--line);padding:5px 9px;white-space:nowrap;text-align:left;}
  .grid-tbl th{background:#f1f3f8;font-weight:700;}
  .grid-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;}
  .grid-tbl td.c{text-align:center;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;}
  .pill.ok{background:#e6f6ec;color:#1e7b3c;}
  .pill.warn{background:#fff3cd;color:#8a5a00;}
  .pill.ng{background:#fde7e9;color:#b3261e;}
  .imp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;}
  .imp-row input[type=number]{width:70px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;}
  .imp-row select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;}
  .muted{color:var(--muted);}
  .err-msg{color:#b3261e;font-weight:600;}
  details.diff{margin-top:6px;}
  details.diff summary{cursor:pointer;font-weight:600;}
  details.diff ul{margin:6px 0 4px;padding-left:20px;line-height:1.7;}
  /* ---- 現状：年齢構成図 ---- */
  .now-filters{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;}
  .now-filters label{display:flex;align-items:center;gap:4px;}
  .now-filters .grp{display:flex;align-items:center;gap:8px;}
  .now-filters .grp>b{font-size:11.5px;color:var(--muted);}
  .now-filters select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .tile .k{font-size:11.5px;color:var(--muted);font-weight:600;}
  .tile .v{font-size:26px;font-weight:800;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums;}
  .tile .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;}
  .tile .s{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 10px;font-size:12px;color:var(--ink);}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;}
  .pyr{display:grid;grid-template-columns:1fr 64px 1.4fr;row-gap:3px;align-items:center;font-size:11.5px;}
  .pyr .hd{font-weight:700;color:var(--muted);padding-bottom:4px;}
  .pyr .hd.l{text-align:right;padding-right:6px;} .pyr .hd.r{padding-left:6px;}
  .pyr .age{text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pyr .side{display:flex;align-items:center;height:18px;gap:6px;}
  .pyr .side.l{flex-direction:row-reverse;}
  .pyr .pbar{display:flex;gap:2px;height:100%;}
  .pyr .side.l .pbar{flex-direction:row-reverse;}
  .pyr .seg{height:100%;min-width:3px;}
  .pyr .side.r .pbar .seg:last-child{border-radius:0 4px 4px 0;}
  .pyr .side.l .pbar .seg:last-child{border-radius:4px 0 0 4px;}
  .pyr .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;}
  .pyr .line{grid-column:1 / -1;border-top:2px dashed #b3261e;position:relative;height:0;margin:2px 0;}
  .pyr .line span{position:absolute;right:0;top:-9px;background:#fff;color:#b3261e;font-size:10.5px;font-weight:700;padding:0 4px;}
  .lc{width:100%;max-width:900px;height:auto;display:block;}
  .lc .grid line{stroke:#e6e8ee;stroke-width:1;}
  .lc .axis text{fill:#5d6377;font-size:11px;}
  .lc .hit{fill:transparent;cursor:default;}
  .sig-bad{color:#c0392b;font-weight:700;} .sig-bad2{color:#c0392b;} .sig-good{color:#1a7f4e;font-weight:700;} .sig-good2{color:#1a7f4e;}
  .note-box{background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);line-height:1.6;margin-top:8px;}
  .flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:6px 0 4px;}
  .flow .f{border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:92px;text-align:center;background:#fff;}
  .flow .f .k{font-size:11px;color:var(--muted);}
  .flow .f .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .flow .op{align-self:center;font-weight:800;color:var(--muted);}
  .sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 18px;}
  .sim-grp h4{font-size:12.5px;margin:0 0 6px;}
  .sim-in{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px;}
  .sim-in span.l{flex:1;}
  .sim-in input[type=number]{width:64px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;text-align:right;}
  .sim-in select{padding:3px 4px;border:1px solid var(--line);border-radius:5px;}
  .src{font-size:10px;font-weight:700;padding:0 6px;border-radius:999px;white-space:nowrap;}
  .src.act{background:#e6f6ec;color:#1e7b3c;} .src.tmp{background:#fff3cd;color:#8a5a00;} .src.calc{background:#e8efff;color:#2f55c4;}
  .verdict{font-size:14px;line-height:1.7;}
  .verdict b.ng{color:#b3261e;} .verdict b.ok{color:#1e7b3c;}
  #vizTip{position:fixed;z-index:200;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:8px 10px;font-size:12px;max-width:320px;display:none;line-height:1.55;}
  #vizTip b{font-size:12.5px;}
  #vizTip .nm{color:var(--muted);font-size:11.5px;}
  td.age-alert{color:#d32f2f;font-weight:700;}

  .fbtn{width:100%;height:20px;border:none;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;padding:0 4px;}
  .fbtn::after{content:"";display:inline-block;width:12px;height:12px;background:#fff;border-radius:2px;
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M2 4h8L6 9z"/></svg>') center/10px no-repeat;
            mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M2 4h8L6 9z"/></svg>') center/10px no-repeat;}
  .fbtn.active{background:#2f6fed;}
  .fbtn.active::after{-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M1 2h10L7 6.5V10L5 11V6.5z"/></svg>') center/10px no-repeat;
            mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M1 2h10L7 6.5V10L5 11V6.5z"/></svg>') center/10px no-repeat;}
  .fbtn.sorted{box-shadow:inset 0 -2px 0 #ffd54a;}

  /* ---- filter popover ---- */
  #pop{position:fixed;z-index:100;width:240px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:none;}
  #pop .sort{display:flex;gap:6px;margin-bottom:6px;}
  #pop .sort button{flex:1;}
  #pop input[type=search]{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;}
  #pop .list{max-height:260px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:4px;}
  #pop label{display:flex;align-items:center;gap:6px;padding:2px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #pop label:hover{background:#f1f5ff;}
  #pop .cnt{margin-left:auto;color:var(--muted);font-size:11px;}
  #pop .ft{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;}

  /* ---- unmatched panel ---- */
  #unmatchedDlg{border:1px solid var(--line);border-radius:10px;padding:18px;max-width:560px;width:90vw;}
  #unmatchedDlg h2{font-size:15px;margin:0 0 6px;}
  #unmatchedDlg p{color:var(--muted);margin:0 0 10px;}
  #unmatchedDlg ul{max-height:50vh;overflow:auto;margin:0;padding-left:18px;}
  .loading{padding:40px;text-align:center;color:var(--muted);}
  @media print{ .bar{display:none;} .table-wrap{height:auto;overflow:visible;} }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>社員 有資格一覧</h1>
  <p>工事実績システムと同じアカウントでログインしてください。</p>
  <label for="loginId">メールアドレス</label>
  <input id="loginId" type="email" autocomplete="username" />
  <label for="loginPw">パスワード</label>
  <input id="loginPw" type="password" autocomplete="current-password" />
  <button id="loginBtn">ログイン</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <h1>社員 有資格一覧</h1>
    <div class="tabsw">
      <button data-tab="list" class="on">有資格一覧</button>
      <button data-tab="struct">技術者構成・推移</button>
    </div>
    <span class="meta" id="metaText"></span>
    <input type="search" id="q" class="t1" placeholder="氏名・社員番号・所属で検索" />
    <select id="statusSel" class="t1">
      <option value="active">在職者のみ</option>
      <option value="all">退職者も含む</option>
    </select>
    <label class="chk t1"><input type="checkbox" id="extraChk" /> 詳細項目を表示</label>
    <label class="chk t1"><input type="checkbox" id="freezeChk" checked /> 社員番号〜氏名を固定</label>
    <button class="btn t1" id="clearBtn">絞り込みをすべて解除</button>
    <button class="btn t1" id="orderBtn" hidden>並び順を編集</button>
    <span class="spacer"></span>
    <button class="btn t1" id="unmatchedBtn">列に無い資格</button>
    <button class="btn" id="reloadBtn">最新データを再取得</button>
    <button class="btn primary t1" id="xlsxBtn">Excelで出力</button>
    <button class="btn" id="logoutBtn">ログアウト</button>
  </div>
  <div class="order-bar">
    <b>並び順の編集中</b>
    <span>行をドラッグするか、社員番号の横の ▲▼ で移動できます。</span>
    <span class="spacer"></span>
    <button class="btn" id="orderCancelBtn">キャンセル</button>
    <button class="btn primary" id="orderSaveBtn">この順で保存</button>
  </div>
  <div class="table-wrap t1" id="wrap"><div class="loading">データを読み込んでいます…</div></div>
  <div class="struct" id="struct" hidden></div>
</div>

<div id="pop"></div>
<div id="vizTip"></div>
<dialog id="unmatchedDlg">
  <h2>表の列に割り当てられていない資格</h2>
  <p>保有者がいるのに、どの資格列にも該当しなかった資格名です。必要なものはファイル内の <code>QUAL_COLUMNS</code> にルールを追加してください。</p>
  <ul id="unmatchedList"></ul>
  <div style="text-align:right;margin-top:12px"><button class="btn" onclick="this.closest('dialog').close()">閉じる</button></div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =====================================================================
   Firebase設定（新営業工事実績システム２と同じプロジェクト）
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyA3FGgHfsjb1a046IJPs5rQmDTOyT90I-Q",
  authDomain: "new-eigyokouji2.firebaseapp.com",
  projectId: "new-eigyokouji2",
  storageBucket: "new-eigyokouji2.firebasestorage.app",
  messagingSenderId: "337410034328",
  appId: "1:337410034328:web:5a25fe550b8692dc371eed"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =====================================================================
   文字列ヘルパー
   ===================================================================== */
// 全角英数→半角、全角括弧→半角、空白除去（資格名の表記ゆれ吸収用）
function N(s){
  return String(s||"")
    .replace(/[０-９Ａ-Ｚａ-ｚ]/g,(c)=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/（/g,"(").replace(/）/g,")")
    .replace(/[\s　]/g,"");
}
const KANJI_NUM={"一":1,"二":2,"三":3,"四":4};
// 「1級」「(1級)」「一級」などから級（数値）を取り出す
function gradeOf(n){
  const m=n.match(/([1-4一二三四])級/);
  if(!m) return null;
  return KANJI_NUM[m[1]] || parseInt(m[1],10);
}
// 「第2種」「第二種」などから「第2種」を返す
function shuOf(n){
  const m=n.match(/第?([1-3一二三])種/);
  if(!m) return null;
  return "第"+(KANJI_NUM[m[1]] || m[1])+"種";
}
const isOn=(v)=> v!==undefined && v!==null && v!=="" && String(parseFloat(v))==="1";
const normLicCode=(v)=>{ const s=String(v||"").trim(); return /^\d+$/.test(s) ? s.padStart(4,"0") : s; };

/* =====================================================================
   資格列の定義（ここを編集すると列の追加・並べ替え・判定ルールの変更ができます）
   - label  : 見出し（\n で2行）
   - match  : 資格マスタの資格名称(LICNM, 表記ゆれ吸収済み)が該当するか
   - value  : セルに表示する値（省略時は「○」）
   - pick   : "grade" のとき、複数該当したら一番上の級だけを表示
   - info   : 技術者情報(enginfo)から判定する場合の関数
   ===================================================================== */
const gradeLabel=(n)=>{ const g=gradeOf(n); return g ? g+"級"+(n.includes("補")?"補":"") : "○"; };
const QUAL_COLUMNS=[
  {key:"doboku1",   label:"1級土木",            match:(n)=>n.includes("土木施工管理技士") && !n.includes("技士補") && gradeOf(n)===1},
  {key:"doboku1ho", label:"1級土木\n技士補",     match:(n)=>n.includes("土木施工管理技士補") && gradeOf(n)===1},
  {key:"doboku2",   label:"2級土木",            match:(n)=>n.includes("土木施工管理技士") && !n.includes("技士補") && gradeOf(n)===2},

// まず資格名称から、無ければ「建設業法の資格区分」(KBN→コードマスタKGHO)の名称から探す
const BUMON_DISPLAY={"電気電子":"電気・電子","上下水道":"上下水道","総合技術監理":"総監"};
function bumonOf(text){
  const t=N(text);
  if(!t) return "";
  let m=t.match(/([^()・\/、]+?)部門/);
  let b=m ? m[1] : "";
  if(!b){ m=t.match(/技術士補?\(([^()]+?)[・)]/); b=m ? m[1] : ""; }   // 技術士(建設・総合技術監理(建設)) 形式
  b=b.replace(/^技術士補?/,"").replace(/^\(/,"").trim();
  if(!b || /級|試験|登録/.test(b)) return "";
  return BUMON_DISPLAY[b] || b;
}
function gijutsuBumon(n, ctx){
  return bumonOf(n) || (ctx && ctx.kbn && /技術士|部門/.test(ctx.kbn) ? bumonOf(ctx.kbn) : "") || "○";
}

// YYYYMMDD → 2025/6/1
function fmtYmd(v){
  const s=String(v||"").replace(/[^\d]/g,"");
  if(!/^\d{8}$/.test(s)) return "";
  return s.slice(0,4)+"/"+parseInt(s.slice(4,6),10)+"/"+parseInt(s.slice(6,8),10);
}
// 基準日（今日）時点の満年数
function fullYears(v){
  const s=String(v||"").replace(/[^\d]/g,"");
  if(!/^\d{8}$/.test(s)) return "";
  const t=new Date(), y=+s.slice(0,4), m=+s.slice(4,6), d=+s.slice(6,8);
  let n=t.getFullYear()-y;
  if(t.getMonth()+1<m || (t.getMonth()+1===m && t.getDate()<d)) n--;
  return n>=0 ? String(n) : "";
}

/* =====================================================================

   ===================================================================== */
const TYPES=["employee","englicense","licenses","enginfo","literals","assign"];
const CACHE_DB="qualViewerCache";
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(CACHE_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore("c");
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function cacheGet(){
  try{ const d=await idb(); return await new Promise((res)=>{ const q=d.transaction("c").objectStore("c").get("all"); q.onsuccess=()=>res(q.result||{}); q.onerror=()=>res({}); }); }
  catch(e){ return {}; }
}
async function cacheSet(v){
  try{ const d=await idb(); d.transaction("c","readwrite").objectStore("c").put(v,"all"); }catch(e){}
}
async function loadData(force){
  const cache=force ? {} : await cacheGet();
  const next={...cache};
  const out={}; let latest=0;
  for(const type of TYPES){
    let ms=null;
    try{
      const m=await getDoc(doc(db,"meta",type));
      if(m.exists()){ const ts=m.data().updatedAt; ms=typeof ts==="number" ? ts : (ts && ts.toMillis ? ts.toMillis() : null); }
    }catch(e){}
    if(ms) latest=Math.max(latest,ms);
    const c=cache[type];
    if(c && ms!==null && c.updatedAtMs===ms){ out[type]=c.records; continue; }
    try{
      const snap=await getDocs(collection(db,type));
      const recs=[]; snap.forEach((d)=>recs.push(d.data()));
      out[type]=recs; next[type]={records:recs, updatedAtMs:ms};
    }catch(e){ console.error(type,"の読み込みに失敗",e); out[type]=[]; }
  }
  cacheSet(next);
  return {data:out, latest};
}

let ROWS=[], UNMATCHED=[], EMPLOYEES=[], HELD_BY_ENGCD={}, INFO_BY_ENGCD={}, ASSIGN=[];
function buildRows(data){
  EMPLOYEES=data.employee||[];
  ASSIGN=data.assign||[];
  const licName={};
  (data.licenses||[]).forEach((l)=>{ licName[normLicCode(l.LICCD)]=l.LICNM||""; });
  const infoMap={};
  (data.enginfo||[]).forEach((r)=>{ infoMap[String(r.ENGCD)]=r; });
  const kgho={};
  (data.literals||[]).filter((l)=>l.CDTYP==="KGHO").forEach((l)=>{ kgho[normCode(l.LTLCD)]=l.LTLNM||""; });
  const held={};
  (data.englicense||[]).forEach((r)=>{
    const k=String(r.ENGCD);
    const kbn=(r.KBN!==undefined && r.KBN!==null && r.KBN!=="") ? (kgho[normCode(r.KBN)]||"") : "";
    (held[k] ||= []).push({name:licName[normLicCode(r.LICCD)] || "", kbn, sday:String(r.SDAY||"").replace(/[^\d]/g,"")});
  });
  HELD_BY_ENGCD=held; INFO_BY_ENGCD=infoMap;

  const unmatched={};
  ROWS=(data.employee||[]).map((e)=>{
    const engcd=String(e.ENGCD||"");
    // 所属：通常は DEPT（部署）と POSITION（役職）。両方空のときは、工事実績システムと同じく
    // COMPCD（「新規社員を登録」の所属欄。例「鉄構本部 / 相談役」）を使う
    let deptText=String(e.DEPT||"").trim(), posText=String(e.POSITION||"").trim();
    const comp=String(e.COMPCD||"").trim();
    if(!deptText && !posText && comp && !/^\d+$/.test(comp)){
      const ps=comp.split(/[\/／]/);
      deptText=ps[0].trim();
      posText=ps.slice(1).join("/").trim();
    }
    const parts=deptText.split(/[\s　]+/).filter(Boolean);
    // 役職が空で、所属の最後の区切りが役職名（室長(TL待遇)・課長 など）なら、それを役職に回す
    let pos=posText;
    if(!pos && parts.length>1 && isPositionText(parts[parts.length-1])) pos=parts.pop();
    const row={
      code:currentEmpNo(e), engcd, allNos:allEmpNos(e).join(" "), retired:e.STATUS==="retired",
      dept0:parts[0]||"", dept1:parts[1]||"", dept2:parts[2]||"", dept3:parts[3]||"",
      dept4:parts.slice(4).join(" "),
      pos, name:e.ID_NAME||"", fullDept:deptText,
    };
    const inf=infoMap[engcd]||{};
    row.hrDate=fmtYmd(e.HR_DATE);
    row.constKbn=e.CONST_KBN||"";
    row.workplace=e.WORKPLACE||"";
    row.empType=e.EMP_TYPE||"";
    row.officeTech=e.OFFICE_TECH ? "専任技術者" : "";
    row.kana=inf.FURI||"";
    const nct=e.NAME_CHANGE_TYPE || (e.OLD_NAME ? "旧姓" : (e.NEW_NAME ? "新姓" : ""));
    const ncn=e.NAME_CHANGE || e.OLD_NAME || e.NEW_NAME || "";
    row.nameChg= nct && ncn ? nct+"："+ncn : "";
    row.age=fullYears(inf.BDAY);
    row.years=fullYears(inf.NDAY);
    row.bday=fmtYmd(inf.BDAY);
    row.nday=fmtYmd(inf.NDAY);
    REG_COLUMNS.forEach((c)=>{ row[c.key]=isOn(e[c.key]) ? "○" : ""; });

    const heldList=(held[engcd]||[]).filter((h)=>h.name);
    const names=heldList.map((h)=>h.name);
    const info=infoMap[engcd]||{};
    const hit=new Set();
    QUAL_COLUMNS.forEach((col)=>{
      const vals=[];
      heldList.forEach(({name:raw, kbn})=>{
        const n=N(raw);
        if(col.match && col.match(n)){ hit.add(raw); vals.push(col.value ? col.value(n, {kbn:N(kbn)}) : "○"); }
      });
      if(col.info){ const v=col.info(info); if(v) vals.push(v); }
      row[col.key]=combine(vals, col.pick);
    });
    // 土木施工管理技士の上位資格を優先して表示する（下位の○は消す）
    //  ・1級土木があれば、1級技士補・2級土木・2級技士補は表示しない
    //  ・2級土木があれば、2級技士補は表示しない
    //  ・1級技士補と2級土木、1級技士補と2級技士補は両方表示する
    if(row.doboku1){ row.doboku1ho=""; row.doboku2=""; row.doboku2ho=""; }
    else if(row.doboku2){ row.doboku2ho=""; }
    if(!row.retired) names.forEach((raw)=>{ if(!hit.has(raw)) unmatched[raw]=(unmatched[raw]||0)+1; });
    return row;
  });
  UNMATCHED=Object.entries(unmatched).sort((a,b)=>b[1]-a[1]);
}
function combine(vals, pick){
  let u=[...new Set(vals.filter(Boolean))];
  if(u.length>1) u=u.filter((v)=>v!=="○");
  if(pick==="grade" && u.length>1){
    const g=(v)=>{ const m=String(v).match(/^(\d)級/); return m ? parseInt(m[1],10) : 9; };
    u.sort((a,b)=>g(a)-g(b));
    return u[0];
  }
  return u.join("、");
}

function rowsByStatus(){ return ROWS.filter((r)=> state.status==="all" || !r.retired); }
function passes(r, exceptKey){
  if(state.q){
    const q=state.q.replace(/[\s　]/g,"");
    const hay=(r.allNos+r.name+r.kana+r.nameChg+r.fullDept+r.pos+r.workplace).replace(/[\s　]/g,"");
    if(!hay.includes(q)) return false;
  }
  for(const [k,set] of Object.entries(state.filters)){
    if(k===exceptKey || !set) continue;
    const v=cellVal(r,k)||BLANK;
    if(!set.has(v)) return false;
  }
  return true;
}
function visibleRows(){
  const list=rowsByStatus().filter((r)=>passes(r));
  const {key,dir}=state.sort;
  const num=(v)=>/^\d+$/.test(v);
  if(key==="__default"){
    const idx=(r)=>{ return orderIdx(r); };
    list.sort((a,b)=> (idx(a)-idx(b)) || cellVal(a,"code").localeCompare(cellVal(b,"code"),"ja",{numeric:true}));
    return list;
  }
  list.sort((a,b)=>{
    const va=cellVal(a,key), vb=cellVal(b,key);
    if(va===vb) return cellVal(a,"code").localeCompare(cellVal(b,"code"),"ja",{numeric:true});
    if(!va) return 1; if(!vb) return -1;              // 空白は常に下
    if(num(va)&&num(vb)) return (parseInt(va,10)-parseInt(vb,10))*dir;
    return va.localeCompare(vb,"ja",{numeric:true})*dir;
  });
  return list;
}

  empCols.forEach((c)=>{ lefts[c.key]=acc; acc+=c.w; });
  const stick=(c)=> frozen.has(c.key) ? ` sticky-l" style="left:${lefts[c.key]}px` : "";
  const cnt=(k)=> rows.filter((r)=>cellVal(r,k)).length;
  const firstReg=cols.findIndex((c)=>c.grp==="reg"), firstQual=cols.findIndex((c)=>c.grp==="qual");
  const gs=(i)=> (i===firstReg||i===firstQual) ? " grp-start" : "";
  const lbl=(c)=> esc(c.label).replace(/\n/g,"<br>");

  const totalW=cols.reduce((s,c)=>s+c.w,0);
  let h=`<table style="width:${totalW}px"><colgroup>`;
  cols.forEach((c)=>{ h+=`<col style="width:${c.w}px">`; });
  h+=`</colgroup><thead>`;
  // 1段目
  const nFz=frozen.size, nRest=empCols.length-nFz;
  h+=`<tr class="h1">`;
  if(nFz) h+=`<th class="emp sticky-l" style="left:0" colspan="${nFz}">社員情報　（${rows.length}人）</th>`;
  if(nRest) h+=`<th class="emp" colspan="${nRest}">${nFz?"":"社員情報　（"+rows.length+"人）"}</th>`;
  h+=`<th class="reg grp-start" colspan="${nReg}">登録情報</th><th class="qual grp-start" colspan="${nQual}">有資格一覧</th></tr>`;
  // 2段目
  h+=`<tr class="h2">`;
  cols.forEach((c,i)=>{
    if(c.grp==="emp"){
      if(c.dept){
        if(c.key==="dept0") h+=`<th class="emp${stick(c)}" colspan="${empCols.filter((x)=>x.dept).length}">所属部署</th>`;
        return;
      }
      h+=`<th class="emp${stick(c)}" rowspan="2">${lbl(c)}</th>`;
    } else {
      h+=`<th class="${c.grp}${gs(i)}">${lbl(c)}</th>`;
    }
  });
  h+=`</tr>`;
  // 3段目
  h+=`<tr class="h3">`;
  cols.forEach((c,i)=>{
    if(c.grp==="emp"){ if(c.dept) h+=`<th class="emp${stick(c)}">${lbl(c)}</th>`; return; }
    h+=`<th class="${c.grp}${gs(i)}">${cnt(c.key)}人</th>`;
  });
  h+=`</tr>`;
  // 4段目（フィルターボタン）
  h+=`<tr class="h4">`;
  cols.forEach((c,i)=>{
    const active=!!state.filters[c.key];
    const sorted=state.sort.key===c.key;
    h+=`<th class="${c.grp}${gs(i)}${stick(c)}"><button class="fbtn${active?" active":""}${sorted?" sorted":""}" data-k="${c.key}" title="${esc(c.label.replace(/\n/g,""))}で絞り込み・並べ替え"></button></th>`;
  });
  h+=`</tr></thead><tbody>`;
  // 本体
  rows.forEach((r)=>{
    const ed=state.editOrder;
    h+=`<tr class="${r.retired?"retired":""}${ed&&state.lastMoved===r.engcd?" moved":""}"${ed?` draggable="true" data-code="${esc(r.engcd)}"`:""}>`;
    cols.forEach((c,i)=>{
      const v=cellVal(r,c.key), t=disp(c,v);
      let cls=(c.align==="c"?"":"l")+gs(i);
      if(v && c.grp==="qual") cls+=" on";
      if(v && c.grp==="reg") cls+=" reg-on";
      if(c.key==="age" && v && parseInt(v,10)>=AGE_ALERT) cls+=" age-alert";
      if(ed && c.key==="code"){
        h+=`<td class="${cls}${stick(c)}"><span class="code-edit"><span class="grip">⠿</span>${esc(t)}<span><button data-mv="up" title="1つ上へ">▲</button> <button data-mv="down" title="1つ下へ">▼</button></span></span></td>`;
        return;
      }
      h+=`<td class="${cls}${stick(c)}" title="${esc(t)}">${esc(t)}</td>`;
    });
    h+=`</tr>`;
  });
  if(!rows.length) h+=`<tr><td colspan="${cols.length}" class="l" style="padding:16px;color:#888">該当する社員がいません</td></tr>`;
  h+=`</tbody></table>`;
  const sl=wrapEl.scrollLeft, st=wrapEl.scrollTop;
  wrapEl.innerHTML=h;
  wrapEl.scrollLeft=sl; wrapEl.scrollTop=st;
}

function openPop(key, rect){
  popKey=key;
  const col=ALL_COLS.find((c)=>c.key===key);
  // 他の列の絞り込みを反映した上での候補値
  const base=rowsByStatus().filter((r)=>passes(r,key));
  const counts=new Map();
  base.forEach((r)=>{ const v=cellVal(r,key)||BLANK; counts.set(v,(counts.get(v)||0)+1); });
  const values=[...counts.keys()].sort((a,b)=> a===BLANK?1 : b===BLANK?-1 : a.localeCompare(b,"ja",{numeric:true}));
  const cur=state.filters[key];
  pop.innerHTML=
    `<div style="font-weight:700;margin-bottom:6px">${esc(col.label.replace(/\n/g,""))}</div>`+
    (state.editOrder ? "" : `<div class="sort"><button class="btn" data-s="1">昇順 ↑</button><button class="btn" data-s="-1">降順 ↓</button></div>`)+
    `<input type="search" placeholder="値を検索">`+
    `<div class="list"><label><input type="checkbox" class="all"> <b>(すべて選択)</b></label>`+
    values.map((v)=>`<label data-v="${esc(v===BLANK?v:disp(col,v))}"><input type="checkbox" value="${esc(v)}" ${!cur||cur.has(v)?"checked":""}> ${esc(v===BLANK?v:disp(col,v))}<span class="cnt">${counts.get(v)}</span></label>`).join("")+
    `</div><div class="ft"><button class="btn" data-a="clear">解除</button><button class="btn primary" data-a="ok">OK</button></div>`;
  const allBox=pop.querySelector(".all");
  const boxes=()=>[...pop.querySelectorAll(".list label[data-v]")].filter((l)=>l.style.display!=="none").map((l)=>l.querySelector("input"));
  const syncAll=()=>{ const b=boxes(); allBox.checked=b.length>0 && b.every((x)=>x.checked); };
  syncAll();
  allBox.onchange=()=>boxes().forEach((x)=>x.checked=allBox.checked);
  pop.querySelectorAll(".list label[data-v] input").forEach((x)=>x.onchange=syncAll);
  pop.querySelector("input[type=search]").oninput=(e)=>{
    const t=e.target.value.trim();
    pop.querySelectorAll(".list label[data-v]").forEach((l)=>{ const hit=!t||l.dataset.v.includes(t); l.style.display=hit?"":"none"; l.querySelector("input").checked=hit; });
    syncAll();
  };
  pop.querySelectorAll("[data-s]").forEach((b)=>b.onclick=()=>{ state.sort={key, dir:parseInt(b.dataset.s,10)}; closePop(); render(); });
  pop.querySelector("[data-a=clear]").onclick=()=>{ delete state.filters[key]; closePop(); render(); };
  pop.querySelector("[data-a=ok]").onclick=()=>{
    const all=[...pop.querySelectorAll(".list label[data-v] input")];
    const checked=all.filter((x)=>x.checked && x.closest("label").style.display!=="none").map((x)=>x.value);
    if(checked.length===all.length) delete state.filters[key];
    else state.filters[key]=new Set(checked);
    closePop(); render();
  };
  pop.style.display="block";
  const left=Math.min(rect.left, window.innerWidth-250);
  pop.style.left=Math.max(4,left)+"px";
  pop.style.top=Math.min(rect.bottom+2, window.innerHeight-pop.offsetHeight-4)+"px";
}

// code を target の前(before=true)／後ろに移動
function moveCode(code, target, before){
  if(!code || !target || code===target) return;
  const list=fullOrder().filter((c)=>c!==code);
  let i=list.indexOf(target); if(i<0) return;
  if(!before) i++;
  list.splice(i,0,code);
  setOrder(list); state.lastMoved=code; render();
}

  const tr=e.target.closest && e.target.closest("tr[data-code]"); if(!tr) return;
  dragCode=tr.dataset.code; tr.classList.add("dragging");
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragCode);
});
const clearDrop=()=>wrapEl.querySelectorAll(".drop-before,.drop-after").forEach((x)=>x.classList.remove("drop-before","drop-after"));

  if(!dragCode) return;
  const tr=e.target.closest("tr[data-code]"); if(!tr) return;
  e.preventDefault();
  const r=tr.getBoundingClientRect(), before=e.clientY < r.top+r.height/2;
  clearDrop(); tr.classList.add(before?"drop-before":"drop-after");
  // 上下端に近づいたら自動スクロール
  const w=wrapEl.getBoundingClientRect();
  if(e.clientY < w.top+120) wrapEl.scrollTop-=12; else if(e.clientY > w.bottom-40) wrapEl.scrollTop+=12;
});

  const tr=e.target.closest("tr[data-code]"); if(!tr||!dragCode) return;
  e.preventDefault();
  const r=tr.getBoundingClientRect(), before=e.clientY < r.top+r.height/2;
  const c=dragCode; dragCode=null; clearDrop();
  moveCode(c, tr.dataset.code, before);
});

/* ---- 在籍リスト（Excel）の読み取り ---- */
async function parseRosterFile(file){
  const wb=XLSX.read(await file.arrayBuffer(), {type:"array"});
  const sheetName=wb.SheetNames[0];
  const grid=XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:false, defval:""});
  let h=-1, ci={};
  for(let i=0;i<Math.min(grid.length,10);i++){
    const row=(grid[i]||[]).map((c)=>String(c||"").trim());
    const no=row.findIndex((c)=>c.includes("社員番号")||c.includes("社員No")||c==="コード");
    const nm=row.findIndex((c)=>c.includes("氏名"));
    if(no>=0 && nm>=0){ h=i; ci={no, nm, cls:row.findIndex((c)=>c.includes("分類")||c.includes("建設業区分"))}; break; }
  }
  if(h<0) throw new Error("見出し行（社員番号・氏名）が見つかりません");
  const rows=[];
  for(let r=h+1;r<grid.length;r++){
    const g=grid[r]||[];
    let no=String(g[ci.no]||"").trim();
    if(!no) continue;
    if(/^\d+$/.test(no)) no=no.padStart(6,"0");
    const rawCls=ci.cls>=0 ? String(g[ci.cls]||"").trim() : "";
    // 分類に付いている「★」などの印は使わないので取り除く
    rows.push({no, name:String(g[ci.nm]||"").trim(), cls:rawCls.replace(/[★☆]/g,"").trim()});
  }
  const m=(sheetName+" "+file.name).match(/(\d{2,3})\s*期/);
  return {rows, sheetName, fileName:file.name, hasCls:ci.cls>=0, period: m ? parseInt(m[1],10) : currentPeriod()-1};
}

/* ---- 社員データとの照合：①番号（技術者コード・現在/過去の社員番号）→ ②氏名 ---- */
// 番号で一致した社員の氏名が、名簿の氏名と同じ人か（旧姓・新姓で姓だけ違う場合も同じ人とみなす）
function sameNameAs(e, row){
  const a=normPersonName(row.name), b=normPersonName(e.ID_NAME);
  if(!a || a===b) return true;
  const parts=(n)=> String(n||"").normalize("NFKC").trim().split(/[\s\u3000]+/).map(normPersonName);
  const [rs,rg]=parts(row.name), [es,eg]=parts(e.ID_NAME);
  const others=[e.NAME_CHANGE,e.OLD_NAME,e.NEW_NAME].map(normPersonName).filter(Boolean);
  return !!rg && rg===eg && (others.includes(rs) || rs===es);
}
// 照合用の索引（番号→社員、氏名→社員）と、行ごとの照合結果のキャッシュ。社員データを読み直すと作り直す。
let EMP_IDX=null, EMP_IDX_SRC=null;
function empIdx(){
  if(EMP_IDX && EMP_IDX_SRC===EMPLOYEES) return EMP_IDX;
  const byNo=new Map(), byName=new Map(), push=(m,k,e)=>{ if(!k) return; const a=m.get(k); if(a) a.push(e); else m.set(k,[e]); };
  EMPLOYEES.forEach((e)=>{ allEmpNos(e).forEach((n)=>push(byNo,normCode(n),e)); push(byName,normPersonName(e.ID_NAME),e); });
  EMP_IDX={byNo, byName, cache:new WeakMap()}; EMP_IDX_SRC=EMPLOYEES;
  return EMP_IDX;
}
function matchRosterRow(row){
  const idx=empIdx(), hit=idx.cache.get(row);
  if(hit) return hit;
  const res=matchRosterRowCalc(row, idx);
  idx.cache.set(row,res);
  return res;
}
function matchRosterRowCalc(row, idx){
  // skipNo：「別の人」と確認した行（昔の番号が別の人に使い回されている）は、番号では照合せず氏名だけで照合する
  const byNo=row.skipNo ? [] : (idx.byNo.get(normCode(row.no))||[]);
  // 番号が一致しても氏名が違う場合は「番号・氏名違い」（昔の番号が別の人に使い回されていないか要確認）
  const byNoResult=(e)=>({engcd:String(e.ENGCD), how: sameNameAs(e,row) ? "番号" : "番号・氏名違い"});
  if(byNo.length===1) return byNoResult(byNo[0]);
  if(byNo.length>1){
    const exact=byNo.find((e)=>normCode(e.ENGCD)===normCode(row.no));
    if(exact) return byNoResult(exact);
  }
  const key=normPersonName(row.name);
  const byName=key ? (idx.byName.get(key)||[]) : [];
  if(byName.length===1) return {engcd:String(byName[0].ENGCD), how:"氏名"};
  if(byName.length>1) return {engcd:"", how:"同姓同名"};
  return {engcd:"", how:"なし"};
}
const empByEngcd=(c)=> EMPLOYEES.find((e)=>String(e.ENGCD)===String(c));
/* ---- 分類なしの期（在籍リストに分類の列が無い期）：分類は後の期から補う ----
   同じ人が後の期（分類がある期）にいれば、一番近い後の期の分類を使う。後の期にいない人は「不明」＝1級候補に含める扱い。 */
let CLSFILL_CACHE=null; // 1回の画面表示の間だけ使う索引（renderStruct の先頭で作り直す）
function clsFillIndex(){
  if(CLSFILL_CACHE) return CLSFILL_CACHE;
  CLSFILL_CACHE=S2.rosters.filter((x)=>!x.noCls).map((x)=>{ const m=new Map(); x.rows.forEach((r)=>{ const e=resolveEngcd(r); if(e) m.set(e, r.cls||""); }); return {period:x.period, m}; });
  return CLSFILL_CACHE;
}
// 戻り値 {cls, fill}：fill＝""（その期の分類）／"later"（後の期から補った）／"unknown"（補えない＝cls は null）
function effCls(r, roster, engcd){
  if(!roster.noCls) return {cls:r.cls||"", fill:""};
  if(engcd) for(const x of clsFillIndex()) if(x.period>roster.period && x.m.has(engcd)) return {cls:x.m.get(engcd), fill:"later"};
  return {cls:null, fill:"unknown"};
}
const clsShow=(p)=> p.clsFill==="unknown" ? "不明（分類なしの期）" : p.clsFill==="later" ? clsLabel(p.cls)+"＊" : clsLabel(p.cls);
const empLabel=(e)=> e ? `${e.ID_NAME||""}（社員番号 ${currentEmpNo(e)}${normCode(currentEmpNo(e))!==normCode(e.ENGCD)?"／技術者 "+e.ENGCD:""}${e.STATUS==="retired"?"・退職":""}）` : "";

/* ---- 期どうしの比較（同じ人＝紐付けた技術者コード、無ければ社員番号で判定） ---- */
const personKey=(r)=>{ const e=resolveEngcd(r); return e ? "e:"+e : "n:"+normCode(r.no); };
function diffRosters(prev, cur){
  const pm=new Map(prev.rows.map((r)=>[personKey(r),r])), cm=new Map(cur.rows.map((r)=>[personKey(r),r]));
  const left=prev.rows.filter((r)=>!cm.has(personKey(r)));
  const joined=cur.rows.filter((r)=>!pm.has(personKey(r)));
  const clsChanged=[], noChanged=[];
  cur.rows.forEach((r)=>{
    const p=pm.get(personKey(r)); if(!p) return;
    if((p.cls||"")!==(r.cls||"")) clsChanged.push({p,r});
    if(normCode(p.no)!==normCode(r.no)) noChanged.push({p,r});
  });
  return {left, joined, clsChanged, noChanged};
}
const clsCounts=(rows)=>{ const c={}; rows.forEach((r)=>{ c[r.cls||""]=(c[r.cls||""]||0)+1; }); return c; };

/* =====================================================================
   現状：年齢構成図と段階別の人数
   ・母集団：選んだ期末名簿に載っている全社員。年齢・資格はその期末（9/30）時点で判定。
   ・技術者＝1級土木施工管理技士。取得日が不明な資格は「その時点で保有」とみなす。
   ・1級を持っていない人は、対象の分類（初期値：イロハ）の人だけ段階に分け、それ以外は「対象外」。
   ===================================================================== */
const STAGES=[ // 段階ごとに色相を変えて、ひと目で区別できるようにする（dataviz の検証済み：隣どうしの色覚差OK）
  {k:"s5", label:"1級技術者",              color:"#2a78d6"}, // 青
  {k:"s4", label:"二次受検資格あり",        color:"#eb6834"}, // オレンジ
  {k:"s3", label:"技士補・実務経験中",      color:"#1baf7a"}, // 緑
  {k:"s2", label:"一次受検可能",            color:"#eda100"}, // 黄（次の一次検定の受検年度末に19歳以上）
  {k:"s1", label:"受検前（次の一次はまだ受検できない）", color:"#e87ba4"}, // ピンク
  {k:"out",label:"対象外（分類・個人指定）",  color:"#d4d3cd"}, // 灰
];
const STAGE_BY_KEY=Object.fromEntries(STAGES.map((x)=>[x.k,x]));
const qualCol=(key)=> QUAL_COLUMNS.find((c)=>c.key===key);
// 満年数（from〜to、どちらもYYYYMMDD）
function yearsBetween(from, to){
  if(!/^\d{8}$/.test(from||"") || !/^\d{8}$/.test(to||"")) return null;
  let n=+to.slice(0,4)-+from.slice(0,4);
  if(to.slice(4)<from.slice(4)) n--;
  return n;
}
// 指定日時点で保有している資格（取得日不明は保有扱い）。最も早い取得日も返す。
function heldAt(lics, matchKey, d){
  const col=qualCol(matchKey);
  const hits=lics.filter((l)=> col.match(N(l.name)) && (!l.sday || l.sday<=d));
  if(!hits.length) return null;
  const known=hits.map((l)=>l.sday).filter((x)=>/^\d{8}$/.test(x)).sort();
  return {sday: known[0]||"", unknown: !known.length};
}
// 名簿の行がどの社員に当たるか：手動で選んだ紐付けはそのまま、それ以外は「今の」社員データで照合し直す
// （取り込んだ後に工事実績システムで番号の履歴などを登録した場合も、正しい社員に紐付くように）
function resolveEngcd(r){
  if(r.how==="手動") return r.engcd||"";
  const m=matchRosterRow(r);
  return m.engcd || r.engcd || "";
}
// 1級候補の個人指定（期ごと）：その期に指定が無ければ、それより前の一番新しい期の指定を引き継ぐ。
// 一番古い指定より前の期には、一番古い指定を使う。
function candPeriods(){
  const c=S2.cand;
  if(c.legacy && Object.keys(c.legacy).length && !Object.keys(c.byPeriod).length && S2.rosters.length){
    c.byPeriod={[String(S2.rosters[S2.rosters.length-1].period)]: c.legacy}; c.legacy=null; c.migrated=true;
  }
  return Object.keys(c.byPeriod).map(Number).filter((x)=>!isNaN(x)).sort((a,b)=>a-b);
}
function candSourcePeriod(period){
  const ps=candPeriods(); if(!ps.length) return null;
  let pick=ps[0]; ps.forEach((x)=>{ if(x<=period) pick=x; }); return pick;
}
// candSourcePeriod → candPeriods の中で、旧形式の指定の移行も行う
function ovMap(period){ const sp=candSourcePeriod(period); return sp===null ? {} : (S2.cand.byPeriod[String(sp)]||{}); }
function ovOf(engcd, period){ return engcd ? (ovMap(period)[engcd]||"") : ""; }
// 実働として数えるか：1級候補の判定と同じルール（その期の個人指定が優先、「分類のとおり」なら分類のチェック）
function countsAsReal(engcd, cls, period){
  const ov=ovOf(engcd, period);
  return ov==="in" ? true : ov==="out" ? false : (cls===null ? true : !!S2.now.cls[cls||""]);
}
const realMode=()=> S2.countMode==="real";
const modeLabel=()=> realMode() ? "実働の数" : "資格保有の数";
// 一次検定の受検資格（令和6年度〜）：受検年度末（3月31日）時点で19歳以上なら、学歴・実務経験を問わず受検できる。
// 基準の期末（n期末＝(n+1957)/9/30）の次の一次検定は翌期中の7月（(n+1958)年）なので、その受検年度末は (n+1959)/3/31。
const firstExamYearEnd=(period)=> String(period+1959)+"0331";
// 受検する期の二次受検資格者（登録済み）の技術者コードの集合。未登録なら null。
function nijiReg(period){
  const x=S2.niji.periods[String(period)];
  return x && Array.isArray(x.engcds) ? new Set(x.engcds.map(String)) : null;
}
function computeNow(roster, opt){
  const d=periodEnd(roster.period);
  return roster.rows.map((r)=>{
    const engcd=resolveEngcd(r);
    const info=INFO_BY_ENGCD[engcd]||{};
    const bday=String(info.BDAY||"").replace(/[^\d]/g,"");
    const age=yearsBetween(bday, d);
    const ageAtExamYE=yearsBetween(bday, firstExamYearEnd(roster.period)); // 次の一次検定の受検年度末の年齢
    const tooYoung= ageAtExamYE!==null && ageAtExamYE<19;
    const lics=HELD_BY_ENGCD[engcd]||[];
    const k1=heldAt(lics,"doboku1",d), ho=heldAt(lics,"doboku1ho",d), k2=heldAt(lics,"doboku2",d);
    const ov=ovOf(engcd, roster.period);
    const ec=effCls(r, roster, engcd); // 分類なしの期は後の期から補う（補えなければ候補に含める）
    const target= ov==="in" ? true : ov==="out" ? false : (ec.cls===null ? true : !!opt.cls[ec.cls]);
    // 二次受検資格：別のシステムで算出して登録した「来期（基準の期末＋1）の受検資格者」を使う。
    // 登録が無い期だけ、技士補の取得からの年数（目安）で判定する。
    const reg=nijiReg(roster.period+1);
    const isReg= reg && engcd ? reg.has(engcd) : false;
    const exp= ho && ho.sday ? yearsBetween(ho.sday,d) : null;
    let stage;
    if(k1) stage= realMode() && !target ? "out" : "s5"; // 実働の数では、含めない人の1級は数えない
    else if(!target && !isReg) stage="out";
    else if(reg) stage= isReg ? "s4" : ho ? "s3" : (tooYoung ? "s1" : "s2");
    else if(ho) stage= exp!==null && exp>=opt.exp ? "s4" : "s3";
    else if(tooYoung) stage="s1";
    else stage="s2";
    return {no:r.no, name:r.name, cls:ec.cls||"", clsFill:ec.fill, engcd, age, stage, exp, has2:!!k2, ov, hasHo:!!ho, nijiReg: reg ? isReg : null,
      k1Held:!!k1, k1Real:!!k1 && target,
      nijiPrev: (()=>{ const pr=nijiReg(roster.period); return pr && engcd ? pr.has(engcd) : false; })(), hoSday: ho?ho.sday:"", k1Sday: k1?k1.sday:"",
      savedEngcd:r.engcd||"", noBday:!bday, licDateUnknown: !!((k1&&k1.unknown)||(ho&&ho.unknown)), unmatched:!engcd};
  });
}
function bandOf(age, w){
  if(age===null) return null;
  if(w===1) return Math.max(15, Math.min(80, age));
  if(age<20) return 15;                // 〜19
  return Math.min(75, Math.floor(age/5)*5); // 75〜
}

/* =====================================================================

   ・名簿の実績：登録済みの期末名簿に載っている人のうち、その期末時点で1級を持っていた人数

const has1At=(engcd,d)=> !!heldAt(HELD_BY_ENGCD[engcd]||[],"doboku1",d);
const hoAt=(engcd,d)=> !!heldAt(HELD_BY_ENGCD[engcd]||[],"doboku1ho",d);
// 名簿の実績（期末時点）
function rosterStats(roster){
  const d=periodEnd(roster.period);
  const ppl=roster.rows.map((r)=>{ const engcd=resolveEngcd(r); const info=INFO_BY_ENGCD[engcd]||{}; const ec=effCls(r, roster, engcd);
    return {key:engcd?"e:"+engcd:"n:"+normCode(r.no), no:r.no, name:r.name, cls:ec.cls, clsFill:ec.fill, engcd,
      tenure:yearsBetween(String(info.NDAY||"").replace(/[^\d]/g,""), d),
      age:yearsBetween(String(info.BDAY||"").replace(/[^\d]/g,""), d), k1Held:!!engcd&&has1At(engcd,d), ho:!!engcd&&hoAt(engcd,d)}; });
  ppl.forEach((p)=>{ p.k1Real=p.k1Held && countsAsReal(p.engcd,p.cls,roster.period); p.k1= realMode() ? p.k1Real : p.k1Held; });
  const t=ppl.filter((p)=>p.k1), ta=t.filter((p)=>p.age!==null);
  return {period:roster.period, d, ppl, n1:t.length, n1Held:ppl.filter((p)=>p.k1Held).length, n1Real:ppl.filter((p)=>p.k1Real).length,
    nHo:ppl.filter((p)=>!p.k1Held&&p.ho).length, total:ppl.length,
    avg1: ta.length ? ta.reduce((x,p)=>x+p.age,0)/ta.length : null, n1_60:ta.filter((p)=>p.age>=60).length};
}
// 今の社員データからの再現（参考）
// 最新の期末名簿での分類（実働の判定に使う。名簿にいない人は分類なし扱い＝個人指定のみで判定）
function latestClsMap(){
  const last=S2.rosters[S2.rosters.length-1], m={};
  if(last) last.rows.forEach((r)=>{ const e=resolveEngcd(r); if(e) m[e]=r.cls||""; });
  return m;
}
function reconstruct(period, clsMap){
  const d=periodEnd(period);
  let n1=0, n1Held=0, n1Real=0, nHo=0, total=0, unknownRetire=0, unknownHire=0, unknownSday=0;
  EMPLOYEES.forEach((e)=>{
    const engcd=String(e.ENGCD), info=INFO_BY_ENGCD[engcd]||{};
    const nday=String(info.NDAY||"").replace(/[^\d]/g,"");
    if(!/^\d{8}$/.test(nday)){ unknownHire++; return; }
    if(nday>d) return;
    if(e.STATUS==="retired"){
      const rd=String(e.RETIRE_DATE||"").replace(/[^\d]/g,"");
      if(!/^\d{8}$/.test(rd)){ unknownRetire++; return; }
      if(rd<=d) return;
    }
    total++;
    const lics=HELD_BY_ENGCD[engcd]||[];
    const c1=qualCol("doboku1"), cho=qualCol("doboku1ho");
    const k1=lics.some((l)=>c1.match(N(l.name)) && /^\d{8}$/.test(l.sday) && l.sday<=d);
    if(!k1 && lics.some((l)=>c1.match(N(l.name)) && !l.sday)) unknownSday++;
    if(k1){
      n1Held++;
      const ov=ovOf(engcd, period);
      const real= ov==="in" ? true : ov==="out" ? false : (engcd in clsMap ? !!S2.now.cls[clsMap[engcd]] : true);
      if(real) n1Real++;
      if(!realMode() || real) n1++;
    }
    else if(lics.some((l)=>cho.match(N(l.name)) && /^\d{8}$/.test(l.sday) && l.sday<=d)) nHo++;
  });
  return {period, n1, n1Held, n1Real, nHo, total, unknownRetire, unknownHire, unknownSday};
}

// 折れ線グラフ（1本の縦軸・2px線・8px以上のマーカー・薄い目盛線・ホバーで値）
// opt.tip：ツールチップの種類（S2.lcTips[tip](i) で中身を作る）、opt.refs：参考線 [{v,label}]、opt.unit：目盛の単位
function lineChartSVG(cats, series, yLabel, opt={}){
  const W=860, H=260, L=44, R=16, T=14, B=34;
  const refs=opt.refs||[], unit=opt.unit||"";
  const vals=series.flatMap((s)=>s.values.filter((v)=>v!==null)).concat(refs.map((r)=>r.v));
  const maxV=Math.max(1,...vals);
  const step=maxV<=10?2:maxV<=25?5:maxV<=60?10:maxV<=150?25:50;
  const top=Math.ceil(maxV/step)*step;
  const x=(i)=> L+(cats.length===1?(W-L-R)/2:(W-L-R)*i/(cats.length-1));
  const y=(v)=> T+(H-T-B)*(1-v/top);
  let g=`<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)}の推移">`;
  g+=`<g class="grid">`; for(let v=0;v<=top;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`; g+=`</g>`;
  g+=`<g class="axis">`; for(let v=0;v<=top;v+=step) g+=`<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}${unit}</text>`;
  cats.forEach((c,i)=>{ g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(c)}</text>`; }); g+=`</g>`;
  // 参考線（灰色の点線＋右寄せのラベル）
  refs.forEach((r)=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="#8a8f9c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${W-R-4}" y="${y(r.v)-5}" text-anchor="end" style="fill:#5d6377;font-size:11px">${esc(r.label)}</text>`; });
  series.forEach((s)=>{
    let d="", pen=false;
    s.values.forEach((v,i)=>{ if(v===null){ pen=false; return; } d+=(pen?"L":"M")+x(i)+" "+y(v)+" "; pen=true; });
    if(d) g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?`stroke-dasharray="5 4"`:""} stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{ if(v===null) return;
      g+= s.hollow ? `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="${s.color}" stroke-width="2"/>`
                   : `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; });
  });
  // 当たり判定（期ごとの縦帯）
  cats.forEach((c,i)=>{ const half=cats.length===1?(W-L-R)/2:(W-L-R)/(cats.length-1)/2;
    g+=`<rect class="hit" x="${x(i)-half}" y="${T}" width="${half*2}" height="${H-T-B}" data-lc-i="${i}"${opt.tip?` data-lc-k="${opt.tip}"`:""}/>`; });
  return g+`</svg>`;
}

/* =====================================================================
   シミュレーション
   ・最新の期末名簿の在籍者（1級を持つ人＋1級候補の分類の人）から出発し、1期（1年）ずつ進める。
   ・毎年：①年齢・勤続に応じた1年の在籍率をかける → ②1歳加齢 → ③段階を進める（一次合格・経験年数・二次合格）→ ④採用を加える。
   ・人は小数の「重み」で扱う期待値の計算（毎回同じ結果になる）。
   ===================================================================== */
// ---- 必要数：配置データの同時配置人数（月ごと）から求める ----
const roleCat=(t)=>{ const s=String(t||""); if(s.includes("監理")) return "監理"; if(s.includes("主任")) return "主任"; return ""; };
const isAnken=(k)=>{ const s=String(k||"").trim(); return /^H/i.test(s) || /^\d{5}[A-Za-z]-\d+$/.test(s); };
const d8=(v)=>{ const x=String(v||"").replace(/[^\d]/g,""); return /^\d{8}$/.test(x)?x:""; };
function needByPeriod(opt, periods){
  const parents={}; ASSIGN.forEach((r)=>{ if(r["タイプ"]==="案件・工番") parents[r.ID]=r; });
  const techs=[];
  ASSIGN.forEach((r)=>{
    if(r["タイプ"]!=="技術者") return;
    const cat=roleCat(r["役割"]); if(!cat || !opt.roles[cat]) return;
    const par=parents[r.PARENT]||{};
    if(!opt.anken && isAnken(par["工番・案件"])) return;
    const from=d8(r["配置期間(自)"])||d8(par["工期(自)"]), to=d8(r["配置期間(至)"])||d8(par["工期(至)"]);
    if(!from||!to) return;
    techs.push({name:String(r["技術者名"]||"").replace(/[\s　]/g,""), from, to});
  });
  return periods.map((p)=>{
    let peak=0, sum=0, peakYM="";
    for(let i=0;i<12;i++){
      const y=p+1956+(i>=3?1:0), m=((9+i)%12)+1; // 10月〜翌9月
      const ms=`${y}${String(m).padStart(2,"0")}01`, me=`${y}${String(m).padStart(2,"0")}31`;
      const set=new Set(techs.filter((t)=>t.from<=me && t.to>=ms).map((t)=>t.name));
      sum+=set.size; if(set.size>peak){ peak=set.size; peakYM=`${y}/${m}`; }
    }
    return {period:p, peak, avg:sum/12, peakYM};
  });
}

// ---- 前提条件の初期値（実績があれば実績、少なければ仮の値） ----
// 在籍率の年齢区分（全世代）。[キー, 表示, 判定, 実績が少ないときの仮の値(%)]。シミュレーションと「年代別の在籍率・離職率」で共通。
const RET_KEYS=[
  ["a29","29歳以下",(a)=>a<30,92], ["a30","30〜39歳",(a)=>a>=30&&a<40,95], ["a40","40〜49歳",(a)=>a>=40&&a<50,97],
  ["a50","50〜54歳",(a)=>a>=50&&a<55,97], ["a55","55〜59歳",(a)=>a>=55&&a<60,96], ["a60","60〜64歳",(a)=>a>=60&&a<65,90],
  ["a65","65〜69歳",(a)=>a>=65&&a<70,80], ["a70","70歳以上",(a)=>a>=70,65]];
const MID_KEYS=new Set(["a30","a40"]); // 中堅（30〜49歳）
// 在籍率の実績（年代別・入社3年以内）。「年代別の在籍率・離職率」の表と同じ数え方・同じデータ（rosterStats）を使う。
// 連続する期末名簿の組（前の期末→次の期末＝1年分）のうち、集計期間（直近◯期分）に入るもの
function turnoverPairIdx(){
  const R=S2.rosters, idx=[];
  for(let i=1;i<R.length;i++) if(R[i].period===R[i-1].period+1) idx.push(i);
  return S2.retWin>0 ? idx.slice(-S2.retWin) : idx;
}
function retentionActuals(){
  const R=S2.rosters, st=new Map(R.map((r)=>[r.period, rosterStats(r)]));
  const out={newbie:[0,0], ret:Object.fromEntries(RET_KEYS.map(([k])=>[k,[0,0]]))};
  for(const i of turnoverPairIdx()){
    const a=st.get(R[i-1].period), b=st.get(R[i].period), bk=new Set(b.ppl.map((p)=>p.key));
    a.ppl.forEach((p)=>{
      const stay=bk.has(p.key);
      if(p.tenure!==null && p.tenure<3){ out.newbie[0]++; if(stay) out.newbie[1]++; }
      else if(p.age!==null){ const k=RET_KEYS.find(([,,f])=>f(p.age)); if(k){ out.ret[k[0]][0]++; if(stay) out.ret[k[0]][1]++; } }
    });
  }
  return out;
}
function simDefaults(){
  const opt={...S2.now, cls:S2.now.cls};
  const P={years:15, exp:S2.now.exp, ret:{}, src:{}, newbie:90, p1:15, p2:30,
    hireHigh:0, hireUniv:0, midNone:0, midHo:0, mid1:0, midAge:35,
    midTiming:"next", // 中途（1級あり）を技術者として数え始める時期（入社後6か月以上の雇用が条件）："next"＝翌期末から／"same"＝入社した期末から
    lever:{hire:2, pass:100, mid1:1},
    need:{mode:"peak3", manual:0, roles:{"監理":true,"主任":false}, anken:true, margin:0}};
  RET_KEYS.forEach(([k,,,def])=>{ P.ret[k]=def; P.src["ret_"+k]="仮"; });
  P.src.newbie=P.src.p1=P.src.p2="仮"; P.src.hire="仮";
  const R=S2.rosters;
  // 合格の割合・採用人数は1級候補（分類）を使うので、両方の期に分類がある組だけで計算する。在籍率は分類を使わないので全期を使う。
  const pairs=[]; for(let i=1;i<R.length;i++) if(R[i].period===R[i-1].period+1 && !R[i].noCls && !R[i-1].noCls) pairs.push([R[i-1],R[i]]);
  { const ra=retentionActuals();
    const w=S2.retWin>0?`直近${Math.min(S2.retWin,turnoverPairIdx().length)}期`:"全期間";
    RET_KEYS.forEach(([k])=>{ const [t,st]=ra.ret[k]; if(t>=8){ P.ret[k]=Math.round(st/t*100); P.src["ret_"+k]=`実績(${w}) ${st}/${t}人`; } });
    if(ra.newbie[0]>=5){ P.newbie=Math.round(ra.newbie[1]/ra.newbie[0]*100); P.src.newbie=`実績(${w}) ${ra.newbie[1]}/${ra.newbie[0]}人`; } }
  if(!pairs.length) return P;
  // 段階・年齢つきで期末ごとの人を作る
  const at=(roster)=>{ const d=periodEnd(roster.period);
    return computeNow(roster,opt).map((p)=>{ const info=INFO_BY_ENGCD[p.engcd]||{};
      return {...p, key:p.engcd?"e:"+p.engcd:"n:"+normCode(p.no), tenure:yearsBetween(String(info.NDAY||"").replace(/[^\d]/g,""), d)}; }); };
  const acc={ret:{}, newbie:[0,0], p1:[0,0], p2:[0,0], hire:{high:0, univ:0, mid:0, mid1:0}};
  RET_KEYS.forEach(([k])=>acc.ret[k]=[0,0]);
  pairs.forEach(([a,b])=>{
    const A=at(a), B=at(b), bm=new Map(B.map((p)=>[p.key,p])), am=new Set(A.map((p)=>p.key));
    A.forEach((p)=>{
      const stay=bm.has(p.key);
      if(!stay) return;
      const q=bm.get(p.key);
      if(p.stage==="s2"){ acc.p1[0]++; if(["s3","s4","s5"].includes(q.stage)) acc.p1[1]++; }
      if(p.stage==="s4"){ acc.p2[0]++; if(q.stage==="s5") acc.p2[1]++; }
    });
    B.forEach((q)=>{ if(am.has(q.key) || (q.stage==="out")) return; // 1級候補の分類（＋1級保有者）だけを採用として数える
      if(q.stage==="s5") acc.hire.mid1++; else if(q.age!==null && q.age<=19) acc.hire.high++; else if(q.age!==null && q.age<=25) acc.hire.univ++; else acc.hire.mid++; });
  });
  const n=pairs.length;
  if(acc.p1[0]>=10){ P.p1=Math.round(acc.p1[1]/acc.p1[0]*100); P.src.p1=`実績 ${acc.p1[1]}/${acc.p1[0]}人`; }
  if(acc.p2[0]>=5){ P.p2=Math.round(acc.p2[1]/acc.p2[0]*100); P.src.p2=`実績 ${acc.p2[1]}/${acc.p2[0]}人`; }
  P.hireHigh=Math.round(acc.hire.high/n); P.hireUniv=Math.round(acc.hire.univ/n); P.midNone=Math.round(acc.hire.mid/n); P.mid1=Math.round(acc.hire.mid1/n);
  P.src.hire=`実績（分類がある直近${n}期の平均。1級候補の分類で新しく載った人）`;
  return P;
}

// ---- 計算本体 ----
function simInit(P){
  const roster=S2.rosters[S2.rosters.length-1];
  const ppl=computeNow(roster,{...S2.now, exp:P.exp}).filter((p)=>p.stage!=="out");
  const d=periodEnd(roster.period);
  const avgAge=(st)=>{ const a=ppl.filter((p)=>p.stage===st && p.age!==null); return a.length ? Math.round(a.reduce((x,p)=>x+p.age,0)/a.length) : 45; };
  return ppl.map((p)=>{ const info=INFO_BY_ENGCD[p.engcd]||{};
    const t=yearsBetween(String(info.NDAY||"").replace(/[^\d]/g,""), d);
    return {age: p.age!==null ? p.age : avgAge(p.stage), stage:p.stage, exp: p.exp!==null ? p.exp : (p.stage==="s4"?P.exp:0), nb: t===null?3:Math.min(3,t), w:1}; });
}
function simulate(init, P){
  const rate=(age,nb)=>{ if(nb<3) return P.newbie/100; const k=RET_KEYS.find(([,,f])=>f(age)); return P.ret[k[0]]/100; };
  let st=new Map();
  const add=(m,o)=>{ const k=`${o.age}|${o.stage}|${o.exp}|${o.nb}`; const c=m.get(k); if(c) c.w+=o.w; else m.set(k,{...o}); };
  init.forEach((o)=>add(st,o));
  // p5＝1級を持つ中途で、雇用6か月に満たず期末にはまだ数えない人（1級技術者の人数には入れない）
  const snap=()=>{ const r={s5:0,s4:0,s3:0,s2:0,s1:0,s5_60:0,p5:0}; st.forEach((o)=>{ r[o.stage]+=o.w; if(o.stage==="s5"&&o.age>=60) r.s5_60+=o.w; }); return r; };
  const out=[snap()];
  for(let y=1;y<=P.years;y++){
    const nx=new Map();
    st.forEach((o)=>{
      const w=o.w*rate(o.age,o.nb); if(w<1e-6) return;
      const b={age:o.age+1, stage:o.stage, exp:o.exp, nb:Math.min(3,o.nb+1), w};
      if(b.stage==="s1"){ if(b.age>=18) b.stage="s2"; add(nx,b); } // 期末18歳以上なら、次の一次検定の受検年度末には19歳以上
      else if(b.stage==="s2"){ const pass=w*P.p1/100; if(pass>0) add(nx,{...b, stage:"s3", exp:0, w:pass}); if(w-pass>0) add(nx,{...b, w:w-pass}); }
      else if(b.stage==="s3"){ b.exp=o.exp+1; if(b.exp>=P.exp) b.stage="s4"; add(nx,b); }
      else if(b.stage==="s4"){ const pass=w*P.p2/100; if(pass>0) add(nx,{...b, stage:"s5", w:pass}); if(w-pass>0) add(nx,{...b, w:w-pass}); }
      else if(b.stage==="p5"){ b.stage="s5"; add(nx,b); } // 翌期末には雇用6か月以上になり、技術者として数える
      else add(nx,b);
    });
    // 採用：一次検定を受けられる人（s2）は、入社した年の7月の一次検定から受検できるので、その年のうちに合格の割合だけ技士補になる
    const hire=(n,o)=>{ if(!(n>0)) return;
      if(o.stage==="s2"){ const pass=n*P.p1/100; if(pass>0) add(nx,{...o, stage:"s3", exp:0, nb:0, w:pass}); if(n-pass>0) add(nx,{...o, nb:0, w:n-pass}); }
      else add(nx,{...o, nb:0, w:n}); };
    hire(P.hireHigh,{age:18, stage:"s2", exp:0}); // 高卒（18歳）も入社1年目の一次検定から受検できる（受検年度末に19歳）
    hire(P.hireUniv,{age:22, stage:"s2", exp:0});
    hire(P.midNone,{age:P.midAge, stage:"s2", exp:0});
    hire(P.midHo,{age:P.midAge, stage:"s3", exp:0});
    // 中途（1級あり）：入社後6か月以上の雇用が条件。4〜9月入社なら、その期末にはまだ6か月に満たないので翌期末から数える。
    hire(P.mid1,{age:P.midAge, stage: P.midTiming==="same" ? "s5" : "p5", exp:0});
    st=nx; out.push(snap());
  }
  return out;
}
// 不足が始まる期（出発時点＝今は打ち手で変えられないので、翌期以降で判定する）
const firstShort=(res,need)=>{ for(let i=1;i<res.length;i++) if(res[i].s5 < need-1e-9) return i; return -1; };
// 打ち手の逆算：不足をゼロにできる最小値を探す（無理なら「最大でも不足が残る期」を返す）
function backCalc(init, P, need, kind){
  const mk=(v)=>{ const Q=JSON.parse(JSON.stringify(P));
    if(kind==="hire") Q.hireUniv=P.hireUniv+v; else if(kind==="mid1") Q.mid1=P.mid1+v; else { Q.p1=Math.max(P.p1,v); Q.p2=Math.max(P.p2,v); } return Q; };
  const vals= kind==="pass" ? Array.from({length:101},(_,i)=>i) : Array.from({length:41},(_,i)=>i);
  for(const v of vals){ const r=simulate(init,mk(v)); if(firstShort(r,need)<0) return {ok:true, v}; }
  const maxV=vals[vals.length-1], r=simulate(init,mk(maxV));
  return {ok:false, v:maxV, short:r.map((x,i)=>i>0&&x.s5<need-1e-9?i:-1).filter((i)=>i>=0)};
}

function renderSim(){
  if(!S2.rosters.length){
    return `<div class="card"><h2>シミュレーション</h2><p class="desc">期末名簿がまだ登録されていません。「データ管理」で在籍リストを取り込むと使えます。</p>
      <button class="btn primary" data-sub="data">データ管理へ</button></div>`;
  }
  if(!S2.sim || S2.simBase!==S2.rosters.map((r)=>r.period).join(",")){ S2.sim=simDefaults(); S2.simBase=S2.rosters.map((r)=>r.period).join(","); }
  else {
    // 実績・仮の値は表示のたびに最新のデータで取り直す（手入力した値だけは残す）
    const F=simDefaults(), Q=S2.sim;
    RET_KEYS.forEach(([k])=>{ if(Q.src["ret_"+k]!=="手入力"){ Q.ret[k]=F.ret[k]; Q.src["ret_"+k]=F.src["ret_"+k]; } });
    ["newbie","p1","p2"].forEach((k)=>{ if(Q.src[k]!=="手入力"){ Q[k]=F[k]; Q.src[k]=F.src[k]; } });
    if(Q.src.hire!=="手入力"){ ["hireHigh","hireUniv","midNone","midHo","mid1"].forEach((k)=>{ Q[k]=F[k]; }); Q.src.hire=F.src.hire; }
  }
  const P=S2.sim, base=S2.rosters[S2.rosters.length-1].period;
  // 必要数
  const nperiods=[]; for(let p=base-2;p<=base+2;p++) nperiods.push(p);
  const nb=needByPeriod(P.need, nperiods);
  const past=nb.filter((x)=>x.period<=base);
  const auto= P.need.mode==="peak3" ? Math.max(0,...past.map((x)=>x.peak)) : past.reduce((s,x)=>s+x.avg,0)/past.length;
  const need0= P.need.mode==="manual" ? P.need.manual : Math.ceil(auto*(1+P.need.margin/100));
  const init=simInit(P);
  const scen=[
    {k:"A", name:"現状のまま", color:"#2a78d6", P},
    {k:"B", name:`新卒（大卒）を毎年＋${P.lever.hire}人`, color:"#eb6834", P:{...P, hireUniv:P.hireUniv+P.lever.hire}},
    {k:"C", name:`合格率を${P.lever.pass}%に（一発合格）`, color:"#1baf7a", P:{...P, p1:Math.max(P.p1,P.lever.pass), p2:Math.max(P.p2,P.lever.pass)}},
    {k:"D", name:`中途（1級保有）を毎年＋${P.lever.mid1}人`, color:"#eda100", P:{...P, mid1:P.mid1+P.lever.mid1}},
  ].map((x)=>({...x, res:simulate(init,x.P)}));
  const cats=scen[0].res.map((_,i)=>`${base+i}期末`);
  const A=scen[0].res, fsA=firstShort(A,need0);
  S2.simTip={cats, scen, need0};

  // ---- 結論 ----
  const fmt=(v)=> (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,"");
  const fsTxt=(i)=> i<0 ? `<b class="ok">${base+1}〜${base+P.years}期末は不足しません</b>` : `<b class="ng">${base+i}期末から不足します</b>`;
  const gapNow=need0-A[0].s5;
  let h=`<div class="card"><h2>結論（${base}期末から${P.years}期分の予測）</h2>
    <div class="verdict">必要数 <b>${need0}人</b> に対し、現在（${base}期末）の1級技術者（${modeLabel()}）は <b>${fmt(A[0].s5)}人</b>${gapNow>1e-9?`で、<b class="ng">すでに${fmt(gapNow)}人不足</b>しています`:""}。
    現状のままだと ${fsTxt(fsA)}（${P.years}年後は約${fmt(A[A.length-1].s5)}人）。</div>
    ${P.p1===0||P.p2===0?`<div class="note-box">⚠ ${P.p1===0?"一次検定":""}${P.p1===0&&P.p2===0?"・":""}${P.p2===0?"二次検定":""}の合格の割合が <b>0%</b> になっているため、新しく1級になる人が出ません（新卒を増やしても1級は増えない計算になります）。実績が少ないことが原因の場合は、下の「前提条件」で実態に近い値に直してください。</div>`:""}
    ${S2.now.cls["その他"]||Object.values(ovMap(base)).includes("in")?"":`<div class="note-box">1級候補が「イロハ」の分類だけになっています。「その他」に入っている技術系の若手を含めるには、「データ管理」の「1級候補の個人指定」で「含める」にしてください。</div>`}
    <table class="grid-tbl" style="margin-top:10px"><tr><th>シナリオ</th><th>不足が始まる期</th><th>5年後</th><th>10年後</th><th>${P.years}年後</th></tr>`+
    scen.map((x)=>{ const f=firstShort(x.res,need0); return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${x.color};margin-right:6px"></i>${x.k}：${esc(x.name)}</td>
      <td>${f<0?"不足なし":base+f+"期末"}</td>${[5,10,P.years].map((y)=>`<td class="n">${x.res[y]?fmt(x.res[y].s5):"–"}</td>`).join("")}</tr>`; }).join("")+`</table></div>`;

  // ---- 予測グラフ ----
  const series=scen.map((x)=>({name:x.k, color:x.color, values:x.res.map((r)=>Math.round(r.s5*10)/10)}));
  h+=`<div class="card"><h2>1級技術者数の予測</h2>
    <p class="desc">点線が必要数です。線の右端の文字はシナリオ名（A〜D）です。点にマウスを乗せると各シナリオの人数が出ます。</p>
    <div class="legend">${scen.map((x)=>`<span><i style="background:${x.color}"></i>${x.k}：${esc(x.name)}</span>`).join("")}<span><i style="background:#fff;border:2px dashed #b3261e;width:10px;height:10px"></i>必要数（${need0}人）</span></div>
    ${simChartSVG(cats, series, need0)}
    <table class="grid-tbl" style="margin-top:10px"><tr><th>期末</th>${cats.map((c)=>`<th>${c.replace("期末","")}</th>`).join("")}</tr>`+
    scen.map((x)=>`<tr><td>${x.k}</td>${x.res.map((r)=>`<td class="n"${r.s5<need0-1e-9?` style="color:#b3261e;font-weight:700"`:""}>${fmt(r.s5)}</td>`).join("")}</tr>`).join("")+
    `<tr><td class="muted">A：うち60歳以上</td>${A.map((r)=>`<td class="n muted">${fmt(r.s5_60)}</td>`).join("")}</tr>
     <tr><td class="muted">A：技士補（経験中＋二次受検可能）</td>${A.map((r)=>`<td class="n muted">${fmt(r.s3+r.s4)}</td>`).join("")}</tr></table>
    <p class="desc" style="margin-top:6px">赤字は必要数を下回る期です。人数は期待値なので小数になります。</p></div>`;

  // ---- 打ち手の逆算 ----
  const bh=backCalc(init,P,need0,"hire"), bp=backCalc(init,P,need0,"pass"), bm=backCalc(init,P,need0,"mid1");
  const lead=(kind)=> kind==="hire" ? `最短でも入社から約${P.exp+1}年（入社1年目に一次検定→実務経験${P.exp}年→二次検定）` : kind==="pass" ? "今いる技士補・受検可能者にすぐ効く（1〜数年）" : (P.midTiming==="same" ? "入社した期末から（入社後6か月以上の雇用が条件。10〜3月入社の場合）" : "入社した翌期末から（入社後6か月以上の雇用が条件。4〜9月入社の場合）");
  const res=(b,kind)=>{
    if(fsA<0) return "現状のままで不足なし";
    if(b.ok){
      if(kind!=="pass") return `毎年 <b>＋${b.v}人</b>（今の計画に上乗せ）`;
      const up=[P.p1<b.v?`一次（今 ${P.p1}%）`:"", P.p2<b.v?`二次（今 ${P.p2}%）`:""].filter(Boolean);
      return `${up.join("・")}の合格の割合を <b>${b.v}%</b> 以上に`;
    }
    return `<b class="ng">この打ち手だけでは解消できません</b>（最大の${kind==="pass"?"100%":"＋"+b.v+"人/年"}でも ${b.short.map((i)=>base+i).join("・")}期末が不足）`;
  };
  h+=`<div class="card"><h2>不足をなくすには（打ち手ごとの逆算）</h2>
    <p class="desc">それぞれの打ち手を<b>単独で</b>使ったとき、${base+1}〜${base+P.years}期末の間ずっと必要数（${need0}人）を下回らないために必要な量です（今の期末の人数は打ち手では変えられないので対象外です）。</p>
    <table class="grid-tbl"><tr><th>打ち手</th><th>効き始めるまで</th><th>不足をなくすのに必要な量</th></tr>
      <tr><td>新卒（大卒）を増やす</td><td>${lead("hire")}</td><td>${res(bh,"hire")}</td></tr>
      <tr><td>一発合格を徹底する</td><td>${lead("pass")}</td><td>${res(bp,"pass")}</td></tr>
      <tr><td>中途（1級保有者）を採る</td><td>${lead("mid1")}</td><td>${res(bm,"mid1")}</td></tr></table>
    ${fsA>0 && fsA<=P.exp+1 ? `<div class="note-box">⚠ 不足が始まるのは ${base+fsA}期末で、新卒が1級になるまでの年数（約${P.exp+1}年）より早く来ます。<b>直近の不足には中途採用か合格率の改善</b>でしか間に合いません。新卒はその後の不足への備えになります。</div>`:""}</div>`;

  h+=renderSimInputs(P, nb, base, auto, need0);
  return h;
}

function simChartSVG(cats, series, need){
  const W=860, H=280, L=44, R=40, T=14, B=34;
  const vals=series.flatMap((s)=>s.values).concat([need]);
  const maxV=Math.max(1,...vals);
  const step=maxV<=10?2:maxV<=25?5:maxV<=60?10:maxV<=150?25:50;
  const top=Math.ceil(maxV*1.05/step)*step;
  const x=(i)=> L+(W-L-R)*i/Math.max(1,cats.length-1), y=(v)=> T+(H-T-B)*(1-v/top);
  let g=`<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="1級技術者数の予測">`;
  g+=`<g class="grid">`; for(let v=0;v<=top;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`; g+=`</g>`;
  g+=`<g class="axis">`; for(let v=0;v<=top;v+=step) g+=`<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  cats.forEach((c,i)=>{ if(cats.length<=16 || i%2===0) g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(c.replace("期末",""))}</text>`; });
  g+=`</g>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(need)}" y2="${y(need)}" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>`;
  // 端のラベルが重ならないよう少しずらす
  const ends=series.map((s)=>({s, yy:y(s.values[s.values.length-1])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++) if(ends[i].yy-ends[i-1].yy<12) ends[i].yy=ends[i-1].yy+12;
  series.forEach((s)=>{
    const d=s.values.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  ends.forEach(({s,yy})=>{ g+=`<text x="${W-R+6}" y="${yy+4}" font-size="12" font-weight="700" fill="#1f2330">${s.name}</text>`; });
  cats.forEach((c,i)=>{ const half=(W-L-R)/Math.max(1,cats.length-1)/2;
    g+=`<rect class="hit" x="${x(i)-half}" y="${T}" width="${half*2}" height="${H-T-B}" data-sim-i="${i}"/>`; });
  return g+`</svg>`;
}

    ${Object.values(P.src).includes("手入力")?`<button class="btn" id="simReset" style="margin-left:6px">手入力をやめて実績の値に戻す</button>`:""}</p>

      `<div class="sim-in"><span class="l" style="white-space:nowrap">入社3年以内</span>${num("newbie",P.newbie,1,0,100)}%<span class="muted" style="white-space:nowrap">離職${Math.max(0,100-P.newbie)}%</span>${src(P.src.newbie)}</div>
      <p class="desc" style="margin:4px 0 0">入社3年以内は年齢を問いません。年齢区分の値は、入社3年以内の人を除いて数えています。</p></div>
    <div class="sim-grp"><h4>資格</h4>
      <div class="sim-in"><span class="l">一次検定：受検できる人のうち、1年で技士補になる割合</span>${num("p1",P.p1,1,0,100)}%${src(P.src.p1)}</div>
      <div class="sim-in"><span class="l">二次検定：受検できる人のうち、1年で1級になる割合</span>${num("p2",P.p2,1,0,100)}%${src(P.src.p2)}</div>
      <div class="sim-in"><span class="l">技士補から二次受検資格までの年数（将来分の目安。出発時点は登録を使用）</span><select data-sim="exp"><option value="5"${P.exp===5?" selected":""}>5年</option><option value="3"${P.exp===3?" selected":""}>3年</option></select></div>
      <div class="sim-in"><span class="l">予測する期間</span>${num("years",P.years,1,5,25)}年</div></div>
    <div class="sim-grp"><h4>毎年の採用（今の計画）${src(P.src.hire)}</h4>
      <div class="sim-in"><span class="l">新卒・高卒（18歳・入社1年目から一次を受検可）</span>${num("hireHigh",P.hireHigh)}人</div>
      <div class="sim-in"><span class="l">新卒・大卒（22歳）</span>${num("hireUniv",P.hireUniv)}人</div>
      <div class="sim-in"><span class="l">中途・資格なし</span>${num("midNone",P.midNone)}人</div>
      <div class="sim-in"><span class="l">中途・技士補あり</span>${num("midHo",P.midHo)}人</div>
      <div class="sim-in"><span class="l">中途・1級あり</span>${num("mid1",P.mid1)}人</div>
      <div class="sim-in"><span class="l">中途の入社時の年齢</span>${num("midAge",P.midAge,1,18,70)}歳</div>
      <div class="sim-in"><span class="l">中途（1級あり）を技術者として数える時期<br><span class="muted">入社後6か月以上の雇用が条件</span></span>
        <select data-sim="midTiming"><option value="next"${P.midTiming==="next"?" selected":""}>翌期末から（4〜9月入社が中心）</option><option value="same"${P.midTiming==="same"?" selected":""}>入社した期末から（10〜3月入社が中心）</option></select></div></div>

  // 必要数
  h+=`<h3 style="font-size:13px;margin:16px 0 6px">必要数（1級技術者が何人いればよいか）</h3>

      ${P.need.mode==="manual" ? `<span>必要数 ${num("need.manual",P.need.manual)}人</span>` : `<span>余裕 ${num("need.margin",P.need.margin,5,0,200)}% を上乗せ</span>`}

      <label><input type="checkbox" data-sim-chk="need.roles.主任"${P.need.roles["主任"]?" checked":""}> 主任技術者</label>
      <label><input type="checkbox" data-sim-chk="need.anken"${P.need.anken?" checked":""}> 受注前の案件も含める</label>
      <span>→ <b>${need0}人</b></span></div>
    <table class="grid-tbl" style="margin-top:6px"><tr><th>期</th>${nb.map((x)=>`<th>${x.period}期${x.period>base?"（見込み）":""}</th>`).join("")}</tr>
      <tr><td>同時配置のピーク</td>${nb.map((x)=>`<td class="n">${x.peak}${x.peakYM?`<span class="muted">（${x.peakYM}）</span>`:""}</td>`).join("")}</tr>
      <tr><td>同時配置の平均</td>${nb.map((x)=>`<td class="n">${x.avg.toFixed(1)}</td>`).join("")}</tr></table>
    <p class="desc" style="margin-top:6px">配置データの技術者のうち、役割が選んだ区分（監理・主任）の人を月ごとに数え、同じ月に同時に配置されている人数（同じ人は1人）を出しています。見込みの期は、受注前の案件の配置予定を含めた場合のみ数字が入ります。
    ${ASSIGN.length?"":"<br><b>配置データが読み込めていません。</b>必要数は手入力にしてください。"}</p></div>`;
  return h;
}

structEl.addEventListener("click",(e)=>{
  if(e.target.id!=="simReset" || !S2.sim) return;
  // 手入力の印を外すと、次の表示で実績（または仮）の値に置き換わる。打ち手・必要数の設定はそのまま。
  Object.keys(S2.sim.src).forEach((k)=>{ if(S2.sim.src[k]==="手入力") S2.sim.src[k]="仮"; });
  renderStruct();
});
const setPath=(o,path,v)=>{ const ks=path.split("."); let c=o; for(let i=0;i<ks.length-1;i++) c=c[ks[i]]; c[ks[ks.length-1]]=v; };
structEl.addEventListener("change",(e)=>{
  const t=e.target; if(!S2.sim) return;
  if(t.dataset.sim){ const v=t.tagName==="SELECT" && isNaN(parseFloat(t.value)) ? t.value : parseFloat(t.value);
    if(typeof v==="number" && isNaN(v)) return;
    setPath(S2.sim, t.dataset.sim, v);
    if(t.dataset.sim==="ret."+t.dataset.sim.split(".")[1] || ["newbie","p1","p2"].includes(t.dataset.sim)) S2.sim.src[t.dataset.sim.startsWith("ret.")?"ret_"+t.dataset.sim.split(".")[1]:t.dataset.sim]="手入力";
    if(["hireHigh","hireUniv","midNone","midHo","mid1"].includes(t.dataset.sim)) S2.sim.src.hire="手入力";
    renderStruct(); }
  else if(t.dataset.simChk){ setPath(S2.sim, t.dataset.simChk, t.checked); renderStruct(); }
});
structEl.addEventListener("mousemove",(e)=>{
  const hit=e.target.closest("[data-sim-i]"); if(!hit || !S2.simTip) return;
  const i=parseInt(hit.dataset.simI,10), t=S2.simTip;
  vizTip.innerHTML=`<b>${esc(t.cats[i])}</b>（必要数 ${t.need0}人）<br>`+t.scen.map((x)=>`<span style="color:${x.color}">■</span> ${x.k}：${(Math.round(x.res[i].s5*10)/10)}人`).join("<br>");
  vizTip.style.display="block";
  vizTip.style.left=Math.min(e.clientX+14, window.innerWidth-vizTip.offsetWidth-8)+"px";
  vizTip.style.top=Math.min(e.clientY+14, window.innerHeight-vizTip.offsetHeight-8)+"px";
});

/* ---- 年代別の在籍率・離職率（全世代） ---- */
// 連続する期末名簿を比べ、前の期末にいた人が翌期末の名簿にもいたかどうかで数える。
// 入社3年以内の人は別の行にまとめ、年齢区分の行からは除く（シミュレーションの前提条件と同じ数え方）。
function renderTurnover(stats){
  const allPairs=[]; for(let i=1;i<stats.length;i++) if(stats[i].period===stats[i-1].period+1) allPairs.push([stats[i-1],stats[i]]);
  const pairs= S2.retWin>0 ? allPairs.slice(-S2.retWin) : allPairs; // 表（とシミュレーションの実績）は集計期間の分だけ
  const inWin=new Set(pairs.map(([,b])=>b.period));
  let h=`<div class="card"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">年代別の在籍率・離職率（全世代）</h2>
    <span class="muted" style="font-weight:700">集計する期間</span>
    <select data-ret-win>${[[3,"直近3期"],[5,"直近5期（おすすめ）"],[10,"直近10期"],[0,`全期間（${allPairs.length}期分）`]].map(([v,l])=>`<option value="${v}"${S2.retWin===v?" selected":""}>${l}</option>`).join("")}</select>
    <span class="muted">シミュレーションの在籍率の「実績」も、この期間で計算します。</span></div>
    <p class="desc" style="margin-top:6px">前の期末にいた人のうち、翌期末の名簿にもいた割合が<b>在籍率</b>、いなかった割合が<b>離職率</b>です（${pairs.length?`${pairs[0][1].period}〜${pairs[pairs.length-1][1].period}期の`:""}${pairs.length}期分の合計）。
    年齢は前の期末時点です。入社3年以内の人は年齢に関係なく1行にまとめ、年齢区分の行からは除いています。シミュレーションの前提条件の「実績」と同じ数え方です。</p>`;
  if(!pairs.length) return h+`<p class="muted">連続する2つの期の名簿が登録されると表示されます。</p></div>`;
  // 表示は年齢の高い順（70歳以上 → 29歳以下）、最後に入社3年以内
  const rows=[...RET_KEYS].reverse().map(([k,label,f])=>[k,label,(p)=>!(p.tenure!==null&&p.tenure<3) && p.age!==null && f(p.age)])
    .concat([["new","入社3年以内（年齢を問わず）",(p)=>p.tenure!==null&&p.tenure<3]]);
  const calc=(f,only1)=>{ let n=0, stay=0, leftNames=[];
    pairs.forEach(([a,b])=>{ const bk=new Set(b.ppl.map((p)=>p.key));
      a.ppl.forEach((p)=>{ if(!f(p) || (only1 && !p.k1)) return; n++; if(bk.has(p.key)) stay++; else leftNames.push(`${p.name}（${a.period}→${b.period}期）`); }); });
    return {n, stay, left:n-stay, rate:n?stay/n:null, leftNames}; };
  const data=rows.map(([k,label,f])=>({k,label,all:calc(f,false),t1:calc(f,true)}));
  const maxTurn=Math.max(0.05,...data.map((d)=>d.all.rate===null?0:1-d.all.rate));
  // ---- 期ごとの離職率の推移（右側の表）：各期（前の期末→その期末）の離職率を色の濃さで表示 ----
  const yearCell=(f,[a,b])=>{ const bk=new Set(b.ppl.map((p)=>p.key)); let n=0, st=0;
    a.ppl.forEach((p)=>{ if(!f(p)) return; n++; if(bk.has(p.key)) st++; }); return {n, left:n-st, r:n?(n-st)/n:null}; };
  const grid=rows.map(([k,label,f])=>({k, label, cells:allPairs.map((pr)=>yearCell(f,pr))}));
  const HEAT_MAX=0.2; // 20%以上は一番濃い色
  const heat=(c)=>{ if(c.r===null) return `<td class="c muted">–</td>`;
    const a=Math.min(1,c.r/HEAT_MAX), small=c.n<5;
    const bg=`rgba(235,104,52,${(0.08+0.92*a).toFixed(2)})`, fg= a>0.6 ? "#fff" : "#1f2330";
    return `<td class="c" style="background:${bg};color:${fg};${small?"font-style:italic;opacity:.75;":""}" title="${c.left}/${c.n}人が離職${small?"（対象5人未満）":""}">${Math.round(c.r*100)}%</td>`; };
  const pct=(x)=> x.rate===null ? "–" : Math.round(x.rate*100)+"%";
  const turn=(x)=> x.rate===null ? "–" : Math.round((1-x.rate)*100)+"%";
  h+=`<div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap"><div><table class="grid-tbl"><tr><th rowspan="2">前の期末時点</th><th colspan="4">全社員</th><th colspan="2">うち1級技術者（${modeLabel()}）</th></tr>
    <tr><th>在籍率</th><th>離職率</th><th style="min-width:140px"></th><th>離職した人数</th><th>在籍率</th><th>離職率</th></tr>`+
    data.map((d)=>{ const tr=d.all.rate===null?0:1-d.all.rate;
      return `<tr${MID_KEYS.has(d.k)?' style="background:#fff9e8"':""}><td>${d.label}${MID_KEYS.has(d.k)?' <span class="pill warn">中堅</span>':""}</td>
        <td class="n">${pct(d.all)}<span class="muted">（${d.all.stay}/${d.all.n}人）</span></td><td class="n"><b>${turn(d.all)}</b></td>
        <td><div style="height:10px;background:#d03b3b;border-radius:0 4px 4px 0;width:${(tr/maxTurn*100).toFixed(1)}%" title="離職率 ${turn(d.all)}"></div></td>
        <td class="n">${d.all.n?d.all.left+"人":"–"}</td>
        <td class="n">${pct(d.t1)}${d.t1.n?`<span class="muted">（${d.t1.stay}/${d.t1.n}人）</span>`:""}</td><td class="n">${turn(d.t1)}</td></tr>`; }).join("")+`</table></div>
    <div style="overflow-x:auto;max-width:100%"><table class="grid-tbl"><tr><th rowspan="2">前の期末時点</th><th colspan="${allPairs.length}">期ごとの離職率の推移（全社員）</th></tr>
      <tr>${allPairs.map(([,b])=>`<th class="c"${inWin.has(b.period)?' style="background:#e8efff"':""} title="${b.period-1}期末→${b.period}期末">${b.period}期</th>`).join("")}</tr>`+
      grid.map((g)=>`<tr${MID_KEYS.has(g.k)?' style="background:#fff9e8"':""}><td style="white-space:nowrap">${esc(g.label.replace("（年齢を問わず）",""))}</td>${g.cells.map(heat).join("")}</tr>`).join("")+`</table></div></div>
    <p class="desc" style="margin:6px 0 0">右の表の「◯期」は、前の期末→その期末の1年間の離職率です。色が濃いほど離職率が高く（20%以上は同じ濃さ）、斜体は対象5人未満でぶれやすい値です。青い見出しは、左の表の集計に入っている期です。</p>`;
  // 中堅のまとめ
  const mid=data.filter((d)=>MID_KEYS.has(d.k)).reduce((s,d)=>({n:s.n+d.all.n, stay:s.stay+d.all.stay, names:s.names.concat(d.all.leftNames)}),{n:0,stay:0,names:[]});
  if(mid.n) h+=`<div class="note-box">中堅（30〜49歳・入社3年以内を除く）の離職率は <b>${Math.round((1-mid.stay/mid.n)*100)}%</b>（${mid.n}人中 ${mid.n-mid.stay}人）です。
    ${mid.names.length?`<details class="diff" style="margin-top:4px"><summary>離職した中堅の人</summary><ul>${mid.names.map((x)=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</div>`;
  h+=`<p class="desc" style="margin-top:6px">※ 翌期末の名簿にいない人には、退職のほか、番号が変わって紐付けできていない人も含まれることがあります（データ管理の「期ごとの変化」で確認できます）。人数が少ない区分は、1人の増減で割合が大きく動きます。</p>`;
  return h+`</div>`;
}
