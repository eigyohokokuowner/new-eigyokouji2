/* =====================================================================
   離職は改善している？悪化している？（判断の指標）
   ① 前半と後半の比較 ② 3年移動平均の推移 ③ 入社年度別の3年定着率 ④ 全国（建設業）との比較
   ===================================================================== */
// 全国の参考値（厚生労働省の公表値。年1回更新されるので、新しい値が出たらここを書き換える）
const BENCH={
  annual:{label:"令和7年（2025年）", src:"厚生労働省「雇用動向調査」", con:8.7, conGen:7.9, all:13.7, allGen:11.4},
  grad:{label:"令和5年3月卒・就職後3年以内", src:"厚生労働省「新規学卒就職者の離職状況」", conHigh:40.9, conUniv:26.8, allHigh:36.9, allUniv:31.2, szHigh:36.4, szUniv:31.7},
};
const addYears=(ymd,k)=> String(+ymd.slice(0,4)+k)+ymd.slice(4);
const todayYmd=()=>{ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; };
const midYmd=(a,b)=>{ const t=(s)=>Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6)); const d=new Date((t(a)+t(b))/2);
  return `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,"0")}${String(d.getUTCDate()).padStart(2,"0")}`; };
// 2つの割合の差が偶然でも起きる程度か（2つの割合の検定・z値）
function diffJudge(l1,n1,l2,n2){
  if(!n1 || !n2) return {txt:"–", cls:""};
  if(l1+l2<5) return {txt:"辞めた人が少なく判断できない", cls:"muted"};
  const p=(l1+l2)/(n1+n2), se=Math.sqrt(p*(1-p)*(1/n1+1/n2));
  const z= se ? (l2/n2-l1/n1)/se : 0, up=z>0;
  if(Math.abs(z)>=1.96) return {txt: up?"▲ 悪化（はっきりした差）":"▼ 改善（はっきりした差）", cls: up?"sig-bad":"sig-good", z};
  if(Math.abs(z)>=1.28) return {txt: up?"△ 悪化の傾向（まだ断定できない）":"▽ 改善の傾向（まだ断定できない）", cls: up?"sig-bad2":"sig-good2", z};
  return {txt:"― 誤差の範囲", cls:"muted", z};
}
// 入社年度別（入社した期ごと）の定着：1年・2年・3年以内に辞めた人
function cohortData(){
  const R=S2.rosters; if(!R.length) return {rows:[], firstP:null};
  const firstP=R[0].period, lastP=R[R.length-1].period, today=todayYmd();
  const ends=R.map((r)=>({period:r.period, end:periodEnd(r.period), keys:new Set(r.rows.map(resolveEngcd).filter(Boolean))}));
  const empBy=new Map(EMPLOYEES.map((e)=>[String(e.ENGCD), e]));
  // 辞めた日（分からなければ名簿から範囲を推定）。在籍中なら date=null と「いつまで在籍が確認できたか」
  const leaveOf=(engcd, nday)=>{
    const e=empBy.get(engcd)||{}, rd=d8(e.RETIRE_DATE);
    if(e.STATUS==="retired" && rd) return {date:rd, how:"退職日"};
    const seen=ends.filter((x)=>x.end>=nday);
    const pres=seen.filter((x)=>x.keys.has(engcd));
    const lastPres=pres.length ? pres[pres.length-1] : null;
    if(lastPres){
      const after=seen.find((x)=>x.end>lastPres.end && !x.keys.has(engcd));
      if(after) return {lo:lastPres.end, hi:after.end, how:"名簿から推定"};
      return {date:null, known: e.STATUS!=="retired" ? today : lastPres.end};
    }
    if(e.STATUS!=="retired") return {date:null, known:today};
    return {unknown:true};
  };
  // k年以内に辞めたか：true / false / null（まだk年たっていない・不明）
  const leftWithin=(lv, nday, k)=>{
    const L=addYears(nday,k);
    if(lv.unknown) return {v:null};
    if(lv.date) return {v: lv.date<L};
    if(lv.lo) { if(lv.hi<L) return {v:true}; if(lv.lo>=L) return {v:false}; return {v: midYmd(lv.lo,lv.hi)<L, est:true}; }
    return lv.known>=L ? {v:false} : {v:null};
  };
  const rows=[];
  for(let p=firstP; p<=lastP+1; p++){
    const s=periodStart(p), en=periodEnd(p), mem=new Map();
    const add=(engcd)=>{ if(!engcd || mem.has(engcd)) return; const info=INFO_BY_ENGCD[engcd]||{}; const nd=d8(info.NDAY);
      if(!nd || nd<s || nd>en) return; const e=empBy.get(engcd)||{};
      const age=yearsBetween(d8(info.BDAY), nd), mon=+nd.slice(4,6);
      const type= age===null ? "不明" : (age<=24 && mon>=3 && mon<=5) ? (age<=19?"高卒":"大卒等") : "中途";
      mem.set(engcd,{engcd, name:e.ID_NAME||"", nday:nd, age, type}); };
    const rr=R.find((r)=>r.period===p); if(rr) rr.rows.forEach((r)=>add(resolveEngcd(r)));
    EMPLOYEES.forEach((e)=>add(String(e.ENGCD)));
    if(!mem.size) continue;
    const ppl=[...mem.values()].map((m)=>{ const lv=leaveOf(m.engcd, m.nday);
      return {...m, lv, w:[1,2,3].map((k)=>leftWithin(lv, m.nday, k))}; });
    rows.push({period:p, ppl});
  }
  return {rows, firstP};
}
function renderSignals(stats){
  const allPairs=[]; for(let i=1;i<stats.length;i++) if(stats[i].period===stats[i-1].period+1) allPairs.push([stats[i-1],stats[i]]);
  let h=`<div class="card"><h2>離職は改善している？悪化している？</h2>
    <p class="desc">上の表と同じ数え方（前の期末にいた人が、翌期末の名簿にいなかったら離職）で、変化を4つの方法で確かめます。①②は上の「集計する期間」の設定に合わせて動きます。</p>`;
  if(allPairs.length<2) return h+`<p class="muted">連続する期の名簿が3期分以上登録されると表示されます。</p></div>`;
  const groups=[...RET_KEYS].reverse().map(([k,label,f])=>({k,label,f:(p)=>!(p.tenure!==null&&p.tenure<3) && p.age!==null && f(p.age)}))
    .concat([{k:"new",label:"入社3年以内",f:(p)=>p.tenure!==null&&p.tenure<3}, {k:"all",label:"全社員（合計）",f:()=>true}]);
  const sumPairs=(f,prs)=>{ let n=0,l=0; prs.forEach(([a,b])=>{ const bk=new Set(b.ppl.map((p)=>p.key)); a.ppl.forEach((p)=>{ if(!f(p)) return; n++; if(!bk.has(p.key)) l++; }); }); return {n,l,r:n?l/n:null}; };
  const pc=(x,d=1)=> x===null||x===undefined ? "–" : (x*100).toFixed(d)+"%";

  // ---- ① 前半と後半の比較 ----
  let W= S2.retWin>0 ? S2.retWin : Math.floor(allPairs.length/2), halfNote="";
  if(allPairs.length-W<2){ W=Math.floor(allPairs.length/2); halfNote=`※ 「集計する期間」より前の名簿が足りないため、登録済みの名簿（${allPairs.length}期分）を前後半分に分けて比べています。`; }
  const late=allPairs.slice(-W), early=allPairs.slice(-2*W, -W);
  const rng=(prs)=> prs.length ? `${prs[0][1].period}〜${prs[prs.length-1][1].period}期` : "";
  h+=`<h3 style="font-size:13px;margin:12px 0 4px">① 前半と後半の比較（${rng(early)} → ${rng(late)}）</h3>`;
  if(!early.length) h+=`<p class="muted">比べる前の期間の名簿が足りません。「集計する期間」を短くすると比べられます。</p>`;
  else{
    if(halfNote) h+=`<p class="desc">${halfNote}</p>`;
    else if(early.length<late.length) h+=`<p class="desc">※ 前の期間は名簿が ${early.length}期分しかないため、${early.length}期分で比べています。</p>`;
    h+=`<table class="grid-tbl"><tr><th>前の期末時点</th><th>前半 ${rng(early)}</th><th>後半 ${rng(late)}</th><th>差</th><th>判定</th></tr>`+
      groups.map((g)=>{ const a=sumPairs(g.f,early), b=sumPairs(g.f,late), j=diffJudge(a.l,a.n,b.l,b.n);
        const dd= a.r!==null&&b.r!==null ? ((b.r-a.r)*100) : null;
        return `<tr${g.k==="all"?' style="font-weight:700;border-top:2px solid #c9ceda"':MID_KEYS.has(g.k)?' style="background:#fff9e8"':""}><td>${esc(g.label)}</td>
          <td class="n">${pc(a.r)}<span class="muted">（${a.l}/${a.n}人）</span></td><td class="n">${pc(b.r)}<span class="muted">（${b.l}/${b.n}人）</span></td>
          <td class="n">${dd===null?"–":(dd>0?"+":"")+dd.toFixed(1)+"pt"}</td><td class="${j.cls}">${j.txt}</td></tr>`; }).join("")+`</table>
      <p class="desc" style="margin-top:6px">離職率は、期間内の人数を合計してから割った値です（人数で重み付け）。「はっきりした差」は、偶然ではほとんど起きない大きさの差（統計的に95%の確かさ）、「傾向」はそれより弱い差です。人数が少ない区分は、差が大きく見えても「誤差の範囲」になりやすいです。</p>`;
  }

  // ---- ② 3年移動平均の推移（グループ別） ----
  const MA=[
    {name:"入社3年以内", color:"#2a78d6", f:(p)=>p.tenure!==null&&p.tenure<3},
    {name:"49歳以下（入社3年以内を除く）", color:"#eb6834", f:(p)=>!(p.tenure!==null&&p.tenure<3) && p.age!==null && p.age<50},
    {name:"50〜59歳", color:"#1baf7a", f:(p)=>!(p.tenure!==null&&p.tenure<3) && p.age!==null && p.age>=50 && p.age<60},
    {name:"60歳以上", color:"#eda100", f:(p)=>!(p.tenure!==null&&p.tenure<3) && p.age!==null && p.age>=60},
    {name:"全社員（合計）", color:"#3d4252", f:()=>true},
  ];
  const cats=allPairs.map(([,b])=>b.period+"期");
  const maRows=MA.map((g)=>({...g, pts:allPairs.map(([,b])=>{ const prs=allPairs.filter(([,x])=>x.period>=b.period-2 && x.period<=b.period);
    if(prs.length<2) return null; const s=sumPairs(g.f,prs); return s.n ? {...s, k:prs.length} : null; })}));
  const series=maRows.map((g)=>({name:g.name, color:g.color, values:g.pts.map((x)=>x?+(x.r*100).toFixed(1):null)}));
  S2.lcTips=S2.lcTips||{};
  S2.lcTips.ma=(i)=>`<b>${esc(cats[i])}（${allPairs[i][1].period-2}〜${allPairs[i][1].period}期の平均）</b>`+
    maRows.map((g)=>`<br><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${g.color};margin-right:4px"></span>${esc(g.name)}：${g.pts[i]?pc(g.pts[i].r)+`（${g.pts[i].l}/${g.pts[i].n}人）`:"–"}`).join("")+
    `<br><span class="muted">点線：建設業の全国平均（一般労働者）${BENCH.annual.conGen}%</span>`;
  h+=`<h3 style="font-size:13px;margin:16px 0 4px">② 3年移動平均の推移</h3>
    <p class="desc">各期の値は、その期を含む直近3期分（3期そろわない最初の期は2期分）の人数を合計して出した離職率です。1年ごとのぶれがならされるので、上向きか下向きかが見やすくなります。点にマウスを乗せると内訳が出ます。</p>
    <div class="legend">${MA.map((g)=>`<span><i style="background:${g.color}"></i>${esc(g.name)}</span>`).join("")}
      <span><i style="background:#fff;border-top:2px dashed #8a8f9c;height:0;width:14px;border-radius:0"></i>建設業の全国平均（一般労働者・${BENCH.annual.label}）</span></div>
    ${lineChartSVG(cats, series, "離職率（3年移動平均）", {tip:"ma", unit:"%", refs:[{v:BENCH.annual.conGen, label:`建設業 全国 ${BENCH.annual.conGen}%`}]})}
    <details class="diff"><summary>表で見る</summary><table class="grid-tbl"><tr><th>区分</th>${cats.map((c)=>`<th class="c">${c}</th>`).join("")}</tr>`+
      maRows.map((g)=>`<tr><td style="white-space:nowrap">${esc(g.name)}</td>${g.pts.map((x)=>`<td class="n">${x?pc(x.r):"–"}</td>`).join("")}</tr>`).join("")+`</table></details>`;

  // ---- ③ 入社年度別の3年定着率 ----
  const co=cohortData();
  h+=`<h3 style="font-size:13px;margin:16px 0 4px">③ 入社年度別の定着（入社した期ごと）</h3>
    <p class="desc">入社した期ごとに、入社日から1年・2年・3年たつまでに辞めた人の割合です。全国の「新卒の3年以内離職率」と同じ物差しです。
    新卒相当＝3〜5月に24歳以下で入社した人（19歳以下は高卒相当、20〜24歳は大卒等相当）、それ以外は中途として分けています。</p>`;
  if(!co.rows.length) h+=`<p class="muted">入社日が登録されている人がいません。</p>`;
  else{
    let estN=0, unkN=0;
    const rate=(ppl,k)=>{ const d=ppl.map((p)=>p.w[k-1]); const und=d.filter((x)=>x.v===null).length, left=d.filter((x)=>x.v===true).length;
      d.forEach((x)=>{ if(x.est) estN++; }); return {n:ppl.length, left, und, r: ppl.length&&!und ? left/ppl.length : null}; };
    const cell3=(x)=>{ if(!x.n) return `<td class="c muted">–</td>`;
      if(x.r===null) return `<td class="c muted" title="まだ期間がたっていない人 ${x.und}人">途中<br><span style="font-size:11px">今のところ${x.left}人</span></td>`;
      const a=Math.min(1,x.r/0.5), small=x.n<5;
      return `<td class="c" style="background:rgba(235,104,52,${(0.08+0.92*a).toFixed(2)});color:${a>0.6?"#fff":"#1f2330"};${small?"font-style:italic;opacity:.8;":""}" title="${x.left}/${x.n}人が離職${small?"（対象5人未満）":""}">${Math.round(x.r*100)}%<br><span style="font-size:11px">${x.left}/${x.n}人</span></td>`; };
    co.rows.forEach((r)=>r.ppl.forEach((p)=>{ if(p.lv.unknown) unkN++; }));
    h+=`<table class="grid-tbl"><tr><th rowspan="2">入社した期</th><th rowspan="2">入社人数</th><th colspan="3">内訳</th><th colspan="3">辞めた割合（全員）</th><th colspan="2">3年以内（新卒相当）</th><th rowspan="2">3年以内（中途）</th></tr>
      <tr><th>高卒相当</th><th>大卒等相当</th><th>中途・不明</th><th>1年以内</th><th>2年以内</th><th>3年以内</th><th>高卒相当</th><th>大卒等相当</th></tr>`+
      co.rows.map((r)=>{ const by=(t)=>r.ppl.filter((p)=>p.type===t);
        const left3=r.ppl.filter((p)=>p.w[2].v===true);
        return `<tr><td>${r.period}期</td><td class="n">${r.ppl.length}</td>
          <td class="n">${by("高卒").length}</td><td class="n">${by("大卒等").length}</td><td class="n">${by("中途").length+by("不明").length}</td>
          ${[1,2,3].map((k)=>cell3(rate(r.ppl,k))).join("")}${cell3(rate(by("高卒"),3))}${cell3(rate(by("大卒等"),3))}${cell3(rate(by("中途"),3))}</tr>`+
          (left3.length?`<tr><td></td><td colspan="10" style="padding:0 6px 4px"><details class="diff" style="margin:0"><summary>3年以内に辞めた人：${left3.length}人</summary><ul>${left3.map((p)=>`<li>${esc(p.name)}（${p.type}・入社${p.nday.slice(0,4)}/${+p.nday.slice(4,6)}${p.lv.date?`・退職${p.lv.date.slice(0,4)}/${+p.lv.date.slice(4,6)}`:"・名簿から推定"}）</li>`).join("")}</ul></details></td></tr>`:"");
      }).join("")+`</table>`;
    // まとめ：3年たった期（確定）のうち直近5期分
    const done=co.rows.filter((r)=>r.ppl.every((p)=>p.w[2].v!==null || p.lv.unknown)).slice(-5);
    if(done.length){
      const pool=(t)=>{ const ppl=done.flatMap((r)=>r.ppl.filter((p)=>(!t||p.type===t) && p.w[2].v!==null)); const l=ppl.filter((p)=>p.w[2].v).length; return {n:ppl.length,l,r:ppl.length?l/ppl.length:null}; };
      const hs=pool("高卒"), us=pool("大卒等"), ms=pool("中途"), al=pool(null);
      const cmp=(x,ref)=> x.r===null ? "" : x.r*100<=ref ? `<span class="sig-good">全国より低い</span>` : `<span class="sig-bad">全国より高い</span>`;
      h+=`<div class="note-box"><b>3年たった入社期（${done[0].period}〜${done[done.length-1].period}期入社）の合計</b>：3年以内に辞めた割合
        <table class="grid-tbl" style="margin-top:6px"><tr><th></th><th>自社</th><th>建設業・全国</th><th>全産業・全国</th><th>全産業・100〜499人</th><th></th></tr>
        <tr><td>高卒相当</td><td class="n"><b>${pc(hs.r)}</b><span class="muted">（${hs.l}/${hs.n}人）</span></td><td class="n">${BENCH.grad.conHigh}%</td><td class="n">${BENCH.grad.allHigh}%</td><td class="n">${BENCH.grad.szHigh}%</td><td>${cmp(hs,BENCH.grad.conHigh)}${hs.n&&hs.n<10?' <span class="muted">（人数が少なく参考値）</span>':""}</td></tr>
        <tr><td>大卒等相当</td><td class="n"><b>${pc(us.r)}</b><span class="muted">（${us.l}/${us.n}人）</span></td><td class="n">${BENCH.grad.conUniv}%</td><td class="n">${BENCH.grad.allUniv}%</td><td class="n">${BENCH.grad.szUniv}%</td><td>${cmp(us,BENCH.grad.conUniv)}${us.n&&us.n<10?' <span class="muted">（人数が少なく参考値）</span>':""}</td></tr>
        <tr><td>中途</td><td class="n"><b>${pc(ms.r)}</b><span class="muted">（${ms.l}/${ms.n}人）</span></td><td class="muted" colspan="3">全国の公表値なし</td><td></td></tr>
        <tr><td>全員</td><td class="n"><b>${pc(al.r)}</b><span class="muted">（${al.l}/${al.n}人）</span></td><td colspan="4"></td></tr></table>
        <span class="muted">全国は${BENCH.grad.label}（${BENCH.grad.src}）。全国の値は新卒だけの数字なので、比べるのは新卒相当の行です。</span></div>`;
    } else h+=`<p class="muted">入社から3年たった入社期がまだありません。名簿が増えると合計が出ます。</p>`;
    h+=`<p class="desc" style="margin-top:6px">※ 辞めた日は、工事実績システムの退職日を使います。退職日が未登録の人は、名簿から「いつの期末までいたか」で推定しています（推定 ${estN}件）。
      入社した期に名簿がなく、退職日も未登録で辞めた人は数えられません（${co.firstP}期より前の入社は表示していません）。${unkN?`退職済みで在籍期間が分からない人 ${unkN}人は除いています。`:""}</p>`;
  }

  // ---- ④ 全国（建設業）との比較 ----
  const win= S2.retWin>0 ? allPairs.slice(-S2.retWin) : allPairs;
  const cAll=sumPairs(()=>true, win), cU60=sumPairs((p)=>p.age!==null&&p.age<60, win);
  h+=`<h3 style="font-size:13px;margin:16px 0 4px">④ 全国との比較（1年間の離職率）</h3>
    <table class="grid-tbl"><tr><th></th><th>離職率（1年間）</th><th>備考</th></tr>
      <tr><td><b>自社・全社員</b>（${rng(win)}の平均）</td><td class="n"><b>${pc(cAll.r)}</b><span class="muted">（${cAll.l}/${cAll.n}人）</span></td><td class="muted">定年・再雇用の契約満了を含む</td></tr>
      <tr><td>自社・60歳未満</td><td class="n">${pc(cU60.r)}<span class="muted">（${cU60.l}/${cU60.n}人）</span></td><td class="muted">定年まわりを除いた目安</td></tr>
      <tr><td>建設業・全国（一般労働者）</td><td class="n">${BENCH.annual.conGen}%</td><td class="muted">一番近い比べ相手（パートを除く）</td></tr>
      <tr><td>建設業・全国（パート含む計）</td><td class="n">${BENCH.annual.con}%</td><td></td></tr>
      <tr><td>全産業・全国（一般労働者）</td><td class="n">${BENCH.annual.allGen}%</td><td></td></tr>
      <tr><td>全産業・全国（パート含む計）</td><td class="n">${BENCH.annual.all}%</td><td></td></tr></table>
    <p class="desc" style="margin-top:6px">全国は${BENCH.annual.label}の値（${BENCH.annual.src}）。全国の値は年の途中で入って辞めた人も数えますが、自社の値は期末名簿どうしの比較なので、1年以内に入って辞めた人は数えられず、やや低めに出ます。
      建設業の年齢別・規模別の離職率は公表されていないため、年齢別の比較はできません。</p>`;
  return h+`</div>`;
}

/* ---- C. 再雇用：何歳まで残っているか ---- */
const RET_BANDS=[["55〜58歳",(a)=>a>=55&&a<=58],["59歳（定年の前年）",(a)=>a===59],["60〜64歳",(a)=>a>=60&&a<=64],["65〜69歳",(a)=>a>=65&&a<=69],["70歳以上",(a)=>a>=70]];
function renderRetention(stats){
  let h=`<div class="card"><h2>再雇用：何歳まで残っているか</h2>
    <p class="desc">定年（60歳）以降にどれくらいの人が残っているかを、3つの方法で見ます。期末名簿が増えるほど①の数字が確かになります。</p>`;

  // ① 名簿の期ごとの比較：前の期末にその年齢だった人が、翌期末も在籍していた割合（1年残存率）
  const pairs=[]; for(let i=1;i<stats.length;i++) if(stats[i].period===stats[i-1].period+1) pairs.push([stats[i-1],stats[i]]);
  const agg=(only1)=> RET_BANDS.map(([label,f])=>{
    let n=0, stay=0;
    pairs.forEach(([a,b])=>{ const bk=new Set(b.ppl.map((p)=>p.key));
      a.ppl.forEach((p)=>{ if(p.age===null || !f(p.age) || (only1 && !p.k1)) return; n++; if(bk.has(p.key)) stay++; }); });
    return {label, n, stay, rate: n ? stay/n : null};
  });
  const all=agg(false), t1=agg(true);
  const cell=(x)=> x.n ? `${Math.round(x.rate*100)}%<span class="muted">（${x.stay}/${x.n}人）</span>` : "–";
  h+=`<h3 style="font-size:13px;margin:10px 0 4px">① 1年後も在籍していた割合（期末名簿の比較・実績 ${pairs.length}期分）</h3>`;
  if(!pairs.length) h+=`<p class="muted">連続する2つの期の名簿が登録されると表示されます。</p>`;
  else{
    h+=`<table class="grid-tbl"><tr><th>前の期末時点の年齢</th><th>全社員</th><th>うち1級技術者</th></tr>`+
      all.map((x,i)=>`<tr><td>${x.label}</td><td class="n">${cell(x)}</td><td class="n">${cell(t1[i])}</td></tr>`).join("")+`</table>`;
    // 推定：60歳の人が65歳・70歳まで残る割合（年齢層の1年残存率を毎年かけ合わせる）
    const r6064=all[2].rate, r6569=all[3].rate;
    const thin=all[2].n<10 || all[3].n<10;
    if(r6064!==null){
      const to65=Math.pow(r6064,5), to70= r6569!==null ? to65*Math.pow(r6569,5) : null;
      h+=`<div class="note-box">推定（全社員）：60歳の人が <b>65歳まで残る割合 ≈ ${Math.round(to65*100)}%</b>${to70!==null?`、<b>70歳まで ≈ ${Math.round(to70*100)}%</b>`:""}。
        60〜64歳・65〜69歳の1年残存率を、それぞれ5年分かけ合わせた値です。${thin?"<br>⚠ 対象人数が少ないため、ぶれが大きい参考値です。期末名簿が増えると安定します。":""}</div>`;
    }
  }

  // ② 今の在籍者の60歳以上の年齢分布（最新の期末名簿）
  const last=stats[stats.length-1];
  const ages=last.ppl.filter((p)=>p.age!==null && p.age>=55);
  const maxAge=ages.length ? Math.max(...ages.map((p)=>p.age)) : 0;
  const rows=[]; for(let a=55;a<=Math.max(75,maxAge);a++){ const g=ages.filter((p)=>p.age===a); rows.push({a, n:g.length, n1:g.filter((p)=>p.k1).length}); }
  const mx=Math.max(1,...rows.map((r)=>r.n));
  h+=`<h3 style="font-size:13px;margin:16px 0 4px">② ${last.period}期末の在籍者（55歳以上）の年齢分布</h3>
    <div class="legend"><span><i style="background:${STAGE_BY_KEY.s5.color}"></i>1級技術者</span><span><i style="background:#d4d3cd"></i>それ以外</span></div>
    <div class="pyr" style="grid-template-columns:52px 1fr;max-width:620px">`+
    rows.map((r)=>`<div class="age">${r.a}歳</div><div class="side r"><div class="pbar" style="width:${(r.n/mx*100).toFixed(2)}%">${r.n1?`<span class="seg" style="flex:${r.n1};background:${STAGE_BY_KEY.s5.color}"></span>`:""}${r.n-r.n1?`<span class="seg" style="flex:${r.n-r.n1};background:#d4d3cd"></span>`:""}</div><span class="num">${r.n||""}${r.n1?`（1級 ${r.n1}）`:""}</span></div>`
      +(r.a===59?`<div class="line"><span>↓ 60歳（定年）以上</span></div>`:"")).join("")+`</div>`;

  // ③ 退職者の退職時の年齢（社員データの退職日・生年月日から）
  const retired=EMPLOYEES.filter((e)=>e.STATUS==="retired");
  const withAge=retired.map((e)=>{ const info=INFO_BY_ENGCD[String(e.ENGCD)]||{};
    const rd=String(e.RETIRE_DATE||"").replace(/[^\d]/g,""), bd=String(info.BDAY||"").replace(/[^\d]/g,"");
    const held=has1At(String(e.ENGCD), rd||"99991231");
    const lastP=S2.rosters.length?S2.rosters[S2.rosters.length-1].period:0;
    return {e, age:yearsBetween(bd,rd), k1: held && (!realMode() || ovOf(String(e.ENGCD), lastP)!=="out")}; }).filter((x)=>x.age!==null);
  const buckets=[["59歳以下",(a)=>a<60],["60歳",(a)=>a===60],["61〜64歳",(a)=>a>=61&&a<=64],["65歳",(a)=>a===65],["66〜69歳",(a)=>a>=66&&a<=69],["70歳以上",(a)=>a>=70]];
  h+=`<h3 style="font-size:13px;margin:16px 0 4px">③ 退職したときの年齢（社員データの退職日から）</h3>`;
  if(!withAge.length) h+=`<p class="muted">退職日と生年月日の両方が登録されている退職者がいないため、表示できません（退職者 ${retired.length}人）。工事実績システムの「技術者在籍・所属管理」で退職日を登録すると表示されます。</p>`;
  else h+=`<table class="grid-tbl"><tr><th>退職時の年齢</th>${buckets.map((b)=>`<th>${b[0]}</th>`).join("")}<th>計</th></tr>
      <tr><td>退職者</td>${buckets.map((b)=>`<td class="n">${withAge.filter((x)=>b[1](x.age)).length}</td>`).join("")}<td class="n">${withAge.length}</td></tr>
      <tr><td>　うち1級技術者</td>${buckets.map((b)=>`<td class="n">${withAge.filter((x)=>x.k1&&b[1](x.age)).length}</td>`).join("")}<td class="n">${withAge.filter((x)=>x.k1).length}</td></tr></table>
      <p class="desc" style="margin-top:6px">退職者 ${retired.length}人のうち、退職日と生年月日が分かる ${withAge.length}人の集計です。</p>`;
  return h+`</div>`;
}

/* =====================================================================
   1級候補の個人指定（データ管理）
   分類だけでは決めきれない人（「その他」の技術系の若手など）を、1人ずつ「含める／含めない」に指定する。
   指定は技術者コードごとに Firestore meta/shikakuCandidates に保存し、現状・シミュレーション・対象者リストに反映する。
   ===================================================================== */
// 所属の表示：部署＋役職（どちらも空なら「新規社員を登録」の所属欄 COMPCD）
function empDeptText(e){
  if(!e) return "";
  const t=[e.DEPT,e.POSITION].map((x)=>String(x||"").trim()).filter(Boolean).join(" ");
  if(t) return t;
  const c=String(e.COMPCD||"").trim();
  return /^\d+$/.test(c) ? "" : c;
}
function candPeople(period){
  const roster=S2.rosters.find((x)=>x.period===period) || S2.rosters[S2.rosters.length-1]; if(!roster) return [];
  const d=periodEnd(roster.period);
  return roster.rows.map((r)=>{
    const engcd=resolveEngcd(r); if(!engcd) return null;
    const info=INFO_BY_ENGCD[engcd]||{}, lics=HELD_BY_ENGCD[engcd]||[];
    const tags=[]; if(heldAt(lics,"doboku1",d)) tags.push("1級"); if(heldAt(lics,"doboku1ho",d)) tags.push("1級技士補");
    if(heldAt(lics,"doboku2",d)) tags.push("2級"); if(lics.some((l)=>/土木施工管理技士補/.test(N(l.name)) && gradeOf(N(l.name))===2)) tags.push("2級技士補");
    const ec=effCls(r, roster, engcd);
    return {engcd, no:r.no, name:r.name, cls:ec.cls||"", clsFill:ec.fill, dept:empDeptText(empByEngcd(engcd)), age:yearsBetween(String(info.BDAY||"").replace(/[^\d]/g,""), d), tags,
      auto: ec.cls===null ? true : !!S2.now.cls[ec.cls], period:roster.period};
  }).filter(Boolean);
}
function renderCandCard(){
  const c=S2.cand;
  // 期を自分で選んでいなければ、最新の期末を表示する
  if(S2.rosters.length && (!c.periodPicked || !S2.rosters.some((x)=>x.period===c.period))) c.period=S2.rosters[S2.rosters.length-1].period;
  const P=c.period, src=P!==null?candSourcePeriod(P):null, own=P!==null && S2.cand.byPeriod[String(P)]!==undefined;
  const ov=c.draft || (P!==null?ovMap(P):{});

    ${S2.cand.info?`<span class="muted">（${esc(S2.cand.info)}）</span>`:""}
    ${S2.cand.migrated?`<br><span class="pill warn">これまでの指定は${candPeriods()[0]}期末の指定として扱っています（保存すると期ごとの形式で記録されます）</span>`:""}</p>`;

  ppl.sort((a,b)=>(a.age??999)-(b.age??999));
  h+=`<div class="imp-row"><b>指定する期</b>
      <select data-cand-period>${S2.rosters.map((x)=>`<option value="${x.period}"${x.period===P?" selected":""}>${x.period}期末（${fmtYmdSlash(x.baseDate)}）</option>`).join("")}</select>
      ${own ? `<span class="pill ok">この期の指定あり</span>` : src!==null ? `<span class="pill warn">${src}期末の指定を引き継いで表示中（保存するとこの期の指定になります）</span>` : `<span class="muted">まだ指定がありません</span>`}</div>
    <div class="imp-row">
      <select data-cand="filterCls">${[["その他","分類：その他"],["イロハ","分類：イロハ"],["事務","分類：事務"],["","分類：（空欄）"],["all","すべての分類"],["指定済み","指定済みの人だけ"],["変更","前の期から変わった人だけ"]].map(([v,l])=>`<option value="${esc(v)}"${c.filterCls===v?" selected":""}>${l}</option>`).join("")}</select>
      <label><input type="checkbox" data-cand-chk="onlyCivil"${c.onlyCivil?" checked":""}> 土木系の資格（1級・技士補・2級）がある人だけ</label>
      <input type="search" data-cand="q" value="${esc(c.q)}" placeholder="氏名・社員番号・所属" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">

    ppl.map((p)=>{ const v=ov[p.engcd]||"", pv=prevOv?(prevOv[p.engcd]||""):"";
      return `<tr><td>${esc(p.no)}</td><td>${esc(p.name)}</td><td>${esc(p.dept)||'<span class="muted">–</span>'}</td><td>${esc(clsShow(p))}</td><td class="n">${p.age??"–"}</td>

        <td>${p.tags.includes("1級")?`1級技術者（実働に${(v==="in"||(v!=="out"&&p.auto))?"数える":"<b>数えない</b>"}）`:p.auto?"含める":"含めない"}</td>
        <td><select data-cand-ov="${esc(p.engcd)}"><option value="">分類のとおり</option><option value="in"${v==="in"?" selected":""}>含める</option><option value="out"${v==="out"?" selected":""}>含めない</option></select></td>
        ${prevOv?`<td>${v!==pv?`<span class="pill warn">変更</span> `:""}<span class="muted">${ovLabel(pv)}</span></td>`:""}</tr>`; }).join("")+
    `</table>${noLink?`<p class="desc" style="margin-top:6px">社員データと紐付いていない ${noLink}人は指定できません。</p>`:""}
    <div class="imp-row" style="margin-top:10px"><button class="btn primary" id="candSave"${c.draft?"":" disabled"}>${P}期末の指定として保存</button>

}

/* =====================================================================

function targetLists(){
  const o=S2.now;
  if(!S2.rosters.some((x)=>x.period===o.period)) o.period=S2.rosters[S2.rosters.length-1].period;
  const roster=S2.rosters.find((x)=>x.period===o.period);
  const ppl=computeNow(roster,o).map((p)=>{ const e=p.engcd?empByEngcd(p.engcd):null; return {...p, dept:e?[e.DEPT,e.POSITION].filter(Boolean).join(" "):""}; });
  const nextP=roster.period+1, reg=nijiReg(nextP), E=o.exp;
  const byAge=(a,desc)=> a.sort((x,y)=> desc ? (y.age??-1)-(x.age??-1) : (x.age??999)-(y.age??999));
  const lists=[];
  if(reg){
    const regd=ppl.filter((p)=>p.engcd && reg.has(p.engcd));
    lists.push({k:"s4", title:`二次検定の受検資格者（${nextP}期・登録済み）`, why:`別のシステムで受検資格を算出し、登録した人です。最優先で合格させたい人です。`,
      rows:byAge(regd), cols:["ho","prev","note"]});
    lists.push({k:"s3", title:`1級技士補を持っているが、${nextP}期の受検資格者に登録されていない人`, why:`まだ実務経験が足りないなどの理由で、来期は二次検定を受けられない技士補の人です。`,
      rows:byAge(ppl.filter((p)=>p.stage==="s3")), cols:["ho","exp"]});
  } else {
    lists.push({k:"s4", title:`二次検定の受検資格者（${nextP}期）：未登録`, why:`${nextP}期の受検資格者がまだ登録されていません。上の「二次受検資格者の登録」で登録してください。下は参考として、技士補の取得から${E}年以上の人を出しています（目安）。`,
      rows:byAge(ppl.filter((p)=>p.stage==="s4")), cols:["ho","exp"], est:true});
    lists.push({k:"s3", title:`技士補・上記以外の人（目安）`, why:`1級技士補を持ち、技士補の取得から${E}年に届いていない人です（目安）。`,
      rows:byAge(ppl.filter((p)=>p.stage==="s3")), cols:["ho","exp"], est:true});
  }
  lists.push({k:"s2", title:`一次検定の受検対象（${nextP}期の一次検定を受検できる人・技士補なし）`, why:`受検年度末（${fmtYmdSlash(firstExamYearEnd(roster.period))}）に19歳以上になる、まだ1級技士補を持っていない1級候補です。2級を持っている人には印を付けています。`,
    rows:byAge(ppl.filter((p)=>p.stage==="s2")), cols:["has2"]});
  const prevReg=nijiReg(roster.period);
  lists.push({k:"stuck", title:`前の期（${roster.period}期）にも受検資格があったのに、まだ1級になっていない人`, why: prevReg ? `${roster.period}期の受検資格者に登録されていて、${roster.period}期末時点で1級を持っていない人です。受検・合格の状況を確認したい人です。` : `${roster.period}期の受検資格者が登録されていないため、表示できません。`,
    rows: prevReg ? byAge(ppl.filter((p)=>p.engcd && prevReg.has(p.engcd) && p.stage!=="s5")) : [], cols:["ho","now"]});
  lists.push({k:"retire5", title:`5年以内に60歳（定年）になる1級技術者`, why:`期末時点で55〜59歳。再雇用で残ってもらえるか、後任の育成が必要かを確認したい人です。`,
    rows:byAge(ppl.filter((p)=>p.stage==="s5" && p.age!==null && p.age>=55 && p.age<60),true), cols:["k1"]});
  lists.push({k:"reemp", title:`60歳以上（再雇用など）の1級技術者`, why:`年齢の高い順。いつまで在籍できるかの見通しが、将来の人数に大きく影響します。`,
    rows:byAge(ppl.filter((p)=>p.stage==="s5" && p.age!==null && p.age>=60),true), cols:["k1"]});
  return {roster, nextP, reg, ppl, lists};
}

  return h;

// 貼り付けた番号 → 技術者コード
function nijiPasteResolve(text, roster){
  const nos=String(text||"").split(/[\s,、，]+/).map((x)=>x.trim()).filter(Boolean);
  const found=new Set(), miss=[];
  nos.forEach((no)=>{
    const r=roster.rows.find((x)=>normCode(x.no)===normCode(no));
    const engcd= r ? resolveEngcd(r) : ((EMPLOYEES.find((e)=>empHasNo(e,no))||{}).ENGCD||"");
    if(engcd) found.add(String(engcd)); else miss.push(no);
  });
  return {found, miss, total:nos.length};
}

    n.paste=document.getElementById("nijiPaste").value;
    const r=nijiPasteResolve(n.paste, roster);
    if(id==="nijiPasteReplace") n.draft.set=new Set(r.found); else r.found.forEach((x)=>n.draft.set.add(x));
    n.pasteMsg=`${r.total}件のうち <b>${r.found.size}人</b> を選択しました。`+(r.miss.length?` <span class="err-msg">見つからなかった番号：${r.miss.map(esc).join("、")}</span>`:"");
    renderStruct(); return;
  }
  if(id==="nijiSave"){
    const periods={...S2.niji.periods, [String(P)]:{engcds:[...n.draft.set], updatedAt:Date.now(), updatedBy:(auth.currentUser&&auth.currentUser.email)||""}};
    try{ await setDoc(doc(db,"meta",NIJI_DOC), {periods}); S2.niji.periods=periods; n.draft=null; n.paste=""; n.pasteMsg=""; S2.sim=null; }
    catch(err){ S2.msg="二次受検資格者を保存できませんでした（"+(err.code||err.message)+"）"; }
    renderStruct();
  }
});
structEl.addEventListener("change",(e)=>{
  const t=e.target, n=S2.niji;
  if(t.dataset.nijiPick!==undefined && n.draft){ if(t.checked) n.draft.set.add(t.dataset.nijiPick); else n.draft.set.delete(t.dataset.nijiPick); renderStruct(); }
  else if(t.dataset.nijiChk){ n[t.dataset.nijiChk]=t.checked; renderStruct(); }
  else if(t.dataset.niji){ n[t.dataset.niji]=t.value; renderStruct(); }
});
structEl.addEventListener("click",(e)=>{
  if(e.target.id!=="tlXlsx") return;
  const {roster, lists}=targetLists();
  const wb=XLSX.utils.book_new();
  lists.forEach((L,i)=>{
    const head=["社員番号","氏名","年齢","分類","所属",...L.cols.map((c)=>TL_COLS[c][0])];
    const aoa=[[L.title],[L.why],[],head,...L.rows.map((p)=>[p.no,p.name,p.age??"",clsLabel(p.cls),p.dept,...L.cols.map((c)=>TL_COLS[c][1](p))])];
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=[{wch:10},{wch:14},{wch:6},{wch:8},{wch:30},{wch:14},{wch:12}];

});

/* ---- 工事実績システムに未登録の人（未照合）と、番号は一致・氏名が違う人（要確認） ---- */
function unmatchedSummary(){
  const un=new Map(), chk=[];
  S2.rosters.forEach((x)=>{
    x.rows.forEach((r,i)=>{
      if(r.how==="手動") return; // 自分で決めた紐付け（「紐付けない」を含む）は対象外
      const m=matchRosterRow(r);
      if(!m.engcd){
        const k=normCode(r.no)+(r.skipNo?"|"+normPersonName(r.name):""); const u=un.get(k)||{no:r.no, name:r.name, periods:[], cls:"", skipNo:!!r.skipNo};
        u.periods.push(x.period); if(!x.noCls) u.cls=r.cls||""; un.set(k,u);
      } else if(m.how==="番号・氏名違い"){
        chk.push({period:x.period, idx:i, no:r.no, name:r.name, engcd:m.engcd, emp:empByEngcd(m.engcd)});
      }
    });
  });
  const list=[...un.values()].sort((a,b)=>String(a.no).localeCompare(String(b.no),"ja",{numeric:true}));
  list.forEach((u)=>u.periods.sort((a,b)=>a-b));
  return {list, chk};
}
const periodRange=(ps)=> ps.length===1 ? `${ps[0]}期末` : `${ps[0]}〜${ps[ps.length-1]}期末（${ps.length}期）`;
function renderUnmatchedCard(){
  if(!S2.rosters.length) return "";
  const {list, chk}=unmatchedSummary();
  let h=`<div class="card"><h2>工事実績システムに未登録の人：${list.length}人</h2>
    <p class="desc">期末名簿に載っているのに、工事実績システムの社員データと紐付かない人です（昔の退職者など）。年齢が分からないため、在籍率・離職率の計算から外れています。
    工事実績システムで<b>退職者として登録</b>してください（技術者コードは下の社員番号と同じ番号で、生年月日は必ず、入社日・退職日も分かれば入力）。登録すると、名簿を取り込み直さなくても自動で紐付きます。</p>`;
  if(list.length){
    h+=`<div class="imp-row"><button class="btn" id="unmatchedXlsx">この一覧をExcelで出力</button></div>
      <div id="unmatchedList" data-keep-scroll style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px">
      <table class="grid-tbl" style="width:100%"><tr><th>社員番号</th><th>氏名</th><th>名簿に載っている期</th><th>最後の分類</th><th>備考</th></tr>`+
      list.map((u)=>`<tr><td>${esc(u.no)}</td><td>${esc(u.name)}</td><td>${esc(periodRange(u.periods))}</td><td>${esc(u.cls?clsLabel(u.cls):"–")}</td><td>${u.skipNo?'<span class="pill warn">番号が他の社員と重複</span> 別の技術者コードで登録してください（氏名で紐付きます）':""}</td></tr>`).join("")+`</table></div>`;
  } else h+=`<p class="muted">すべての人が工事実績システムの社員データと紐付いています。</p>`;
  if(chk.length){
    h+=`<h3 style="font-size:13px;margin:16px 0 4px">番号は一致するが氏名が違う人（要確認）：${chk.length}件</h3>
      <p class="desc">昔の社員番号が別の人に使い回されていると、別人と紐付いてしまいます。同じ人なら「同じ人」、別の人なら「別の人」を押してください（その期の名簿に記録します）。「別の人」にした人は、番号では照合せず、氏名で照合します。工事実績システムに登録すると自動で紐付きます。</p>
      <table class="grid-tbl"><tr><th>期</th><th>名簿の社員番号</th><th>名簿の氏名</th><th>番号が一致した社員</th>${canEdit?"<th></th>":""}</tr>`+
      chk.map((c)=>`<tr><td>${c.period}期末</td><td>${esc(c.no)}</td><td>${esc(c.name)}</td><td>${esc(empLabel(c.emp))}</td>
        ${canEdit?`<td><button class="btn" data-fix-link="${c.period}|${c.idx}|${esc(c.engcd)}">同じ人</button> <button class="btn" data-fix-link="${c.period}|${c.idx}|">別の人</button></td>`:""}</tr>`).join("")+`</table>`;
  }
  return h+`</div>`;
}
structEl.addEventListener("click", async (e)=>{
  if(e.target.id==="unmatchedXlsx"){
    const {list}=unmatchedSummary();
    const aoa=[["工事実績システムに未登録の人（期末名簿と紐付かない人）"],[],["社員番号","氏名","名簿に載っている期","最後の分類","備考"],...list.map((u)=>[u.no,u.name,periodRange(u.periods),u.cls?clsLabel(u.cls):"",u.skipNo?"番号が他の社員と重複：別の技術者コードで登録":""])];
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=[{wch:10},{wch:16},{wch:22},{wch:10}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "未登録の人"); XLSX.writeFile(wb, "工事実績システム未登録の人.xlsx");
    return;
  }
  const b=e.target.closest("[data-fix-link]"); if(!b) return;
  const [ps, is, engcd]=b.dataset.fixLink.split("|"); const period=parseInt(ps,10), idx=parseInt(is,10);
  const roster=S2.rosters.find((x)=>x.period===period); if(!roster) return;
  // 同じ人 → その社員に固定（手動）。別の人 → 番号での照合をやめ、氏名で照合し直す（工事実績システムに登録されれば自動で紐付く）
  const rows=roster.rows.map((r,i)=> i!==idx ? r : engcd ? {...r, engcd, how:"手動", skipNo:false} : {...r, engcd:"", how:"なし", skipNo:true});
  try{ await setDoc(doc(db,"meta",ROSTER_PREFIX+period), {...roster, rows}); roster.rows=rows; S2.sim=null; }
  catch(err){ S2.msg="記録できませんでした（"+(err.code||err.message)+"）"; }
  renderStruct();
});

/* ---- 操作 ---- */
structEl.addEventListener("click", async (e)=>{
  const sb=e.target.closest("[data-sub]"); if(sb){ S2.sub=sb.dataset.sub; renderStruct(); return; }
  if(e.target.id==="impCancel"){ S2.imp=null; renderStruct(); return; }
  if(e.target.id==="impSave"){ await saveRoster(); return; }
  const del=e.target.closest("[data-del-period]");
  if(del){
    const p=parseInt(del.dataset.delPeriod,10);
    if(!confirm(p+"期末の名簿を削除します。よろしいですか？")) return;
    try{ await deleteDoc(doc(db,"meta",ROSTER_PREFIX+p)); S2.rosters=S2.rosters.filter((x)=>x.period!==p); }
    catch(err){ alert("削除できませんでした（"+(err.code||err.message)+"）"); }
    renderStruct();
  }
});
structEl.addEventListener("change", async (e)=>{
  if(e.target.id==="rosterFile" && e.target.files[0]){
    S2.msg="";
    try{
      const parsed=await parseRosterFile(e.target.files[0]);
      parsed.rows=parsed.rows.map((r)=>({...r, ...matchRosterRow(r)}));
      S2.imp=parsed;
    }catch(err){ S2.imp=null; S2.msg="ファイルを読み取れませんでした（"+err.message+"）"; }
    renderStruct(); return;
  }
  if(e.target.id==="impPeriod" && S2.imp){ const v=parseInt(e.target.value,10); if(v>0){ S2.imp.period=v; renderStruct(); } return; }
  if(e.target.dataset.impRow!==undefined && S2.imp){
    const r=S2.imp.rows[parseInt(e.target.dataset.impRow,10)];
    r.engcd=e.target.value; r.how="手動"; // 自分で選んだ紐付け（「紐付けない」も含む）は、後で自動照合し直さない
    renderStruct();
  }
});
async function saveRoster(){
  const imp=S2.imp; if(!imp) return;
  if(S2.rosters.some((x)=>x.period===imp.period) && !confirm(imp.period+"期末の名簿はすでに登録されています。置き換えますか？")) return;
  S2.busy=true; renderStruct();
  const rec={
    period:imp.period, baseDate:periodEnd(imp.period), fileName:imp.fileName, sheetName:imp.sheetName, noCls:!imp.hasCls,
    importedAt:Date.now(), importedBy:(auth.currentUser&&auth.currentUser.email)||"",
    rows:imp.rows.map((r)=>({no:r.no, name:r.name, cls:r.cls, engcd:r.engcd||"", how:r.how})),
  };
  try{
    await setDoc(doc(db,"meta",ROSTER_PREFIX+imp.period), rec);
    S2.rosters=[...S2.rosters.filter((x)=>x.period!==imp.period), rec].sort((a,b)=>a.period-b.period);
    S2.imp=null; S2.msg="";
  }catch(err){
    S2.msg="保存できませんでした（"+(err.code||err.message)+"）。Firestoreのセキュリティルールで meta への書き込みが許可されているか確認してください。";
  }
  S2.busy=false; renderStruct();
}

/* ---- タブ切り替え ---- */
document.querySelector(".tabsw").addEventListener("click", async (e)=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  const tab=b.dataset.tab;
  document.querySelectorAll(".tabsw button").forEach((x)=>x.classList.toggle("on", x===b));
  appEl.classList.toggle("tab-struct", tab==="struct");
  structEl.hidden = tab!=="struct";
  if(tab==="struct"){
    if(state.editOrder) setEditMode(false);
    renderStruct();
    if(!S2.loaded){ await loadRosters(); renderStruct(); }
  }
});

/* =====================================================================
   ログイン → 読み込み
   ===================================================================== */
const loginEl=document.getElementById("login"), appEl=document.getElementById("app");
const loginBtn=document.getElementById("loginBtn"), loginErr=document.getElementById("loginErr");
async function doLogin(){
  loginErr.textContent=""; loginBtn.disabled=true;
  try{ await signInWithEmailAndPassword(auth, document.getElementById("loginId").value.trim(), document.getElementById("loginPw").value); }
  catch(e){ loginErr.textContent="ログインに失敗しました（メールアドレスまたはパスワードが違います）"; }
  loginBtn.disabled=false;
}
loginBtn.onclick=doLogin;
document.getElementById("loginPw").addEventListener("keydown",(e)=>{ if(e.key==="Enter") doLogin(); });

async function start(force){
  wrapEl.innerHTML=`<div class="loading">データを読み込んでいます…</div>`;
  try{
    if(state.editOrder) setEditMode(false);
    const [{data, latest}]=await Promise.all([loadData(force), loadOrderAndRole()]);
    buildRows(data);
    const d=latest ? new Date(latest) : null, p=(n)=>String(n).padStart(2,"0");
    document.getElementById("metaText").textContent =
      (d ? `データ更新：${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}　` : "") +
      `登録 ${ROWS.length}名（在職 ${ROWS.filter((r)=>!r.retired).length}名）`;
    document.getElementById("unmatchedBtn").textContent=`列に無い資格（${UNMATCHED.length}）`;
    render();
  }catch(e){
    console.error(e);
    wrapEl.innerHTML=`<div class="loading">読み込みに失敗しました（${esc(e.code||e.message)}）</div>`;
  }
}
onAuthStateChanged(auth,(user)=>{
  if(user){ loginEl.hidden=true; appEl.hidden=false; start(false); }
  else { appEl.hidden=true; loginEl.hidden=false; }
});
